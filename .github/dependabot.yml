version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      aws:
        patterns: ["aws-*"]
      tokio-stack:
        patterns: ["tokio*", "futures*", "tracing*"]
      serde-stack:
        patterns: ["serde*", "toml"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

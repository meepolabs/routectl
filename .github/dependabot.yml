version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # Active integration branch. The default branch lags well behind
    # develop, so bumps raised against it are stale on arrival; target
    # develop where the code is built and tested.
    target-branch: "develop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      aws:
        patterns: ["aws-*"]
      tokio-stack:
        patterns: ["tokio*", "futures*", "tracing*"]
      serde-stack:
        patterns: ["serde*", "toml"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

name: release

# Builds and signs release binaries for tags matching `v*`.
#
# Targets shipped (4 bare binaries):
#   - linux x86_64    routectl-<v>-linux-x86_64       (glibc 2.35, ubuntu-22.04)
#   - linux aarch64   routectl-<v>-linux-aarch64      (cross-compiled, glibc 2.35)
#   - macos aarch64   routectl-<v>-macos-aarch64      (apple silicon)
#   - windows x86_64  routectl-<v>-windows-x86_64.exe
#
# Bare binary, no archive: routectl is a single executable with no man
# pages or shell completions to bundle. Users `chmod +x` and run, or
# `mv` into PATH. macOS Gatekeeper / Windows SmartScreen behavior is
# the same as it would be for a tar.xz/zip-wrapped binary -- wrapping
# adds friction without removing the prompt.
#
# Provider features: every binary ships
# `openai-compat + anthropic-api + bedrock`. The CLI Cargo.toml
# force-enables all three regardless of build flags, so platform does
# not change provider availability.
#
# Intel macOS dropped: the Apple Silicon transition is complete enough
# that x86_64-apple-darwin is not worth the CI minutes for a developer
# tool. Add the matrix entry back if a user asks.
#
# .deb dropped: routectl is a single-binary developer tool with no
# Debian/Ubuntu users in flight. The cargo-deb metadata in
# routectl-cli/Cargo.toml is preserved so a future PR can re-enable
# the deb matrix when an apt repo is set up.
#
# Signing: a single `SHA256SUMS` aggregate file at the release root
# is signed with sigstore cosign in keyless mode. The signature is
# bound to this workflow's OIDC identity AND specifically to
# release.yml at the tag's ref. Verify with:
#
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github\.com/meepolabs/routectl/\.github/workflows/release\.yml@refs/tags/v[0-9]' \
#     --certificate-github-workflow-repository meepolabs/routectl \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --bundle SHA256SUMS.cosign.bundle SHA256SUMS
#
# Then verify each binary against SHA256SUMS:
#   sha256sum -c SHA256SUMS
#
# Per-binary cosign bundles dropped: the aggregate SHA256SUMS chains
# trust to every binary, so per-file sigstore bundles were redundant.
# Operators verify SHA256SUMS once, then trust the binaries it lists.
#
# Pre-flight: a `validate` job re-runs fmt + clippy + workspace tests
# from the tag's ref BEFORE any binary is built. This blocks signed
# attestations being attached to broken binaries -- pre-merge PR CI
# does not protect against a tag pointing at a different SHA.
#
# Provenance: each binary is published with a SLSA build-provenance
# attestation via actions/attest-build-provenance. Attestations show
# up natively on the GitHub Releases page; permissions are scoped
# per job so id-token / attestations / contents writes are only
# granted where needed.
#
# Dry-run: `workflow_dispatch` runs the FULL pipeline (validate +
# build + attest + SHA256SUMS sign + assertions) using a synthetic
# version string supplied at trigger time, but SKIPS the GitHub
# Releases upload step. Use this to exercise pipeline changes without
# burning a real tag. Trigger via the Actions tab UI or:
#   gh workflow run release.yml --ref develop -f version=0.0.0-dev
# Note: cosign signatures from a workflow_dispatch run are bound to
# the branch ref (`@refs/heads/develop`), so they do NOT pass the
# published verification regexp (which pins to `@refs/tags/v[0-9]`).
# The bundle is still produced; it's just not verifiable as a
# real-release signature. That's intentional -- only tag-push runs
# produce real releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Bare semver for binary naming (e.g. 0.0.0-dev). NEVER publishes -- push a v* tag for a real release.'
        required: true
        default: '0.0.0-dev'
        type: string

# Default permissions are minimal. Per-job blocks add what each job
# needs (id-token + attestations for build, contents:write for
# release).
permissions:
  contents: read

# Serialize runs against the same ref, but NEVER cancel one. Every other
# workflow here cancels a superseded run because re-running it is free;
# this one attaches signed attestations and uploads release assets, so a
# cancellation lands mid-publish and leaves a release half-populated with
# no signal that it is incomplete. Waiting for the in-flight run costs
# minutes; interrupting it costs a broken release. A second run against
# the same ref queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: routectl
  # Tag-style version string (e.g. "v0.5.0") consumed by every step
  # that derives binary filenames or release-notes lookups. On tag
  # push, this is the tag name verbatim. On workflow_dispatch (dry-run),
  # this is `v<inputs.version>`. Steps strip the leading `v` in shell:
  #   bash:  version="${ROUTECTL_TAG#v}"
  #   pwsh:  $version = $env:ROUTECTL_TAG -replace '^v',''
  ROUTECTL_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  validate:
    name: validate (pre-flight)
    runs-on: ubuntu-22.04
    # Hard cap. PR CI gates the same checks but a tag can be pushed
    # against any SHA, so this is the ONLY pre-build gate at release
    # time -- a hung test must not block the pipeline indefinitely.
    #
    # RAISED from 20 on measurement. The old cap could no longer clear a
    # HEALTHY run: on the same commit, ci.yml's `cargo test --workspace
    # --release` -- the identical command on the identical runner class,
    # uncapped -- took 27m22s on its own and passed. This job runs that
    # same suite after a 2m19s clippy, so 20m could not have been enough
    # whatever the suite did. The last two runs to clear this job took
    # 13m36s and 14m38s, both in June, already within 6 minutes of the
    # cap; the suite has grown since.
    #
    # The cap still exists to stop a HUNG test, which is
    # minutes-versus-forever, so a larger number costs nothing against
    # that purpose. A too-small one cancels healthy runs, and GitHub
    # reports a timeout as `cancelled` rather than as a failure -- which
    # reads like an external stop and hides the cause. 45 leaves headroom
    # over the ~30m this job now needs without approaching forever.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Reject malformed `version` inputs from workflow_dispatch
      # before the value flows into filenames, env vars, and `awk`
      # patterns. `gh api workflows/.../dispatches` accepts
      # multi-line input strings; without this guard a value like
      # "0.0.0\nINJECTED=evil" would inject an extra entry into
      # $GITHUB_ENV via `echo "ARTIFACT=..."`. Trigger requires
      # repo-write so the practical risk is low, but a one-line
      # regex closes the surface entirely. Tag pushes skip this --
      # GitHub already constrains tag refs to `v*` per `on.push.tags`.
      - name: validate workflow_dispatch input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          v='${{ inputs.version }}'
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::workflow_dispatch input 'version' must be bare semver (e.g. 0.0.0-dev), got: $v" >&2
            exit 1
          fi

      # The action's code is SHA-pinned and the Rust version is passed as an
      # explicit input, rather than riding a `@<rust-version>` ref. Those
      # refs are BRANCHES, not tags: the only tag this action publishes is
      # v1, and each `@1.NN.N` is v1 plus a one-line commit hardcoding that
      # default. A branch is the weakest ref there is, and this file pins
      # everything else precisely because refs move -- the v1 tag itself
      # moved during the audit that produced this change. Passing the
      # version here also keeps it legible in the workflow instead of
      # encoded in a ref name.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace --release
        run: cargo test --workspace --release

      - name: cargo check (lean providers build, no aws-* deps)
        run: cargo check -p routectl-providers --no-default-features --features openai-compat,anthropic-api

      # Re-runs the RustSec advisory check against Cargo.lock at the
      # tag's ref. ci.yml runs this on PRs and pushes to main/develop,
      # but a tag pushed against a SHA that hasn't seen CI (or against
      # a SHA that pre-dates a newly-published advisory) would
      # otherwise produce signed binaries containing a known-vulnerable
      # dep with no second gate.
      #
      # Run as a CLI, NOT via rustsec/audit-check: that action reports
      # through the check-runs API, which needs `checks: write`. This
      # workflow grants `contents: read`, so the action failed with
      # "Resource not accessible by integration" whatever the advisory
      # state -- meaning the only pre-flight audit gate at release time
      # was failing for a permissions reason rather than a real finding.
      # ci.yml migrated off it for exactly this reason; the migration had
      # not reached here. The CLI just exits non-zero on an advisory and
      # works under a read-only token.
      #
      # The scanner is version-pinned like everything else in this file:
      # an unpinned `cargo install` lets the tool that decides whether a
      # release ships drift between runs. Bump deliberately.
      - name: install and run cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit


  build:
    needs: [validate]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # `target` is the LLVM triple consumed by `cargo build --target`.
        # `name` is the human-friendly suffix used in binary filenames
        # and workflow-artifact names (`linux-x86_64`,
        # `macos-aarch64`, etc.) -- the LLVM triple is accurate but
        # noisy on a release page.
        # Intel macOS dropped: routectl is a developer tool and the
        # Apple Silicon transition is past the point where shipping
        # x86_64-apple-darwin earns its CI minutes. Add it back if
        # someone asks.
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            os: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            name: macos-aarch64
            os: macos-14
            cross: false
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Pinned to the same exact channel as rust-toolchain.toml and ci.yml,
      # NOT `stable`. A release artifact built by a toolchain no gate ever
      # ran is not reproducible: rebuilding the same tag months later would
      # pick a different compiler and produce different bytes, which
      # undercuts the provenance attestation this workflow goes on to
      # generate. Bumping the pin is a deliberate one-line change here and
      # in rust-toolchain.toml.
      #
      # Action SHA-pinned with the version as an explicit input, per the
      # reasoning at the validate job's toolchain step.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: install aarch64 cross toolchain
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }} -p routectl-cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"

      # Rename the built binary to its release-facing name and compute
      # SHA256. The `.sha256` sidecar is uploaded as a workflow artifact
      # so the release job can aggregate into SHA256SUMS; it is NOT
      # included in the final GitHub Release (the aggregate replaces
      # it). Bare-binary suffix matches the matrix `name`.
      - name: stage binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${ROUTECTL_TAG#v}"
          out="${BIN_NAME}-${version}-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$out"
          chmod 755 "$out"
          shasum -a 256 "$out" > "${out}.sha256"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      - name: stage binary (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:ROUTECTL_TAG -replace '^v',''
          $out = "$env:BIN_NAME-$version-${{ matrix.name }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $out
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          "$hash  $out" | Out-File -Encoding ascii "$out.sha256"
          "ARTIFACT=$out" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-${{ matrix.name }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error

  release:
    name: github release
    runs-on: ubuntu-22.04
    needs: [build]
    # contents:write to publish the GitHub Release;
    # id-token:write + attestations:write so we can sign the
    # aggregate SHA256SUMS file with cosign + emit a build-provenance
    # attestation. SHA256SUMS is the single trust anchor users verify
    # against, so it MUST be signed with the same OIDC identity as
    # this workflow.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: assert all matrix targets present
        shell: bash
        run: |
          set -euo pipefail
          # Four bare binaries: linux x86_64+aarch64, macos aarch64,
          # windows x86_64.exe. If any is missing (e.g. a build matrix
          # entry failed under fail-fast: false), refuse to publish a
          # partial release that would have plausibly-named binaries
          # but a missing target. Operators have to decide whether to
          # re-run the failed shard or accept the partial release; we
          # don't make that call silently.
          version="${ROUTECTL_TAG#v}"
          for name in linux-x86_64 linux-aarch64 macos-aarch64; do
            f="dist/${BIN_NAME}-${version}-${name}"
            if [ ! -f "$f" ]; then
              echo "FAIL: missing binary: $f" >&2
              ls -1 dist/ >&2
              exit 1
            fi
          done
          if [ ! -f "dist/${BIN_NAME}-${version}-windows-x86_64.exe" ]; then
            echo "FAIL: missing binary: dist/${BIN_NAME}-${version}-windows-x86_64.exe" >&2
            ls -1 dist/ >&2
            exit 1
          fi

      - name: aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS
          for f in *.sha256; do cat "$f" >> SHA256SUMS; done
          # Per-file .sha256 sidecars are now redundant -- the aggregate
          # SHA256SUMS is the only checksum file in the published
          # release. Remove them so the upload step doesn't ship them.
          rm -f *.sha256

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sign aggregate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # SHA256SUMS is the canonical trust anchor: download
          # SHA256SUMS, verify the cosign signature, then trust every
          # binary it lists via `sha256sum -c SHA256SUMS`. Without
          # signing the aggregate, a swap of SHA256SUMS would go
          # undetected and the binaries it names would inherit the
          # tamper. Sign once, verify the chain end to end:
          #
          #   cosign verify-blob \
          #     --certificate-identity-regexp '...' \
          #     --certificate-oidc-issuer ... \
          #     --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: attest SHA256SUMS provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${ROUTECTL_TAG#v}"
          # Use a LITERAL match (`index()`) instead of a regex
          # so version strings containing regex metacharacters
          # (`.` is the practical case -- every semver) don't
          # accidentally match neighboring sections. Without this,
          # `[0.5.0]` would also match a hypothetical `[0a5b0]`.
          awk -v needle="[$version]" '
            /^## \[/ {
              if (capture) exit
              if (index($0, needle)) { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          # Stable releases (v1.2.3) MUST have a matching CHANGELOG
          # section. Pre-releases (v1.2.3-rc.0, -alpha.1, etc.) AND
          # workflow_dispatch dry-runs get a stub fallback so we can
          # exercise the pipeline without editing CHANGELOG. This
          # catches the silent-failure mode where a typo in the
          # heading drops us to the stub on a real release.
          if [ ! -s release_notes.md ]; then
            if [[ "$version" == *-* ]] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Pre-release ${ROUTECTL_TAG}." > release_notes.md
            else
              echo "FAIL: no CHANGELOG section for [$version]" >&2
              echo "  expected a heading like '## [$version] - YYYY-MM-DD'" >&2
              echo "  in /CHANGELOG.md" >&2
              exit 1
            fi
          fi

      # Real release upload -- only on tag push. workflow_dispatch
      # runs everything else (validate, build, attest, assert-targets,
      # SHA256SUMS sign) but stops short of creating a GitHub Release.
      # This makes workflow_dispatch a true dry-run of the pipeline.
      - name: publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: dry-run summary (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "::notice title=Dry-run complete::Pipeline ran end-to-end for ${ROUTECTL_TAG}; GitHub Releases publish was SKIPPED. Push a v* tag to publish for real."
          echo "Artifacts produced (uploaded as workflow run artifacts only):"
          ls -1 dist/

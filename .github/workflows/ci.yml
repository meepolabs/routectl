name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege per workflow. Default GitHub permissions are
# often read/write inherited; explicit `contents: read` here makes
# the scope visible and overrideable per-job if a future step needs
# more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Build aws-lc-sys from its vendored AWS-LC source. Unset, its build
  # script adopts any AWS-LC it detects via OPENSSL_DIR or pkg-config, so
  # runner-image contents could select the crypto backend a build links;
  # STATIC likewise keeps an ambient AWS_LC_SYS_STATIC=0 from turning the
  # vendored build into a dynamic library. scripts/check-aws-lc-pin.sh
  # enforces both pins and rejects any other setting of either variable.
  # A target-suffixed variable the runner itself exports would still
  # outrank them, so every job runs scripts/assert-aws-lc-env.sh straight
  # after checkout, bar the exemptions check-aws-lc-pin.sh lists.
  AWS_LC_SYS_USE_SYSTEM: "0"
  AWS_LC_SYS_STATIC: "1"

jobs:
  check:
    name: fmt + clippy + check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # cargo fmt walks the module tree and so never opens an `include!`d
      # fragment; without this step the check above passes vacuously on them.
      - name: rustfmt --check on include!d fragments
        run: bash scripts/fmt-fragments.sh

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The live provider test targets are `test = false`, which hides them
      # from `--all-targets` -- even when `--test` names them in the same
      # invocation -- so they get their own lint step.
      - name: cargo clippy (live provider test targets)
        run: cargo clippy -p routectl-cli -p routectl-router --all-features --test live_matrix --test live_anthropic_oauth --test live_learned_capability -- -D warnings

      - name: cargo check (lean providers build, no aws-* deps)
        run: cargo check -p routectl-providers --no-default-features --features openai-compat,anthropic-api

      # Scoped to the PUBLIC doc surface (no --document-private-items): a
      # private-items pass resolves links that break in the published docs,
      # so denying against it would green-light the very breakage this
      # step catches.
      - name: cargo doc (rustdoc lints denied)
        env:
          RUSTDOCFLAGS: -D rustdoc::all
        run: cargo doc --workspace --all-features --no-deps

  # Per-crate legs on the plain debug profile, for two purposes.
  #
  # Reduced feature sets. The all-features clippy leg above cannot see a
  # lane's own reduced build: feature unification means a workspace build
  # always has every gate on, so dead code behind a narrower feature set,
  # lints that only fire without the default features, and tests that only
  # compile or fail there stay invisible. One leg per lane that has a
  # feature gate. routectl-providers rejects a zero-provider build at
  # compile time, so every providers lane names at least one provider
  # feature.
  #
  # Debug-assertion and overflow coverage. The workspace suite in the test
  # job runs on the test-release profile, which compiles out `debug_assert!`
  # and overflow checks, so these legs are the only CI run with both on.
  # Every workspace crate has a default-features leg here, so an assertion
  # behind a default feature is exercised; crates with feature gates also
  # get reduced legs.
  #
  # Each leg lints and then tests the same args, so its feature set is
  # resolved once. CI only, deliberately not the pre-commit hook -- the hook
  # is already minutes long cold, and these legs each pay a fresh
  # feature-set compile.
  debug-lanes:
    name: debug lanes (clippy + test)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core (default features)
            args: -p routectl-core
          - name: usage (default features)
            args: -p routectl-usage
          - name: testkit (default features)
            args: -p routectl-testkit
          - name: cli (default features)
            args: -p routectl-cli
          - name: router (default features)
            args: -p routectl-router
          - name: providers (default features)
            args: -p routectl-providers
          - name: auth (default features)
            args: -p routectl-auth
          - name: router (no default features)
            args: -p routectl-router --no-default-features
          - name: providers (anthropic-api only)
            args: -p routectl-providers --no-default-features --features anthropic-api
          - name: providers (openai-compat only)
            args: -p routectl-providers --no-default-features --features openai-compat
          - name: providers (gemini only)
            args: -p routectl-providers --no-default-features --features gemini
          - name: providers (openai-responses only)
            args: -p routectl-providers --no-default-features --features openai-responses
          - name: providers (bedrock only)
            args: -p routectl-providers --no-default-features --features bedrock
          - name: auth (no default features)
            args: -p routectl-auth --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy -- ${{ matrix.name }}
        run: cargo clippy ${{ matrix.args }} --all-targets -- -D warnings

      # Plain debug profile, not the release-semantics test profile the main
      # suite runs under: these legs are where `debug_assert!` and overflow
      # checks stay exercised in CI, since the main suite compiles them out.
      - name: cargo test -- ${{ matrix.name }}
        run: cargo test ${{ matrix.args }}

  msrv:
    name: msrv check (1.95.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (workspace, MSRV 1.95.0)
        run: cargo check --workspace --all-features

  test:
    name: test
    runs-on: ubuntu-22.04
    # The workspace suite runs once, inside the network-isolation step, which
    # is bounded by its own timeout and per-leg deadlines. Outside it are
    # only setup and the conservation step, which reuses that step's build.
    # 164 = the isolation step's 104 + 60 for everything else;
    # scripts/check-live-gate-isolation.test.sh keeps this at least 60
    # minutes above that step.
    timeout-minutes: 164
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The standard gate under hostile conditions, and the job's only run of
      # the workspace suite: every credential variable the live provider
      # tests read is planted with a synthetic value, then
      # `scripts/test-gate.sh workspace-all-features` (the all-features
      # workspace suite on the test-release profile) runs in a network
      # namespace whose recorder captures every packet to a non-loopback
      # address or to the resolver. The all-features run contains every test
      # of the default-features run and of the routectl-router gen-catalog
      # lib run (the catalog-codegen tests: the selectors/snapshot flag welds
      # and the catalog_baked.rs drift guards), as their test inventories
      # show. Tests that compile only with a feature off, such as the
      # routectl-router cfg(not(feature = "gemini")) cases, are not in it;
      # the debug-lanes job lints and runs those, outside the namespace and
      # without the planted credentials. Zero attempts is the pass
      # condition; each live target, named explicitly under the same
      # variables, is a positive control that must attempt -- inside the
      # namespace, so nothing leaves the runner.
      # --require-netns: on CI a missing namespace is a failure, not a skip.
      # 104 minutes = STEP_BUDGET / 60 in the script: its worst-case deadline
      # sum plus BUDGET_HEADROOM, rounded up to a minute. The self-test
      # derives that sum and fails when either value drifts.
      - name: standard test gate makes no network attempt
        timeout-minutes: 104
        run: bash scripts/check-live-gate-isolation.sh --require-netns

      # The wire-conservation leg, run for its VERDICT: the driver corpus is
      # tracked, so every checkout adjudicates it and a Fail verdict already
      # fails the test binary. The greps after the run are the positive
      # control on top of that green -- a corpus that went missing or that
      # loaded nothing would make the harness assert zero fixtures, and zero
      # coverage on a gated lane must not read as a passing gate. So the
      # gated anthropic->anthropic-api lane line must be present with a
      # nonzero asserted count, and the harness's named-skip line must be
      # absent: the fixtures are tracked, so their absence means a broken
      # checkout, not an empty corpus. Only counts are left unpinned; they
      # grow as the corpus grows.
      #
      # The evidence is read from the committed-corpus test's own output
      # section, not from the whole log: the harness's unit tests plant
      # synthetic corpora and print both the named-skip line and their own
      # gated lane lines, which would satisfy or trip either grep no matter
      # what the real corpus holds.
      #
      # Two mechanical properties, both load-bearing rather than tidiness:
      # --test-threads=1 under --nocapture, because parallel threads
      # interleave their stderr mid-line and can splice other output into the
      # middle of a matched line, failing this step over a formatting race;
      # and pipefail with the tee, without which cargo's exit status is lost
      # to the pipe and the verdict stops gating anything.
      #
      # `test-gate.sh conservation` is the isolation step's selection
      # (workspace-all-features) narrowed by --test, so cargo reuses that
      # step's conservation binary instead of building another feature set.
      # The extra features change nothing the harness runs: they only add
      # test seams, the gen-catalog codegen, and the live and dhat targets.
      - name: wire conservation (verdict on the committed corpus)
        run: |
          set -e
          set -o pipefail
          log="$RUNNER_TEMP/conservation.log"
          bash scripts/test-gate.sh conservation \
            --nocapture --test-threads=1 2>&1 | tee "$log"

          block="$RUNNER_TEMP/conservation-committed-corpus.log"
          awk '/^test conservation_over_both_fixture_roots \.\.\./ { inblock = 1 }
               inblock { print }
               inblock && /^(ok|FAILED)$/ { exit }' "$log" > "$block"
          if ! grep -q . "$block"; then
            echo "conservation: the committed-corpus test produced no output; the" >&2
            echo "harness was renamed or never ran, so this step asserts nothing." >&2
            exit 1
          fi
          if grep -qF 'no driver corpus in this checkout' "$block"; then
            echo "conservation: the driver corpus is absent from this checkout, but its" >&2
            echo "fixtures are tracked -- the checkout or the corpus is broken." >&2
            exit 1
          fi
          lane=$(grep -E 'conservation: lane anthropic->anthropic-api .*gated=yes' "$block") || {
            echo "conservation: no gated anthropic->anthropic-api lane in the run" >&2
            exit 1
          }
          echo "$lane"
          if printf '%s\n' "$lane" | grep -qE 'asserted=0([^0-9]|$)'; then
            echo "conservation: the gated lane asserted 0 fixtures; a gate at zero" >&2
            echo "coverage is decorative green." >&2
            exit 1
          fi

  # The only per-PR check of the shipped profile. Every test leg builds with
  # test-release (no LTO, unwind, symbols kept), so a failure that only thin
  # LTO, codegen-units = 1, panic = "abort" or strip produces -- a link
  # error, a binary that dies at startup -- would otherwise surface first
  # in the release workflow. The smoke needs no network and no credential:
  # HOME and XDG_CONFIG_HOME point at a fresh temp dir, `config check`
  # validates the shipped example config (its unresolved credential
  # references are warnings, not errors), and `serve` boots on a
  # credential-free config bound to a free loopback port, must answer
  # /health, then must exit 0 on SIGTERM.
  release-build:
    name: release binary build + startup smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build --release (routectl-cli)
        run: bash scripts/test-gate.sh release-build

      - name: startup smoke on the release binary
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bin="$PWD/target/release/routectl"
          smoke_home="$(mktemp -d)"
          export HOME="$smoke_home" XDG_CONFIG_HOME="$smoke_home/.config"
          unset ROUTECTL_CONFIG

          "$bin" --version
          "$bin" --config examples/config.toml config check

          version="$("$bin" config example | sed -n 's/^version = \([0-9][0-9]*\)$/\1/p')"
          [ -n "$version" ] || { echo "smoke: no schema version in config example" >&2; exit 1; }
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          config="$smoke_home/serve.toml"
          printf 'version = %s\n[server]\nhost = "127.0.0.1"\nport = %s\n' "$version" "$port" > "$config"

          "$bin" --config "$config" serve < /dev/null &
          serve_pid=$!
          # Until serve is reaped, any exit kills it; once reaped, the pid
          # may be reused, so the trap is cleared before the verdict.
          trap 'kill -KILL "$serve_pid" 2>/dev/null || true' EXIT
          served=0
          health_deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$health_deadline" ]; do
            if curl -fsS --max-time 1 "http://127.0.0.1:$port/health"; then
              served=1
              break
            fi
            kill -0 "$serve_pid" 2>/dev/null || break
            sleep 0.2
          done
          echo
          if [ "$served" -ne 1 ]; then
            if kill -0 "$serve_pid" 2>/dev/null; then
              echo "smoke: serve never answered /health on port $port within 60s" >&2
            else
              echo "smoke: serve exited before answering /health on port $port" >&2
            fi
            exit 1
          fi

          kill -TERM "$serve_pid"
          for _ in $(seq 1 100); do
            kill -0 "$serve_pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$serve_pid" 2>/dev/null; then
            echo "smoke: serve did not exit within 10s of SIGTERM" >&2
            exit 1
          fi
          rc=0
          wait "$serve_pid" || rc=$?
          trap - EXIT
          if [ "$rc" -ne 0 ]; then
            echo "smoke: serve exited $rc after SIGTERM" >&2
            exit 1
          fi
          echo "smoke: release binary started, served /health, and shut down cleanly"

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # Run cargo-audit as a CLI rather than the rustsec/audit-check
      # action: the action posts results via the check-runs API, which
      # needs `checks: write` (not granted by this workflow's
      # `contents: read`) and is unavailable to the read-only token on
      # dependabot / fork PRs -- so it fails with "Resource not
      # accessible by integration" regardless of advisories. The CLI
      # just exits non-zero on an advisory, working on every event.
      - name: install and run cargo-audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          log-level: warn
          command: check
          arguments: --all-features

  internal-ids:
    name: internal-id guard
    # Runs on PRs (scan the PR diff vs its base) AND on pushes (scan the
    # pushed range) so direct pushes to main/develop are covered too --
    # previously PR-only, which made it a no-op on every push. Fails
    # closed; the local bypass env (ROUTECTL_SKIP_ID_SCAN) is
    # deliberately NOT set.
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 so the full history is present; a shallow
      # checkout would leave the base ref unresolvable and the diff
      # range would silently scan nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh

      # One base cannot serve every scan: a push that creates the branch
      # reports an all-zero "before", and a parent-of-HEAD fallback would both
      # fail on a root commit and skip every earlier commit of the push. The
      # scanner resolves the endpoint, per-commit, and message inputs itself
      # so the self-test exercises the same logic this job runs.
      - name: compute scan inputs
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$PR_BASE_REF"
            before="origin/$PR_BASE_REF"
          else
            before="$PUSH_BEFORE"
          fi
          bash scripts/check-internal-ids.sh --push-inputs "$before" >> "$GITHUB_OUTPUT"

      - name: scan diff added lines
        run: bash scripts/check-internal-ids.sh --range "${{ steps.range.outputs.endpoint }}"

      # The endpoint diff above cannot see content one commit adds and a
      # later commit removes; history stays public either way, so every
      # commit is also scanned against its own parent.
      - name: scan every commit's added lines
        run: bash scripts/check-internal-ids.sh --history "${{ steps.range.outputs.history }}"

      - name: scan commit messages
        run: bash scripts/check-internal-ids.sh --commit-range "${{ steps.range.outputs.messages }}"

      - name: internal-id scanner self-test
        run: bash scripts/check-internal-ids.test.sh

      # The commit-gate leg again, so a commit made without the hooks is
      # still held to it: no new source file without a navigation-doc row,
      # no stale allowlist entry, and no allowlist line the base lacks. On a
      # PR the base is the merge base with the target. On a push it is the
      # pre-push tip ("before"), so growth in any commit of a multi-commit
      # push is caught, not only in the last one; the job's full-history
      # checkout lets it resolve. When "before" is all zeros (branch
      # creation) or is not in the local history (a force push can leave it
      # unreachable), the base falls back to HEAD's parent; when HEAD has no
      # parent either, only the growth check is skipped, with a warning; gaps
      # and stale entries are still enforced.
      - name: navigation-doc index (enforced)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$PR_BASE_REF")"
          elif [ -n "$(printf '%s' "$PUSH_BEFORE" | tr -d 0)" ] &&
            git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}" >/dev/null; then
            base="$PUSH_BEFORE"
          elif base="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
            echo "::warning::push base '${PUSH_BEFORE:-<unset>}' is zero or not in local history; comparing the allowlist against HEAD's parent only"
          else
            echo "::warning::HEAD has no parent and the push base is unusable; SKIPPING the allowlist growth check"
            bash scripts/check-nav-index.sh --enforce
            exit 0
          fi
          NAV_INDEX_BASE="$base" bash scripts/check-nav-index.sh --enforce

      - name: navigation-doc index self-test
        run: bash scripts/check-nav-index.test.sh

      # The log-sink inventory reads targets and dependency kinds from
      # `cargo metadata --offline --no-deps`, which needs cargo but no
      # registry access or build.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      # Whole-tree, not range-scoped: a second subscriber a merge introduced
      # outside the pushed range bypasses the escaping sink just the same.
      - name: production log-sink inventory
        run: bash scripts/check-log-display.sh

      - name: log-sink inventory self-test
        run: bash scripts/check-log-display.test.sh

      # Static contract of the network-isolation check: its deadline sum
      # fits the step timeout above, the fixed credential names are always
      # planted, and it resolves its sources from any cwd.
      - name: live-gate isolation self-test
        run: bash scripts/check-live-gate-isolation.test.sh

      # The gate registry's public-api subcommand, the informational report
      # wrapper, and the wiring that keeps the public-api job informational.
      - name: gate registry self-test
        run: bash scripts/test-gate.test.sh

      # Self-test only: the toolchain preflight itself is not run on CI's rust
      # jobs, which select the toolchain through the setup action rather than
      # the rustup shim. What CI does guard is that the preflight local hooks
      # depend on keeps working.
      - name: toolchain preflight self-test
        run: bash scripts/assert-toolchain.test.sh

      # Workflow-file check, so it needs no build: both workflows keep
      # aws-lc-sys on its vendored, statically linked AWS-LC.
      - name: AWS-LC build pin
        run: bash scripts/check-aws-lc-pin.sh

      - name: AWS-LC build pin self-test
        run: bash scripts/check-aws-lc-pin.test.sh

      - name: AWS-LC build environment preflight self-test
        run: bash scripts/assert-aws-lc-env.test.sh

      # The fixture corpus is gitignored, so CI has no fixture to load and
      # a rig regression would otherwise only surface on a contributor's
      # next capture -- against a corpus that cannot be recaptured. The
      # self-test drives the real rig over a synthetic trace instead.
      - name: fixture capture rig self-test
        run: bash scripts/capture_fixtures.test.sh

      # The self-test drives the real scrub script over throwaway fixtures in
      # a throwaway environment whose HOME, git identity, and hostname ARE the
      # deny set -- coverage no committed fixture can provide, since a real
      # capture must contain none of those values.
      - name: fixture scrub gate self-test
        run: bash scripts/scrub-fixture.test.sh

      # The DRIVER corpus is committed (it stopped being gitignored when the
      # first fixture landed), so the gate must also run over the real thing.
      # Capture and promotion both invoke it, but neither is on the path a
      # contributor actually takes: edit a fixture, `git add`, open a PR. On
      # that path the only gates are secret scanning and the internal-id scan,
      # and neither models this gate's personal-data classes -- a home path, a
      # git identity, a hostname, a seat session id, an ls owner column. This
      # step is what protects a contributor who has never read the gate.
      #
      # Needs no credential and no daemon. On CI the identity-derived classes
      # WARN-skip (there is no seat and no operator identity to derive), which
      # the gate reports on its own line; the structural classes stay active.
      - name: committed driver corpus is scrub-clean
        run: bash scripts/scrub-fixture.sh --check crates/routectl-cli/tests/fixtures/driver

      # Promotion moves a fixture from a scratch root into the committed
      # corpus. It needs no credential and no daemon -- it copies, re-runs
      # the scrub gate, and renames -- so the self-test drives the real
      # script over synthetic fixtures under a throwaway scratch root,
      # including the merge and dirty-source refusals no real corpus can
      # be used to provoke.
      - name: fixture promotion self-test
        run: bash scripts/promote_fixture.test.sh

      # "No credential in any layer" is an acceptance claim about the
      # capture-cell image, and a claim about an image nobody opened is an
      # assumption -- so the self-test walks every layer of `docker save`
      # output and runs the repo's own scrub gate over the extracted
      # content. It SKIPS BY NAME where docker is absent, and its
      # deliberately-dirty positive control runs even when the committed
      # image is not built locally, so the step is never vacuous.
      #
      # NO IMAGE IS SCANNED HERE. No job builds the capture-cell image
      # (building it downloads a ~250MB client), so the committed-image
      # leg always skips by name and a green step proves only that the
      # walk-and-scan pipeline catches the planted control token. The
      # committed image is scanned locally, where it is built:
      #   bash scripts/container/build.sh && bash scripts/container/image_scan.test.sh
      - name: image layer scan self-test (control only; no image scanned in CI)
        run: bash scripts/container/image_scan.test.sh

      # The host wrapper that runs one capture inside the capture-cell
      # image. Its refusals -- host networking, privileged, the host pid
      # namespace, a caller-added mount, a missing host binary, an in-repo
      # scratch root -- are all decided from argv and the host filesystem
      # before docker is consulted, so CI exercises every one of them with
      # no daemon socket. The legs that DO enter a container run against a
      # stub routectl, a stub seat carrying a token assembled at run time,
      # and a stub driver, so no credential and no upstream is needed;
      # those legs SKIP BY NAME where docker or the image is absent.
      - name: capture cell wrapper self-test
        run: bash scripts/container/run_capture.test.sh

      # A default-bridge container must not be able to reach a routectl
      # daemon on its host, and the probe that says so must be able to
      # reach something -- so the negative is paired with a throwaway host
      # listener on a free port that the SAME container must reach at the
      # SAME resolved gateway address. CI can run this because the halves
      # that need no daemon are the file's own hygiene guards, and the
      # rest SKIPS BY NAME: on a runner with no docker the container legs
      # skip, and with no daemon answering /health the negative skips
      # rather than passing vacuously against an unbound port. What CI
      # therefore guards is that the guards themselves keep working -- no
      # process-signalling, no database client against the live ledger,
      # and the daemon's port named in exactly one place.
      - name: capture cell isolation self-test
        run: bash scripts/container/isolation.test.sh

      # The driver runner boots a daemon and kills it. A real boot needs a
      # credential CI does not have, so the self-test injects a stub daemon
      # through the runner's ROUTECTL_BIN override -- which still exercises
      # the port probe, the health precondition, the cleanup trap, and the
      # handoff to the capture rig.
      - name: driver runner self-test
        run: bash scripts/capture_driver.test.sh

      # The canonical interaction set and the harness drivers. Neither a
      # real client nor a real daemon is available here -- a driven session
      # needs a credential and spends tokens -- so the self-test injects a
      # stub daemon and a stub client through the documented binary
      # overrides. That still exercises the case schema, the driver's own
      # preconditions, and both connection modes reaching a landed fixture.
      - name: interaction set and driver self-test
        run: bash scripts/drivers.test.sh

  # Informational: public-API drift is reported, never enforced. The job
  # continues on error and is deliberately absent from `required.needs`, so
  # neither drift nor a broken toolchain bootstrap can block a merge. Its
  # last step turns the outcome into one annotation and one job-summary
  # line (clean / drift / could-not-run), and runs even when an earlier
  # step failed.
  public-api:
    name: public-api report (informational)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AWS-LC build environment preflight
        run: bash scripts/assert-aws-lc-env.sh

      # Both pins are READ from the script rather than duplicated -- the
      # nightly from PUBLIC_API_NIGHTLY, the tool version from its bootstrap
      # install line. A second copy here would drift from the script and the
      # two would disagree about what the surface even is.
      - name: read the pinned toolchain and tool version
        id: pins
        run: |
          set -euo pipefail
          nightly="$(grep -oE '^PUBLIC_API_NIGHTLY=.*' scripts/public-api.sh | cut -d= -f2)"
          version="$(grep -oE 'cargo-public-api --version [0-9]+\.[0-9]+\.[0-9]+' \
            scripts/public-api.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          # Fail closed: an empty pin would silently install a floating
          # nightly or the latest tool, and the surface listing is only
          # reproducible because both are fixed.
          [ -n "$nightly" ] || { echo "::error::could not read PUBLIC_API_NIGHTLY" >&2; exit 1; }
          [ -n "$version" ] || { echo "::error::could not read the cargo-public-api version" >&2; exit 1; }
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "public-api: nightly=$nightly cargo-public-api=$version"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A failed install must still reach the report step, which then says
      # the check could not run instead of the job ending silently.
      - name: install cargo-public-api
        continue-on-error: true
        run: cargo install cargo-public-api --locked --version "${{ steps.pins.outputs.version }}"

      # Always exits 0; drift and could-not-run surface as a warning
      # annotation. See public-api/POLICY.md. The pinned version lets the
      # wrapper refuse a cached cargo-public-api of another version, which
      # a failed install above would otherwise leave on PATH.
      - name: report public-API drift
        if: ${{ !cancelled() }}
        env:
          PUBLIC_API_TOOL_VERSION: ${{ steps.pins.outputs.version }}
        run: bash scripts/public-api-report.sh

  # The fleet-wide dependency gate, and the only one that is identical in
  # every repo whatever the stack -- it reads Cargo.lock here and other
  # lockfiles elsewhere, including any nested below the repo root that a
  # stack-specific tool would never be pointed at.
  #
  # Rust keeps cargo-audit and cargo-deny alongside it, deliberately: the
  # three do NOT overlap. This reports advisories but not YANKED crates,
  # since a yank is a crates.io registry state rather than an OSV
  # advisory -- the yanked chacha20 that turned this workflow red was
  # invisible to it and caught by the other two.
  #
  # The pinned CLI, not google/osv-scanner-action: that action ships
  # reusable workflows whose upload-sarif input defaults to true, which
  # needs `security-events: write` plus code scanning -- unavailable to a
  # private repo on a free plan. The binary keeps this job on
  # `contents: read` and works the same everywhere.
  osv-scan:
    name: dependency vulnerabilities
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin AND verify before executing, so a tampered release artifact
      # fails the job rather than running. The checksums file names the
      # upstream artifact, so verify under that name before renaming.
      - name: install osv-scanner
        env:
          OSV_VERSION: 2.5.1
        run: |
          set -euo pipefail
          BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL -o /tmp/osv-scanner    "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          ( cd /tmp && cp osv-scanner osv-scanner_linux_amd64 \
            && grep ' osv-scanner_linux_amd64$' osv_SHA256SUMS | sha256sum --check --status )
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # `-r .` walks the tree for every lockfile it recognises rather than
      # naming Cargo.lock, so a lockfile added later is covered without an
      # edit here. Exits non-zero on a finding.
      - name: scan lockfiles
        run: osv-scanner scan source -r .

  # The single check branch protection requires. Listing each job (and
  # each matrix leg) as its own required check would break every time a
  # leg is added or renamed; this job depends on all of them instead and
  # fails unless every one succeeded. `if: always()` makes it report when
  # a dependency failed or was skipped -- otherwise it would be skipped
  # itself, and a skipped required check reads as passing. Adding a job
  # to this workflow means adding it to `needs` here. The one deliberate
  # exception is `public-api`: it is informational, so it stays out of
  # `needs` and its outcome never decides this check.
  required:
    name: required
    runs-on: ubuntu-22.04
    if: always()
    needs:
      - check
      - debug-lanes
      - msrv
      - test
      - release-build
      - audit
      - deny
      - internal-ids
      - osv-scan
    steps:
      - name: every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "dependency results: $RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "required: at least one job did not succeed" >&2
            exit 1
          fi
          printf '%s' "$RESULTS" | grep -q '"success"' || { echo "required: no results" >&2; exit 1; }

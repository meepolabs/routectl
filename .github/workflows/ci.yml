name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege per workflow. Default GitHub permissions are
# often read/write inherited; explicit `contents: read` here makes
# the scope visible and overrideable per-job if a future step needs
# more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.7.5

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (lean providers build, no aws-* deps)
        run: cargo check -p routectl-providers --no-default-features --features openai-compat,anthropic-api

  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.7.5

      - name: cargo test --workspace
        run: cargo test --workspace --release

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          log-level: warn
          command: check
          arguments: --all-features

  internal-ids:
    name: internal-id guard
    # PR-only: the scan keys off the PR base ref. Fails closed -- the
    # local bypass env (ROUTECTL_SKIP_ID_SCAN) is deliberately NOT set.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 so the full history is present; a shallow
      # checkout would leave the base ref unresolvable and the diff
      # range would silently scan nothing.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: fetch PR base ref
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: scan PR diff added lines
        run: bash scripts/check-internal-ids.sh --range "origin/${{ github.event.pull_request.base.ref }}...HEAD"

      - name: scan PR commit messages
        run: bash scripts/check-internal-ids.sh --commit-range "origin/${{ github.event.pull_request.base.ref }}..HEAD"

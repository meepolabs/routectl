name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege per workflow. Default GitHub permissions are
# often read/write inherited; explicit `contents: read` here makes
# the scope visible and overrideable per-job if a future step needs
# more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.7.5

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # cargo fmt walks the module tree and so never opens an `include!`d
      # fragment; without this step the check above passes vacuously on them.
      - name: rustfmt --check on include!d fragments
        run: bash scripts/fmt-fragments.sh

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (lean providers build, no aws-* deps)
        run: cargo check -p routectl-providers --no-default-features --features openai-compat,anthropic-api

      # Scoped to the PUBLIC doc surface (no --document-private-items): a
      # private-items pass resolves links that break in the published docs,
      # so denying against it would green-light the very breakage this
      # step catches.
      - name: cargo doc (rustdoc lints denied)
        env:
          RUSTDOCFLAGS: -D rustdoc::all
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: msrv check (1.95.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.7.5
      - name: cargo check (workspace, MSRV 1.95.0)
        run: cargo check --workspace --all-features

  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.7.5

      - name: cargo test --workspace
        run: cargo test --workspace --release

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      # Run cargo-audit as a CLI rather than the rustsec/audit-check
      # action: the action posts results via the check-runs API, which
      # needs `checks: write` (not granted by this workflow's
      # `contents: read`) and is unavailable to the read-only token on
      # dependabot / fork PRs -- so it fails with "Resource not
      # accessible by integration" regardless of advisories. The CLI
      # just exits non-zero on an advisory, working on every event.
      - name: install and run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          log-level: warn
          command: check
          arguments: --all-features

  internal-ids:
    name: internal-id guard
    # Runs on PRs (scan the PR diff vs its base) AND on pushes (scan the
    # pushed range) so direct pushes to main/develop are covered too --
    # previously PR-only, which made it a no-op on every push. Fails
    # closed; the local bypass env (ROUTECTL_SKIP_ID_SCAN) is
    # deliberately NOT set.
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 so the full history is present; a shallow
      # checkout would leave the base ref unresolvable and the diff
      # range would silently scan nothing.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: compute scan base
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
            # First push / branch create reports an all-zero "before";
            # fall back to the parent of HEAD (or HEAD on a root commit).
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: scan diff added lines
        run: bash scripts/check-internal-ids.sh --range "${{ steps.range.outputs.base }}...HEAD"

      - name: scan commit messages
        run: bash scripts/check-internal-ids.sh --commit-range "${{ steps.range.outputs.base }}..HEAD"

      # Whole-tree, not range-scoped: the gate is cheap (pure ripgrep) and a
      # tree-wide scan also catches a site a merge reintroduced outside the
      # pushed range.
      - name: scan % tracing fields on wire-derived values
        run: bash scripts/check-log-display.sh

      - name: log-display gate self-test
        run: bash scripts/check-log-display.test.sh

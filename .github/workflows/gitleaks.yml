# Secret scanning.
#
# Runs on every PR + push to main/develop, plus a weekly full-history
# scan to catch anything historical that slipped past the diff scan
# on prior PRs.

name: gitleaks

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the schedule run can see everything.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the gitleaks binary so CI and the local pre-commit hook scan
          # with the SAME ruleset. Keep in lockstep with MIN_GITLEAKS in
          # tools/git-hooks/pre-commit; bump both together.
          GITLEAKS_VERSION: "8.30.1"
          # gitleaks-action v3 (node24 runtime) still requires a license key
          # for org-owned repos. Behavior and env interface unchanged from v2;
          # the major bump is only for the node20 -> node24 runtime migration.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

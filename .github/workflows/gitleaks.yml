# Secret scanning.
#
# Runs on every PR + push to main/develop, plus a weekly full-history
# scan to catch anything historical that slipped past the diff scan
# on prior PRs.

name: gitleaks

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read

# A newer pull_request run on the same ref cancels the older one. Each push
# run gets its own group keyed on its commit SHA: a shared group holds at
# most one pending run and replaces it with the next, and the action scans
# only its own push's commit range, so a replaced push run would leave that
# range unscanned. The event name is part of every key, so push, PR and
# scheduled runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the schedule run can see everything.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the gitleaks binary so CI and the local commit gate scan
          # with the SAME ruleset. Keep in lockstep with the gitleaks `rev`
          # in .pre-commit-config.yaml; bump both together.
          GITLEAKS_VERSION: "8.30.1"
          # gitleaks-action v3 (node24 runtime) still requires a license key
          # for org-owned repos. Behavior and env interface unchanged from v2;
          # the major bump is only for the node20 -> node24 runtime migration.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

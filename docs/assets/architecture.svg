<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- column labels -->
  <text x="105" y="24" text-anchor="middle" fill="#7d8590" font-size="12">ingress (your client)</text>
  <text x="430" y="24" text-anchor="middle" fill="#7d8590" font-size="12">one canonical request</text>
  <text x="755" y="24" text-anchor="middle" fill="#7d8590" font-size="12">egress (providers)</text>

  <!-- ingress boxes -->
  <g stroke="#7d8590" fill="#f6f8fa">
    <rect x="20" y="66" width="170" height="34" rx="6"/>
    <rect x="20" y="152" width="170" height="34" rx="6"/>
    <rect x="20" y="238" width="170" height="34" rx="6"/>
  </g>
  <g fill="#1f2328">
    <text x="105" y="87" text-anchor="middle">/v1/chat/completions</text>
    <text x="105" y="173" text-anchor="middle">/v1/messages</text>
    <text x="105" y="259" text-anchor="middle">/v1/responses</text>
  </g>

  <!-- hub -->
  <rect x="330" y="56" width="200" height="230" rx="10" stroke="#7d8590" fill="#ddf4ff"/>
  <text x="430" y="86" text-anchor="middle" fill="#1f2328" font-weight="bold">ChatRequest</text>
  <line x1="352" y1="100" x2="508" y2="100" stroke="#7d8590" stroke-dasharray="3 3"/>
  <g fill="#1f2328">
    <text x="430" y="128" text-anchor="middle">alias -&gt; fallback chain</text>
    <text x="430" y="156" text-anchor="middle">per-class retry policy</text>
    <text x="430" y="184" text-anchor="middle">capability filter</text>
    <text x="430" y="212" text-anchor="middle">prompt-cache planning</text>
    <text x="430" y="240" text-anchor="middle">usage accounting</text>
  </g>
  <text x="430" y="272" text-anchor="middle" fill="#7d8590" font-size="12">router</text>

  <!-- egress boxes -->
  <g stroke="#7d8590" fill="#f6f8fa">
    <rect x="670" y="46" width="170" height="34" rx="6"/>
    <rect x="670" y="100" width="170" height="34" rx="6"/>
    <rect x="670" y="154" width="170" height="34" rx="6"/>
    <rect x="670" y="208" width="170" height="34" rx="6"/>
    <rect x="670" y="262" width="170" height="34" rx="6"/>
  </g>
  <g fill="#1f2328">
    <text x="755" y="67" text-anchor="middle">openai-compat</text>
    <text x="755" y="121" text-anchor="middle">anthropic-api</text>
    <text x="755" y="175" text-anchor="middle">bedrock</text>
    <text x="755" y="229" text-anchor="middle">openai-responses</text>
    <text x="755" y="283" text-anchor="middle">gemini</text>
  </g>

  <!-- ingress -> hub arrows -->
  <g stroke="#7d8590" fill="none" marker-end="url(#arrow)">
    <path d="M 190 83 C 260 83, 270 130, 326 150"/>
    <path d="M 190 169 L 326 171"/>
    <path d="M 190 255 C 260 255, 270 212, 326 192"/>
  </g>

  <!-- hub -> egress arrows -->
  <g stroke="#7d8590" fill="none" marker-end="url(#arrow)">
    <path d="M 530 130 C 600 120, 610 75, 666 65"/>
    <path d="M 530 155 C 600 150, 610 122, 666 118"/>
    <path d="M 530 171 L 666 171"/>
    <path d="M 530 187 C 600 192, 610 220, 666 224"/>
    <path d="M 530 212 C 600 222, 610 267, 666 277"/>
  </g>
</svg>

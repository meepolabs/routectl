<!DOCTYPE html>
<!--
  routectl status dashboard: the MARKUP source of a single self-contained,
  read-only document. page.rs inlines dashboard.css and dashboard.js into
  the two asset slots below at COMPILE time, so the served artifact is one
  offline HTML file with zero external network dependencies. This file is
  never served on its own; do not add a <link> or <script src> here.

  Co-versioning contract: this page ships in the SAME binary as the
  /status endpoints it polls, so the wire shapes it is built against
  cannot skew from what the server emits -- there is no client/server
  version negotiation, and the per-source schema_version check in
  dashboard.js is recovery containment for a cached page or a bad build,
  not negotiation. If this document is ever served SEPARATELY from those
  endpoints (a CDN, a split asset bundle), the co-versioning guarantee
  breaks and real version negotiation must be added before that split
  ships.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>routectl status</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%239aa5b5'></circle></svg>">
@@DASHBOARD_STYLE@@
</head>
<body>
  <!--
    The persistent verdict strip: a state dot, ONE plain-language sentence,
    the window's req/span figures, the window picker, and the poll
    indicator. It carries no cost figure by design -- cost is a
    Usage/Overview reading, and repeating it here would show the same fact
    twice.
  -->
  <div class="verdict" id="verdict">
    <div class="verdict-lead">
      <span class="verdict-dot" id="verdict-dot" aria-hidden="true"></span>
      <span class="verdict-text" id="verdict-text" role="status" aria-live="polite"></span>
      <span class="verdict-stats" id="verdict-stats"></span>
    </div>
    <div class="verdict-side">
      <div class="windowsel" id="windowsel" role="group" aria-label="Aggregation window" data-windowless="false">
        <button type="button" data-window="today" aria-pressed="true">Today</button>
        <button type="button" data-window="week" aria-pressed="false">Week</button>
        <button type="button" data-window="month" aria-pressed="false">Month</button>
        <button type="button" data-window="all" aria-pressed="false">All</button>
      </div>
      <button type="button" class="refresh" id="refresh" title="Refresh now">Refresh</button>
      <div class="poll" id="poll" aria-hidden="true">
        <span class="poll-dot"></span>
        <span class="poll-label" id="poll-label"></span>
      </div>
    </div>
  </div>

  <div class="tabbar" id="tabbar" role="tablist" aria-label="Status views">
    <button type="button" class="tab" id="tab-overview" role="tab" data-tab="overview"
      aria-controls="pane-overview" aria-selected="true" tabindex="0">
      Overview<span class="tab-badge" id="badge-overview" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-usage" role="tab" data-tab="usage"
      aria-controls="pane-usage" aria-selected="false" tabindex="-1">
      Usage<span class="tab-badge" id="badge-usage" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-routing" role="tab" data-tab="routing"
      aria-controls="pane-routing" aria-selected="false" tabindex="-1">
      Routing<span class="tab-badge" id="badge-routing" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-health" role="tab" data-tab="health"
      aria-controls="pane-health" aria-selected="false" tabindex="-1">
      Health<span class="tab-badge" id="badge-health" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-config" role="tab" data-tab="config"
      aria-controls="pane-config" aria-selected="false" tabindex="-1">
      Config<span class="tab-badge" id="badge-config" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-doctor" role="tab" data-tab="doctor"
      aria-controls="pane-doctor" aria-selected="false" tabindex="-1">
      Doctor<span class="tab-badge" id="badge-doctor" hidden></span>
    </button>
  </div>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <!--
    One pane per tab, each a shell of a freshness line plus a body the tab's
    `buildX` fills. The pane markup is IDENTICAL across tabs on purpose: the
    tab's whole rendering lives in dashboard.js.
  -->
  <main>
    <section class="pane" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
      <div class="section-status" id="status-overview"></div>
      <div id="body-overview"></div>
    </section>
    <section class="pane" id="pane-usage" role="tabpanel" aria-labelledby="tab-usage" tabindex="0" hidden>
      <div class="section-status" id="status-usage"></div>
      <div id="body-usage"></div>
    </section>
    <section class="pane" id="pane-routing" role="tabpanel" aria-labelledby="tab-routing" tabindex="0" hidden>
      <div class="section-status" id="status-routing"></div>
      <div id="body-routing"></div>
    </section>
    <section class="pane" id="pane-health" role="tabpanel" aria-labelledby="tab-health" tabindex="0" hidden>
      <div class="section-status" id="status-health"></div>
      <div id="body-health"></div>
    </section>
    <section class="pane" id="pane-config" role="tabpanel" aria-labelledby="tab-config" tabindex="0" hidden>
      <div class="section-status" id="status-config"></div>
      <div id="body-config"></div>
    </section>
    <section class="pane" id="pane-doctor" role="tabpanel" aria-labelledby="tab-doctor" tabindex="0" hidden>
      <div class="section-status" id="status-doctor"></div>
      <div id="body-doctor"></div>
    </section>
  </main>
@@DASHBOARD_SCRIPT@@
</body>
</html>

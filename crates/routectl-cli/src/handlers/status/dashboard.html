<!DOCTYPE html>
<!--
  routectl status dashboard: a single self-contained, read-only document
  (inline CSS + JS, zero external network dependencies). It POLLS the
  GET /status aggregate and renders four panels; it never mutates.

  Co-versioning contract: this page ships in the SAME binary as the
  /status endpoints it polls, so the panel shapes it is built against
  cannot skew from what the server emits -- there is no client/server
  version negotiation, and the per-panel schema_version check below is a
  cheap graceful-degrade guard, not negotiation. If this document is ever
  served SEPARATELY from those endpoints (a CDN, a split asset bundle),
  the co-versioning guarantee breaks and real version negotiation must be
  added before that split ships.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>routectl status</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%239aa5b5'></circle></svg>">
  <style>
    /*
      Design tokens. Every color, space, type, radius, and motion value
      is defined once here and referenced by rules below -- no raw hex/px
      sprinkled in components. The dark theme (the primary console look)
      overrides the same token names under prefers-color-scheme.

      Fonts are a deliberate SYSTEM stack, not a web font: the page is
      self-contained with zero external dependencies, so a web font is
      impossible by constraint. UI text uses the platform sans; every
      numeral and code-like token uses the platform monospace so figures
      align in tabular columns.
    */
    :root {
      color-scheme: light dark;

      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;
      --sp-6: 32px;

      --fs-xs: 0.72rem;
      --fs-sm: 0.8rem;
      --fs-md: 0.9rem;
      --fs-lg: 1.05rem;
      --fs-xl: 1.3rem;
      --fs-stat: 1.9rem;

      --r-sm: 4px;
      --r-md: 8px;
      --r-pill: 999px;

      --dur: 160ms;
      --ease: cubic-bezier(0.2, 0.6, 0.2, 1);

      --tabbar-h: 48px;

      --bg: #eef0f3;
      --surface: #ffffff;
      --surface-2: #f3f5f8;
      --border: #dde1e7;
      --border-strong: #c3c9d2;
      --fg: #131720;
      --muted: #4d5666;
      --faint: #79828f;
      --accent: #1f6feb;
      --accent-fg: #ffffff;
      --neg: #b42318;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 10px rgba(0, 0, 0, 0.05);

      --pill-neutral-bg: #e7eaef; --pill-neutral-fg: #2b3240;
      --pill-ok-bg: #d8f0dd;      --pill-ok-fg: #12592b;
      --pill-err-bg: #fbdedb;     --pill-err-fg: #8a1c14;
      --pill-warn-bg: #fbeecb;    --pill-warn-fg: #6b4e05;
      --pill-info-bg: #dbe8fb;    --pill-info-fg: #123a6b;
      --pill-accent-bg: #e7e0f5;  --pill-accent-fg: #3d2a6b;
      --pill-teal-bg: #d6efe8;    --pill-teal-fg: #0f4f42;
      --pill-pink-bg: #f6deea;    --pill-pink-fg: #6b2140;
      --pill-brown-bg: #ece0cf;   --pill-brown-fg: #5a3d12;

      /* Glanceability visuals: dedicated tokens so the quantitative
         ramps stay independent of the semantic pill colors above. */
      --bar-fill: #cfe0fb;
      --ring-track: #e2e6ec;
      --ring-fill: var(--accent);
      --cell-flash: #d7e6ff;
      --heat-lo: #f7dcd8;
      --heat-mid: #fbeccb;
      --heat-hi: #d8f0dd;
      --dot-size: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1017;
        --surface: #161b24;
        --surface-2: #1c2330;
        --border: #2a323f;
        --border-strong: #3a4453;
        --fg: #e6eaf0;
        --muted: #9aa5b5;
        --faint: #6b7484;
        --accent: #4d90ff;
        --accent-fg: #0d1017;
        --neg: #ff6b5e;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 18px rgba(0, 0, 0, 0.35);

        --pill-neutral-bg: #262e3b; --pill-neutral-fg: #c3ccd9;
        --pill-ok-bg: #16351f;      --pill-ok-fg: #7ee0a0;
        --pill-err-bg: #3a1714;     --pill-err-fg: #ff9a90;
        --pill-warn-bg: #392c0e;    --pill-warn-fg: #f0c96a;
        --pill-info-bg: #12294a;    --pill-info-fg: #8fbaff;
        --pill-accent-bg: #2a2145;  --pill-accent-fg: #c3b0f0;
        --pill-teal-bg: #0f332c;    --pill-teal-fg: #6fd8c2;
        --pill-pink-bg: #3a1a2a;    --pill-pink-fg: #f0a0c0;
        --pill-brown-bg: #33260f;   --pill-brown-fg: #e0b877;

        --bar-fill: #24344f;
        --ring-track: #2a323f;
        --ring-fill: var(--accent);
        --cell-flash: #223047;
        --heat-lo: #3d1a16;
        --heat-mid: #3a2c0e;
        --heat-hi: #14351f;
        --dot-size: 6px;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      margin: 0;
      padding: 0 var(--sp-5) var(--sp-6);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
      font-size: var(--fs-md);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---- header ---- */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-4);
      padding: var(--sp-5) 0 var(--sp-3);
    }
    h1 {
      font-size: var(--fs-xl);
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    h1 .mark {
      font-family: var(--font-mono);
      color: var(--accent);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
    }
    .windowsel {
      display: inline-flex;
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
    }
    .windowsel button {
      font: inherit;
      font-size: var(--fs-sm);
      padding: var(--sp-1) var(--sp-3);
      border: 0;
      border-right: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .windowsel button:last-child { border-right: 0; }
    .windowsel button:hover { background: var(--surface-2); color: var(--fg); }
    .windowsel button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .windowsel button:active { transform: translateY(1px); }
    .windowsel button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .windowsel button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .clock {
      color: var(--faint);
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      font-variant-numeric: tabular-nums;
    }
    .refresh {
      font: inherit;
      font-size: var(--fs-sm);
      padding: var(--sp-1) var(--sp-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .refresh:hover { background: var(--surface-2); color: var(--fg); }
    .refresh:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .refresh:active { transform: translateY(1px); }
    .refresh:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ---- sticky tab bar ---- */
    .tabbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: var(--sp-1);
      min-height: var(--tabbar-h);
      align-items: stretch;
      background: var(--bg);
      border-bottom: 1px solid var(--border-strong);
      margin-bottom: var(--sp-4);
    }
    .tab {
      font: inherit;
      font-size: var(--fs-md);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-4);
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .tab:hover { color: var(--fg); background: var(--surface-2); }
    .tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .tab[aria-selected="true"] {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }
    .tab-badge {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      padding: 0.05em 0.5em;
      border-radius: var(--r-pill);
      background: var(--pill-neutral-bg);
      color: var(--pill-neutral-fg);
    }
    .tab-badge--warn { background: var(--pill-warn-bg); color: var(--pill-warn-fg); }
    .tab-badge--error { background: var(--pill-err-bg); color: var(--pill-err-fg); }
    .tab-badge--muted { background: var(--pill-neutral-bg); color: var(--faint); }

    /* ---- banner ---- */
    .banner {
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--r-md);
      margin-bottom: var(--sp-4);
      font-size: var(--fs-sm);
      border: 1px solid transparent;
    }
    .banner--warn { background: var(--pill-warn-bg); color: var(--pill-warn-fg); border-color: var(--pill-warn-fg); }
    .banner--error { background: var(--pill-err-bg); color: var(--pill-err-fg); border-color: var(--pill-err-fg); }
    .banner--terminal { background: var(--pill-accent-bg); color: var(--pill-accent-fg); border-color: var(--pill-accent-fg); }

    /* ---- panels (one visible tabpanel at a time; the page scrolls) ---- */
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: var(--sp-4);
      min-width: 0;
    }
    .panel[hidden] { display: none; }
    .panel h2 {
      font-size: var(--fs-lg);
      font-weight: 600;
      margin: 0;
    }
    .panel h3 {
      font-size: var(--fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: var(--sp-5) 0 var(--sp-2);
      padding-bottom: var(--sp-1);
      border-bottom: 1px solid var(--border);
      color: var(--faint);
    }
    .panel-status {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--faint);
      min-height: 1.2em;
      margin-top: var(--sp-1);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .panel-status.pulse { animation: statuspulse 180ms var(--ease); }
    @keyframes statuspulse { from { opacity: 0.3; } to { opacity: 1; } }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    .panel-body {
      font-size: var(--fs-sm);
      margin-top: var(--sp-3);
    }
    .panel--stale .panel-body { opacity: 0.45; }
    .panel--dead .panel-body { opacity: 0.55; }
    .unavailable-msg {
      color: var(--pill-err-fg);
      background: var(--pill-err-bg);
      border: 1px solid var(--pill-err-fg);
      border-radius: var(--r-sm);
      padding: var(--sp-2) var(--sp-3);
      font-size: var(--fs-sm);
    }
    .meta {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--muted);
      margin-bottom: var(--sp-3);
    }
    .none {
      color: var(--faint);
      font-style: italic;
      font-size: var(--fs-sm);
      padding: var(--sp-2) 0;
    }

    /* ---- hero stat cards (usage totals) ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: var(--sp-3);
      margin-bottom: var(--sp-3);
    }
    .stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: var(--sp-3) var(--sp-4);
    }
    .stat--flow {
      border-left: 3px solid var(--accent);
    }
    .stat-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-stat);
      font-weight: 600;
      line-height: 1.1;
      color: var(--fg);
    }
    .stat-label {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      margin-top: var(--sp-1);
    }
    .neg { color: var(--neg); }

    /* ---- tables (full-height, sticky thead against the page scroll) ---- */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: var(--fs-sm);
      margin-bottom: var(--sp-3);
    }
    thead th {
      position: sticky;
      top: var(--tabbar-h);
      z-index: 5;
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: left;
      padding: var(--sp-2) var(--sp-3);
      border-bottom: 1px solid var(--border-strong);
      white-space: nowrap;
    }
    tbody th, tbody td {
      padding: var(--sp-2) var(--sp-3);
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }
    tbody th[scope="row"] {
      font-weight: 600;
      color: var(--fg);
      font-family: var(--font-mono);
    }
    tbody td { color: var(--muted); }
    tbody tr:hover th, tbody tr:hover td { background: var(--surface-2); }
    th.num, td.num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }
    td.wrap {
      white-space: normal;
      min-width: 12rem;
      max-width: 24rem;
    }

    /* ---- expandable rows ---- */
    .exp-cell { width: 1.6rem; text-align: center; }
    .exp-btn {
      font: inherit;
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      width: 1.5rem;
      height: 1.5rem;
      line-height: 1;
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .exp-btn:hover { background: var(--surface-2); color: var(--fg); }
    .exp-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .exp-btn:active { transform: translateY(1px); }
    .detail-row > td {
      background: var(--surface-2);
      padding: var(--sp-3) var(--sp-4);
    }
    .deflist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--sp-2) var(--sp-5);
      margin: 0;
    }
    .deflist .def {
      display: flex;
      justify-content: space-between;
      gap: var(--sp-3);
      border-bottom: 1px dotted var(--border);
      padding-bottom: 2px;
    }
    .deflist dt {
      color: var(--faint);
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .deflist dd {
      margin: 0;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }

    /*
      Value-domain tokens are rendered as their RAW wire string and styled
      by a class keyed on the EXACT per-field string (three casings:
      snake_case, PascalCase, kebab-case -- never normalized). `.tok` is the
      default fallback, so a newly-added or unknown token renders as
      readable neutral text rather than crashing or hiding. Each family maps
      to a semantic pill token so both themes stay in contrast.

      CROSS-POINTER: the HUMANIZED labels + tooltips for these same token
      families live in the script's `// ---- label maps ----` block (the
      `LABELS` object). The families here and there are the SAME set -- a new
      token gets a color rule HERE and a label entry THERE, two adjacent
      mutually-pointing places, so neither drifts silently.
    */
    .tok {
      display: inline-block;
      padding: 0.05em 0.55em;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--pill-neutral-bg);
      color: var(--pill-neutral-fg);
    }
    .circuit-closed, .reach-reachable, .status-Pass, .learned-verified, .src-user {
      background: var(--pill-ok-bg); color: var(--pill-ok-fg);
    }
    .circuit-open, .reach-degraded, .status-Fail, .verdict-route-away, .learned-broken, .src-missing {
      background: var(--pill-err-bg); color: var(--pill-err-fg);
    }
    .circuit-half_open_ready, .status-Warn {
      background: var(--pill-warn-bg); color: var(--pill-warn-fg);
    }
    .verdict-force-supported, .tier-self-identifying, .prov-provider, .prov-model, .src-import {
      background: var(--pill-info-bg); color: var(--pill-info-fg);
    }
    .tier-inferred, .src-baked {
      background: var(--pill-brown-bg); color: var(--pill-brown-fg);
    }
    .prov-override {
      background: var(--pill-pink-bg); color: var(--pill-pink-fg);
    }
    .prov-learned {
      background: var(--pill-teal-bg); color: var(--pill-teal-fg);
    }
    .src-disabled {
      background: var(--pill-neutral-bg); color: var(--faint);
    }
    /* Quota STATUS / OVERAGE token colors. These values pass through from the
       upstream ratelimit headers, so an unrecognized value keeps the neutral
       `.tok` fallback rather than a wrong color. */
    .qstatus-allowed { background: var(--pill-ok-bg); color: var(--pill-ok-fg); }
    .qstatus-rejected { background: var(--pill-err-bg); color: var(--pill-err-fg); }
    .qstatus-queued, .qstatus-allowed_warning, .qstatus-triggered {
      background: var(--pill-warn-bg); color: var(--pill-warn-fg);
    }

    /* ---- render-layer affordances ---- */

    /* A zero-traffic group stays in the sorted table but dims (data floor --
       de-emphasis, never collapse). */
    .row--muted > th, .row--muted > td { opacity: 0.5; }

    /* Whole-row expand: the entire primary row toggles its detail; the
       disclosure button stays the visible affordance indicator. */
    tr.exp-row { cursor: pointer; }

    /* Usage totals reconciliation line (REQ = OK + ERR + DISC). */
    .footnote {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--faint);
      margin: 0 0 var(--sp-3);
    }

    /* Doctor findings summary strip (N pass / N warn / N fail). */
    .doctor-summary {
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-bottom: var(--sp-3);
    }

    /* Default-collapsed disclosure for list-shaped detail (e.g. doctor
       reachability full list). Native <details>, no JS. */
    details { margin-bottom: var(--sp-3); }
    details > summary {
      cursor: pointer;
      color: var(--accent);
      font-size: var(--fs-sm);
      padding: var(--sp-1) 0;
    }
    details > summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .stacklist {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      padding: var(--sp-2) 0;
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--fg);
    }

    /* Clickable hero tile: the Errors tile scrolls to the groups table. */
    .stat--link { cursor: pointer; }
    .stat--link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ============================================================
       Glanceability visuals: per-card trend sparklines,
       proportion bars, ring gauges, magnitude-unit typography,
       change flash, heat bands. Every color/dimension is a token
       (above); this section carries no raw hex. All additive over
       the numerals -- every figure still renders as text (data
       floor), so deleting this section degrades to the plain
       render-layer look.
       ============================================================ */

    /* Per-card trend sparkline under the numeral. Stroke + geometry
       come from tokens / numeric SVG attributes; the numeral stays
       the primary read. */
    .spark {
      display: block;
      width: 100%;
      height: 24px;
      margin-top: var(--sp-1);
      overflow: visible;
    }
    .spark polyline {
      fill: none;
      stroke: var(--ring-fill);
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    /* Magnitude-unit suffix (K/M/B): smaller + muted so the body
       number dominates. A zero / absent value de-emphasizes whole. */
    .stat-value .unit, td.num .unit, th.num .unit {
      font-size: 0.62em;
      font-weight: 500;
      color: var(--faint);
      margin-left: 0.08em;
    }
    .mag-zero { color: var(--faint); }

    /* Proportion bar behind a numeric cell (REQ / INPUT / CACHE READ):
       a left-anchored fill sized by --pct set via style.setProperty;
       the numeral rides on top, right-aligned by the cell. */
    .barcell {
      --pct: 0;
      display: block;
      border-radius: var(--r-sm);
      padding: 0 var(--sp-1);
      background: linear-gradient(to right,
        var(--bar-fill) 0,
        var(--bar-fill) calc(var(--pct) * 1%),
        transparent calc(var(--pct) * 1%));
    }

    /* Ring gauge: a conic-gradient donut (the ring drawn on ::before
       so the mask never touches the centered numeral). The mask cuts
       a transparent center via currentColor -- an opaque alpha anchor,
       not a theme color, so no token is spent there. Static: no motion.
       Used for CACHE HIT and quota UTILIZATION. */
    .ring {
      --pct: 0;
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
    }
    .ring--sm { width: 34px; height: 34px; }
    .ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--ring-fill) calc(var(--pct) * 1%), var(--ring-track) 0);
      -webkit-mask: radial-gradient(circle at center, transparent 56%, currentColor 57%);
      mask: radial-gradient(circle at center, transparent 56%, currentColor 57%);
    }
    .ring-center {
      position: relative;
      z-index: 1;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--fg);
    }
    .ring--sm .ring-center { font-size: 0.62rem; }

    /* Cache-hit heat: 3 fixed bands on the hit% cell. */
    .hitcell {
      display: block;
      border-radius: var(--r-sm);
      padding: 0 var(--sp-1);
    }
    .hit-lo { background: var(--heat-lo); }
    .hit-mid { background: var(--heat-mid); }
    .hit-hi { background: var(--heat-hi); }

    /* One-shot change flash on a numeric cell whose value moved on a
       live poll. Fires only when the JS motion gate allows it (added
       to a fresh node, so it plays exactly once); nulled under
       reduced motion below. */
    .cell-flash { animation: cellflash 600ms var(--ease); }
    @keyframes cellflash {
      from { background-color: var(--cell-flash); }
      to { background-color: transparent; }
    }

    /* ---- loading skeleton ---- */
    .skeleton { display: flex; flex-direction: column; gap: var(--sp-2); }
    .skeleton span {
      display: block;
      height: 0.9rem;
      border-radius: var(--r-sm);
      background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
      background-size: 200% 100%;
      animation: shimmer 1.2s var(--ease) infinite;
    }
    .skeleton span:nth-child(1) { width: 80%; }
    .skeleton span:nth-child(2) { width: 55%; }
    .skeleton span:nth-child(3) { width: 68%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .skeleton span { animation: none; }
      .panel-status.pulse { animation: none; }
      .windowsel button:active, .exp-btn:active, .refresh:active { transform: none; }
      /* Count-up motion: the count-up tween is JS-gated on the cached
         reducedMotion flag; the cell flash is a CSS animation, so null
         it here too. Sparklines / bars / rings are static by design. */
      .cell-flash { animation: none; }
    }

    /* ============================================================
       Ambience, chrome finish + motion (DROPPABLE)
       Additive polish layered over the glanceability floor: sliding
       tab indicator, frosted tab bar, breathing live-dot, ambient
       radial tint, themed scrollbar + selection, colorblind-safe
       status-pill dots. SEVERABLE: this whole banner plus the
       initAmbience() call can be deleted and the glanceability +
       render-layer layers stay intact -- nothing above references
       anything here.
       ============================================================ */

    /* Ambient tint token derived from the live accent so it tracks the
       theme with a single definition (no per-theme block needed). */
    :root { --ambient-tint: color-mix(in srgb, var(--accent) 7%, transparent); }

    /* Fixed, subtle radial wash over the flat background. */
    body {
      background:
        radial-gradient(120% 80% at 50% -10%, var(--ambient-tint), transparent 70%),
        var(--bg);
      background-attachment: fixed;
    }

    /* Frosted translucent sticky tab bar. */
    .tabbar {
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* One sliding underline replaces the per-tab active border.
       Positioned + sized in JS (initAmbience) via translateX + scaleX;
       its transition is killed under reduced motion by the global rule
       above, and the JS jump reads the cached reducedMotion flag. */
    .tab[aria-selected="true"] { border-bottom-color: transparent; }
    .tab-underline {
      position: absolute;
      left: 0;
      bottom: -1px;
      height: 2px;
      width: 1px;
      background: var(--accent);
      transform-origin: left center;
      transform: translateX(0) scaleX(0);
      transition: transform var(--dur) var(--ease);
      pointer-events: none;
    }

    /* The live-dot breathes while a panel is healthy; a panel in
       a transport-down state (stale / dead / terminal) shows a solid
       negative dot with no motion. Reads the existing panel state
       classes only -- no new timers or flags. */
    .live-dot { animation: livebreathe 3.4s var(--ease) infinite; }
    @keyframes livebreathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.78); }
    }
    .panel--stale .live-dot,
    .panel--dead .live-dot {
      animation: none;
      background: var(--neg);
    }

    /* Themed scrollbar + accent selection. */
    html { scrollbar-color: var(--accent) var(--surface-2); }
    ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

    /* Colorblind-safe leading dot on status-family pills (circuit / reach /
       status / qstatus) in the pill's own fg color. The dot is keyed on the
       dedicated .tok-dot marker class applied by the token builder for those
       families only, so no other family can grow a dot by sharing a class-name
       substring. Non-status token families (verdict / learned / tier / prov /
       src) intentionally carry no marker and no dot. */
    .tok.tok-dot::before {
      content: "";
      display: inline-block;
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: currentColor;
      margin-right: 0.4em;
      vertical-align: 0.04em;
    }

    /* Reduced-motion: null the only new CSS animation here (the sliding
       underline's transition is already killed by the global rule
       above; the JS jump reads the cached reducedMotion flag). */
    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }
  </style>
</head>
<body>

  <div class="tabbar" id="tabbar" role="tablist" aria-label="Status panels">
    <button type="button" class="tab" id="tab-usage" role="tab" data-tab="usage"
      aria-controls="panel-usage" aria-selected="true" tabindex="0">

    <button type="button" class="tab" id="tab-health" role="tab" data-tab="health"
      aria-controls="panel-health" aria-selected="false" tabindex="-1">

    <button type="button" class="tab" id="tab-config" role="tab" data-tab="config"
      aria-controls="panel-config" aria-selected="false" tabindex="-1">

    </button>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <main>
    <section class="panel" id="panel-usage" role="tabpanel" aria-labelledby="tab-usage" tabindex="0">
      <h2>Usage</h2>
      <div class="panel-status" id="status-usage"></div>
      <div class="panel-body" id="body-usage">
        <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="sr-only">Loading usage</span>
      </div>
    </section>
    <section class="panel" id="panel-health" role="tabpanel" aria-labelledby="tab-health" tabindex="0" hidden>
      <h2>Health</h2>
      <div class="panel-status" id="status-health"></div>
      <div class="panel-body" id="body-health">
        <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="sr-only">Loading health</span>
      </div>
    </section>
    <section class="panel" id="panel-config" role="tabpanel" aria-labelledby="tab-config" tabindex="0" hidden>
      <h2>Config</h2>
      <div class="panel-status" id="status-config"></div>
      <div class="panel-body" id="body-config">
        <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="sr-only">Loading config</span>
      </div>
    </section>
    <section class="panel" id="panel-doctor" role="tabpanel" aria-labelledby="tab-doctor" tabindex="0" hidden>
      <h2>Doctor</h2>
      <div class="panel-status" id="status-doctor"></div>
      <div class="panel-body" id="body-doctor">
        <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="sr-only">Loading doctor</span>
      </div>
    </section>
  </main>

  <script>
  'use strict';
  (function () {
    // Per-panel wire versions this page was built against. See the
    // co-versioning note in the document head: same-binary, so a mismatch
    // should never occur in practice; the check is a graceful-degrade
    // guard, not version negotiation.
    var EXPECTED = { usage: 3, health: 5, config: 2, doctor: 4 };
    var PANELS = ['usage', 'health', 'config', 'doctor'];
    var WINDOWS = ['today', 'week', 'month', 'all'];

    var BASE_MS = 5000;              // steady cadence
    var BACKOFF_MS = [10000, 20000, 30000]; // transport-failure backoff, 30s cap
    var TIMEOUT_MS = 2000;           // per-fetch AbortController budget
    var SKEW_TOLERANCE_SEC = 2;      // future as_of within this is not clock skew
    var FRESH_SLACK_MS = 3000;       // grace past the due round before "stale"

    var selectedWindow = 'today';
    var terminal = false;            // set on 403; stops the loop permanently
    var running = false;             // one aggregate round in flight at a time
    var timer = null;
    var backoffIndex = -1;           // -1 = base cadence; 0..n = BACKOFF_MS index
    var lastSuccess = null;          // wall time of the last good aggregate round
    var windowCtrl = null;           // single-flights the extra usage window fetch

    var activeTab = 'usage';         // controls panel VISIBILITY only; all poll
    var countdownTimer = null;       // 1s interval driving the live clock
    var remainingSec = 0;            // seconds until the next scheduled round
    var backingOff = false;          // reflects backoff state in the clock text
    var nextDueAtMs = 0;             // wall-clock instant the next round is due

    // Favicon signal from the LAST fresh render of each panel: the badge kind
    // (warn, error, or null) a successful render produced, and whether that
    // render found the panel unavailable. Transport failures do NOT touch
    // these (they surface via backoff/staleness at a higher favicon
    // precedence), so warn_error recovers only when a fresh round lands.
    var panelBadgeKind = {};
    var panelUnavail = {};

    // Expansion state keyed by table caption -> { rowKey: true }. Survives the
    // per-poll DOM rebuild so an operator's expanded row stays open across
    // refreshes.
    var expanded = {};
    var uid = 0;

    // Server clock for the CURRENT render round: Date.parse(env.as_of),
    // refreshed per panel in renderPanel. All data-age arithmetic (circuit
    // "open for", quota reset elapsed-flagging) reads THIS, never Date.now(),
    // so client clock skew can neither invent a negative age nor un-elapse a
    // reset. NaN when as_of is absent/unparseable -- callers degrade to "-".
    var serverNowMs = NaN;

    var el = function (id) { return document.getElementById(id); };

    // ---- number + time humanizers (match the CLI's usage formatters) -----

    // Compact a count exactly as the CLI's `human_count`: below 10000 the
    // plain integer; else one decimal with a K/M/B suffix, trimming ".0".
    // Null/undefined/non-finite render as "-".
    function humanCount(n) {
      if (n === null || n === undefined) { return '-'; }
      var x = Number(n);
      if (!isFinite(x)) { return '-'; }
      var neg = x < 0, a = Math.abs(x);
      if (a < 10000) { return (neg ? '-' : '') + String(Math.trunc(a)); }
      var v, s;
      if (a >= 1e9) { v = a / 1e9; s = 'B'; }
      else if (a >= 1e6) { v = a / 1e6; s = 'M'; }
      else { v = a / 1e3; s = 'K'; }
      var body = v.toFixed(1);
      if (body.slice(-2) === '.0') { body = body.slice(0, -2); }
      return (neg ? '-' : '') + body + s;
    }

    function num0(x) { var n = Number(x); return isFinite(n) ? n : 0; }

    // The CLI's `cache_hit_ratio` rendered as a percentage: `-` when the
    // denominator is degenerate (never "0%"), else one decimal + "%".
    function hitPct(num, den) {
      if (den <= 0) { return '-'; }
      return (num / den * 100).toFixed(1) + '%';
    }

    // Per-group cache-inclusive prompt-token denominator (the CLI's
    // `cache_prompt_den`): input + cache_read_billed + cache_write_5m +
    // cache_write_1h. The group carries all four fields.
    function groupDen(g) {
      return num0(g.input_tokens) + num0(g.cache_read_billed) +
        num0(g.cache_write_5m) + num0(g.cache_write_1h);
    }

    // Totals cache-write: the totals wire object lacks the cache_write
    // fields, so sum them across the groups (same technique as the hit%
    // denominator).
    function totalsCacheWrite(groups) {
      var sum = 0;
      groups.forEach(function (g) {
        sum += num0(g.cache_write_5m) + num0(g.cache_write_1h);
      });
      return sum;
    }

    // Compact absolute local timestamp for an epoch-ms instant.
    function fmtTs(ms) {
      if (ms === null || ms === undefined) { return '-'; }
      var d = new Date(ms);
      return isNaN(d.getTime()) ? String(ms) : d.toLocaleString();
    }

    // Timestamp cell that treats a non-positive epoch as absent ("-").
    // Guards the quota-reset field (a real reset is always well in the future).
    function fmtTsPos(ms) {
      if (ms === null || ms === undefined || Number(ms) <= 0) { return '-'; }
      return fmtTs(ms);
    }

    // Relative age of an as_of instant in seconds -> humane phrase.
    function relAge(sec) {
      if (sec < 10) { return 'just now'; }
      if (sec < 60) { return sec + 's ago'; }
      if (sec < 3600) { return Math.floor(sec / 60) + 'm ago'; }
      return Math.floor(sec / 3600) + 'h ago';
    }

    // Percentage from a 0..1 fraction (quota utilization), rounded to whole.
    function pctFrac(f) {
      if (f === null || f === undefined) { return '-'; }
      var x = Number(f);
      return isFinite(x) ? Math.round(x * 100) + '%' : '-';
    }

    // Humane duration for a millisecond span (circuit "open for"). Coarse by
    // design: whole seconds under a minute, whole minutes under an hour, else
    // whole hours. Negative spans are clamped by the caller.
    function humanDuration(ms) {
      var sec = Math.floor(ms / 1000);
      if (sec < 60) { return sec + 's'; }
      if (sec < 3600) { return Math.floor(sec / 60) + 'm'; }
      return Math.floor(sec / 3600) + 'h';
    }

    // ---- label maps ------------------------------------------------------

    // Humanized labels + hover tooltips for the value-domain wire tokens,
    // keyed by token FAMILY. The families here MIRROR the `.tok` CSS families
    // in the <style> block above (search "Value-domain tokens"): a new token
    // is added in BOTH adjacent, mutually-pointing places -- a color rule
    // there, a label entry here.
    //
    // Each entry is `{ label, title }`. `label` is the humanized VISIBLE text
    // (falls back to the raw token when omitted, so cramped wire tokens like
    // `five_hour` stay verbatim); `title` is the hover tooltip, which always
    // preserves the raw token or its meaning so nothing is lost. An unknown
    // token (or unknown family) passes through as its raw string with no
    // tooltip -- parity with the neutral `.tok` CSS fallback.
    var LABELS = {
      circuit: {
        closed: { label: 'ok', title: 'closed - healthy, requests flow' },
        open: { label: 'open', title: 'open - failing fast, requests shed' },
        half_open_ready: { label: 'half-open', title: 'half_open_ready - probing recovery' }
      },
      reach: {
        reachable: { label: 'reachable', title: 'last dispatch outcome was ok' },
        degraded: { label: 'degraded', title: 'last dispatch outcome was a failure family or gate refusal' },
        unknown: { label: 'unknown', title: 'no settled outcome yet (fresh state or post-restart)' }
      },
      status: {
        Pass: { label: 'pass', title: 'Pass' },
        Warn: { label: 'warn', title: 'Warn' },
        Fail: { label: 'fail', title: 'Fail' }
      },
      verdict: {
        'route-away': { label: 'route away', title: 'route-away - capability filtered out for this target' },
        'force-supported': { label: 'force supported', title: 'force-supported - capability forced on for this target' }
      },
      learned: {
        verified: { label: 'verified', title: 'verified - capability confirmed supported for this target' },
        broken: { label: 'broken', title: 'broken - capability confirmed unsupported for this target' }
      },
      prov: {
        provider: { label: 'provider', title: 'provider - legacy per-provider unsupported_features' },
        model: { label: 'model', title: 'model - legacy per-model unsupported_features' },
        override: { label: 'override', title: 'override - a [capability.overrides.<spec>] entry' },
        learned: { label: 'learned', title: 'learned - a non-expired acting negative in the learned registry' }
      },
      src: {
        user: { label: 'user', title: 'user - operator catalog layer' },
        import: { label: 'import', title: 'import - imported catalog layer' },
        baked: { label: 'baked', title: 'baked - built-in catalog layer' },
        disabled: { label: 'disabled', title: 'disabled - row present but disabled' },
        missing: { label: 'missing', title: 'missing - no catalog row resolved' }
      },
      tier: {
        'self-identifying': { label: 'self-identifying', title: 'the upstream declared the capability itself' },
        inferred: { label: 'inferred', title: 'inferred from observed behavior' }
      },
      // Quota representative-claim. The raw token stays visible (no label
      // override for five_hour); the window meaning goes in the tooltip.
      claim: {
        five_hour: { title: 'five_hour - 5-hour rolling subscription window' },
        overage: { label: 'overage', title: 'overage - billing past the included subscription quota' }
      },
      // Quota STATUS / OVERAGE pass-through values (color families in CSS as
      // `.qstatus-*`). Tooltips are light; unknown values pass through raw.
      qstatus: {
        allowed: { title: 'within quota' },
        allowed_warning: { title: 'approaching the quota limit' },
        rejected: { title: 'quota exhausted, requests rejected' },
        queued: { title: 'requests queued behind the quota' },
        triggered: { title: 'overage billing engaged' }
      },
      // Provider auto-activation reason codes. Raw token stays visible where
      // space is tight; the meaning goes in the tooltip.
      activation: {
        oauth_missing: { title: 'oauth_missing - no OAuth credential on file' },
        oauth_expired: { title: 'oauth_expired - OAuth token expired, no refresh available' },
        oauth_store_unavailable: { title: 'oauth_store_unavailable - no OAuth store to probe (HOME or XDG absent)' },
        not_cataloged: { title: 'not_cataloged - own-credential provider has no baked catalog rows yet' },
        unknown: { title: 'unknown - an activation state this build does not recognize' }
      },
      // Health last-settled-outcome tokens.
      outcome: {
        ok: { label: 'ok' },
        rate_limited: { label: 'rate limited', title: 'rate_limited' },
        timeout: { label: 'timeout' },
        transport_error: { label: 'transport error', title: 'transport_error' },
        http_4xx: { label: 'http 4xx', title: 'http_4xx - a 4xx client-side rejection' },
        http_5xx: { label: 'http 5xx', title: 'http_5xx - a 5xx server-side failure' },
        circuit_open: { label: 'circuit open', title: 'circuit_open - derived from an open breaker' }
      },
      // Resolved failure-class names for the usage error breakdown.
      class: {
        'rate-limited': { label: 'rate limited' },
        auth: { label: 'auth' },
        'bad-request': { label: 'bad request' },
        'content-policy': { label: 'content policy' },
        'context-window': { label: 'context window' },
        'server-error': { label: 'server error' },
        timeout: { label: 'timeout' },
        'network-error': { label: 'network error' },
        overloaded: { label: 'overloaded' },
        'feature-unsupported': { label: 'feature unsupported' },
        unclassified: { label: 'unclassified', title: 'errors with no resolved failure class' }
      }
    };

    // Resolve a wire token to { label, title } for a family. Unknown token or
    // unknown family -> raw passthrough (label = raw, no tooltip), mirroring
    // the neutral `.tok` CSS fallback so nothing crashes or hides.
    function labelFor(family, raw) {
      var key = (raw === null || raw === undefined) ? '' : String(raw);
      var fam = LABELS[family];
      var entry = fam ? fam[key] : undefined;
      if (!entry) { return { label: key || '-', title: null }; }
      return { label: (entry.label === undefined) ? key : entry.label, title: entry.title || null };
    }

    // A humanized text cell (a plain value, or a titled span when the family
    // carries a tooltip) for tokens that are NOT `.tok` color pills: quota
    // claim, activation reasons, health last-outcomes, error-class names.
    // Returns a string when there is no tooltip (rendered via textContent) or
    // a titled span Node otherwise.
    function labelCell(family, raw) {
      var lab = labelFor(family, raw);
      if (!lab.title) { return lab.label; }
      var span = document.createElement('span');
      span.textContent = lab.label;
      span.title = lab.title;
      return span;
    }

    // ---- transport -------------------------------------------------------

    // GET a status URL under a 2s abort budget. Returns a tagged outcome:
    // ok(json) | overloaded (503) | forbidden (403) | timeout (abort) |
    // network (refused / other error / non-2xx). No request body, no
    // mutating verb -- fetch defaults to GET and none is set.
    function fetchStatus(url, ctrl) {
      var timeout = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
      return fetch(url, { signal: ctrl.signal, cache: 'no-store' }).then(function (resp) {
        if (resp.status === 403) { return { kind: 'forbidden' }; }
        if (resp.status === 503) { return { kind: 'overloaded' }; }
        if (!resp.ok) { return { kind: 'network' }; }
        return resp.json().then(function (json) { return { kind: 'ok', json: json }; });
      }).catch(function (err) {
        return { kind: (err && err.name === 'AbortError') ? 'timeout' : 'network' };
      }).then(function (out) {
        clearTimeout(timeout);
        return out;
      });
    }

    // The extra usage window fetch, single-flighted: a newer window
    // selection aborts the previous one so a late response never repaints
    // newer state, and at most one window fetch coexists with the one
    // aggregate fetch (at most 2 in flight, only while non-today).
    function fetchWindow(w) {
      if (windowCtrl) { windowCtrl.abort(); }
      var ctrl = new AbortController();
      windowCtrl = ctrl;
      return fetchStatus('/status/usage?window=' + encodeURIComponent(w), ctrl).then(function (r) {
        if (windowCtrl === ctrl) { windowCtrl = null; }
        return r;
      });
    }

    // ---- poll loop -------------------------------------------------------

    // Render-callback seam: callbacks fired after each completed render round (a
    // future push / animation layer registers here via onPollTick). Empty today;
    // invocation stays wired so the hook cannot silently rot. A throwing
    // callback is isolated so it never wedges the loop.
    var pollTickCbs = [];
    function onPollTick(cb) { pollTickCbs.push(cb); }
    function firePollTick() {
      pollTickCbs.forEach(function (cb) {
        try { cb(); } catch (e) { /* a hook must not break the loop */ }
      });
    }

    // ---- glanceability viz store ------------------------------------

    // Six hero metrics tracked as per-poll DELTAS of their cumulative totals,
    // sampled ONLY from the today-window poll path (the hero totals are
    // window-cumulative, so raw plots are ramps and cross-window samples
    // fabricate trends -- deltas are the honest rate proxy). A sample is
    // {t: Date.now(), v: delta}; a negative delta (ledger reset / midnight
    // rollover) appends NO sample and rebaselines, so the resulting time hole
    // renders the discontinuity. Non-today windows pause both sampling and
    // display. Buffers are bounded to SPARK_CAP; prevRaw / renderedNum are
    // one-per-key. GAP_MS (~2.5x cadence) is the sparkline split + no-recovery-
    // tween threshold: a failed / skipped round leaves a time hole wider than
    // this, which reads as a break rather than a connected line.
    var HERO_KEYS = ['requests', 'input', 'output', 'cache_read', 'cache_write', 'reasoning'];
    var SPARK_CAP = 60;
    var GAP_MS = Math.round(BASE_MS * 2.5);

    var sparkBuf = {};    // key -> [{t, v}] bounded delta samples
    var prevRaw = {};     // key -> last raw cumulative total (delta basis)
    var renderedNum = {}; // key -> last displayed cumulative (tween basis)
    var tweenRAF = {};    // key -> in-flight requestAnimationFrame id
    HERO_KEYS.forEach(function (k) { sparkBuf[k] = []; });

    var lastPollSampleT = 0;   // wall time of the last committed sample round
    var reducedMotion = false; // prefers-reduced-motion, cached ONCE at init
    var prevGroupCell = {};    // "rowKey|col" -> last displayed group-cell string

    // Per-render motion context, set immediately before every usage render so
    // buildUsage can tell a today-window poll commit (fresh sparkline point +
    // count-up tween + change flash) from a view-only repaint (a window switch,
    // which must not animate). `gap` true suppresses the recovery tween.
    var vizCtx = { today: false, motion: false, gap: true, tween: null };
    function viewOnlyCtx() { return { today: false, motion: false, gap: true, tween: null }; }

    function pushSpark(key, sample) {
      var buf = sparkBuf[key];
      buf.push(sample);
      if (buf.length > SPARK_CAP) { buf.splice(0, buf.length - SPARK_CAP); }
    }

    // The raw cumulative total feeding each hero key (totalsCacheWrite sums the
    // cache-write buckets the totals object omits; see below).
    function heroRaw(data, key) {
      var to = data.totals || {};
      if (key === 'requests') { return num0(to.requests); }
      if (key === 'input') { return num0(to.input_tokens); }
      if (key === 'output') { return num0(to.output_tokens); }
      if (key === 'cache_read') { return num0(to.cache_read_billed); }
      if (key === 'cache_write') { return totalsCacheWrite(data.groups || []); }
      if (key === 'reasoning') { return num0(to.reasoning_tokens); }
      return 0;
    }

    // Prepare the viz context for a today-window poll render and, when the
    // panel carries live usage data, commit one delta sample per hero metric.
    // Called ONLY from the aggregate poll path (runRound, today selected) --
    // the sole source of today-window data (a switch back to today re-enters
    // via kickRefresh -> runRound), so a committed sample is always genuine
    // poll data, never the selector's out-of-band fetch.
    function prepareTodaySample(env) {
      vizCtx = { today: true, motion: false, gap: true, tween: null };
      var live = env && env.schema_version === EXPECTED.usage && !env.unavailable && env.data;
      if (!live) { return; }
      var now = Date.now();
      var gap = (lastPollSampleT === 0) || (now - lastPollSampleT > GAP_MS);
      var motion = !reducedMotion && !document.hidden;
      var tween = {};
      HERO_KEYS.forEach(function (key) {
        var cur = heroRaw(env.data, key);
        var prev = prevRaw[key];
        prevRaw[key] = cur;
        if (prev === undefined || cur < prev) { return; } // rebaseline: no sample
        pushSpark(key, { t: now, v: cur - prev });
        if (!gap && motion && renderedNum[key] !== undefined && renderedNum[key] !== cur) {
          tween[key] = { from: renderedNum[key], to: cur };
        }
      });
      vizCtx.motion = motion;
      vizCtx.gap = gap;
      vizCtx.tween = tween;
      lastPollSampleT = now;
    }

    // rAF count-up: interpolate the raw cumulative from -> to over ~300ms,
    // re-formatting through magSpan each frame so the K/M/B suffix transitions
    // fall out. Cancel-on-replace keeps at most one rAF per key.
    function tweenValue(node, from, to, key) {
      var dur = 300;
      var start = null;
      function frame(ts) {
        if (start === null) { start = ts; }
        var p = (ts - start) / dur;
        if (p >= 1) { p = 1; }
        node.replaceChildren(magSpan(Math.round(from + (to - from) * p)));
        if (p < 1) { tweenRAF[key] = requestAnimationFrame(frame); }
        else { delete tweenRAF[key]; }
      }
      tweenRAF[key] = requestAnimationFrame(frame);
    }

    function cancelTween(key) {
      if (tweenRAF[key]) { cancelAnimationFrame(tweenRAF[key]); delete tweenRAF[key]; }
    }

    function cancelAllTweens() {
      Object.keys(tweenRAF).forEach(function (k) { cancelTween(k); });
    }

    function tick() {
      if (terminal || running) { return; }
      running = true;
      syncRefreshBtn();
      runRound().then(function (res) {
        running = false;
        firePollTick();
        if (res && res.terminal) { updateFavicon(); return; }
        scheduleNext(!!(res && res.ok));
        updateFavicon();
      }).catch(function () {
        // A bug in rendering must not wedge the loop; treat as a failed
        // round and keep polling with backoff.
        running = false;
        firePollTick();
        scheduleNext(false);
        updateFavicon();
      });
    }

    function scheduleNext(ok) {
      if (terminal) { return; }
      backoffIndex = ok ? -1 : Math.min(backoffIndex + 1, BACKOFF_MS.length - 1);
      var delay = backoffIndex < 0 ? BASE_MS : BACKOFF_MS[backoffIndex];
      backingOff = backoffIndex >= 0;
      nextDueAtMs = Date.now() + delay;
      startCountdown(Math.round(delay / 1000));
      clearTimeout(timer);
      timer = setTimeout(tick, delay);
      syncRefreshBtn();
    }

    // Immediately kick a fresh aggregate round (used when the operator
    // returns to Today, or clicks Refresh). Shares the single-in-flight /
    // terminal gate; the Refresh button is additionally disabled during
    // backoff (see syncRefreshBtn), so a manual click is an edge trigger
    // with no queue and no backoff reset.
    function kickRefresh() {
      if (terminal || running) { return; }
      clearTimeout(timer);
      tick();
    }

    function runRound() {
      var w = selectedWindow;
      var aggCtrl = new AbortController();
      var aggPromise = fetchStatus('/status', aggCtrl);
      var winPromise = (w !== 'today') ? fetchWindow(w) : null;

      return aggPromise.then(function (agg) {
        if (agg.kind === 'forbidden') {
          return drain(winPromise).then(function () { enterTerminal(); return { terminal: true }; });
        }
        if (agg.kind !== 'ok') {
          markTransport(agg.kind);
          return drain(winPromise).then(function () { return { ok: false }; });
        }

        // Aggregate is live. Siblings always render from it; the usage
        // panel renders from the aggregate ONLY while Today is selected --
        // otherwise the window fetch owns it (single render path, no drift).
        renderPanel('health', getPanel(agg.json, 'health'));
        renderPanel('config', getPanel(agg.json, 'config'));
        renderPanel('doctor', getPanel(agg.json, 'doctor'));
        if (w === 'today' && selectedWindow === 'today') {
          var usageEnv = getPanel(agg.json, 'usage');
          // Sample the today-window deltas BEFORE the render so the fresh
          // point is in the buffer when buildUsage draws the sparklines.
          prepareTodaySample(usageEnv);
          renderPanel('usage', usageEnv);
        }
        lastSuccess = new Date();
        clearBanner();

        if (!winPromise) { return { ok: true }; }
        return winPromise.then(function (win) { return applyWindowResult(win, w); });
      });
    }

    function drain(p) { return p ? p.then(function () {}) : Promise.resolve(); }

    // Apply a window-fetch outcome to the usage panel and report whether the
    // round succeeded. Only the AGGREGATE loop consumes the ok flag for its
    // backoff; the selector's out-of-band fetch (onWindowChange) deliberately
    // ignores it, so a live /status/usage can never clear a backoff caused by
    // a dead /status. A per-panel `unavailable` arrives over HTTP 200 as kind
    // 'ok' and is handled by renderPanel below, so it renders without a
    // transport mark.
    function applyWindowResult(win, w) {
      if (win.kind === 'forbidden') { enterTerminal(); return { terminal: true }; }
      if (win.kind === 'ok') {
        // A window fetch is never today-window data (today re-enters via the
        // aggregate poll path), so this repaint is view-only: no sampling, no
        // tween, no flash.
        if (selectedWindow === w) { vizCtx = viewOnlyCtx(); renderPanel('usage', win.json); }
        return { ok: true };
      }
      if (selectedWindow === w) { muteUsageOnly(win.kind); }
      return { ok: false };
    }

    // ---- window selector -------------------------------------------------

    function onWindowChange(w) {
      if (terminal || w === selectedWindow) { return; }
      selectedWindow = w;
      updateSelectorUI();
      writeHash();
      if (w === 'today') {
        kickRefresh();
      } else if (!backingOff) {
        // A live selection repaints the usage panel at once (not only on the
        // next tick). This fetch repaints ONLY the usage panel; it must NOT
        // touch the aggregate loop's backoff or schedule. Recovery from a
        // transport failure is owned solely by a fresh AGGREGATE round (the
        // favicon truthfulness invariant), so a succeeding window fetch may
        // not clear backingOff or re-arm nextDueAtMs -- otherwise a live
        // /status/usage could mask a dead /status. The countdown clock keeps
        // reflecting the untouched aggregate schedule, so nothing display-
        // local needs re-rendering here either.
        fetchWindow(w).then(function (win) {
          applyWindowResult(win, w);
          firePollTick();
          updateFavicon();
        }).catch(function () {
          // fetchStatus resolves every transport failure to a kind (handled
          // in applyWindowResult -> muteUsageOnly), so this only fires on an
          // unexpected render throw. Isolate it; leave the loop untouched.
          firePollTick();
          updateFavicon();
        });
      }
      // While backing off (or terminal, returned above) the selection switches
      // the VIEW only -- selectedWindow and the hash are already updated. The
      // next successful aggregate round reads selectedWindow and renders it
      // (see runRound), so no out-of-band fetch bypasses the backoff cadence.
    }

    // ---- render dispatch -------------------------------------------------

    // The single render path shared by the poll loop and any future push
    // (a push event would be the same per-panel shape keyed by panel name).
    function renderPanel(name, env) {
      var panel = el('panel-' + name);
      var status = el('status-' + name);
      var body = el('body-' + name);
      panel.classList.remove('panel--ok', 'panel--unavailable', 'panel--stale', 'panel--dead');

      if (!env) {
        return renderUnavailable(name, 'missing_panel', 'panel absent from response');
      }
      if (env.schema_version !== EXPECTED[name]) {
        return renderUnavailable(name, 'incompatible',
          'schema ' + env.schema_version + ' != expected ' + EXPECTED[name]);
      }
      if (env.unavailable) {
        return renderUnavailable(name, env.unavailable, null);
      }

      panel.classList.add('panel--ok');
      var data = env.data || {};
      // Content badge from THIS fresh success only. setTabState is the single
      // badge writer; a transport failure later overwrites it with a
      // stale/offline label (which wins) rather than clearing it to zero.
      var badge = panelBadge(name, data);
      setTabState(name, badge);
      panelBadgeKind[name] = badge ? badge.kind : null;
      panelUnavail[name] = false;
      // Pin the server clock for this panel's render round so all data-age
      // arithmetic in the builder uses as_of, never the client's Date.now().
      serverNowMs = Date.parse(env.as_of);
      // Fresh data: an accent dot + relative/absolute as_of, with a brief
      // opacity pulse so a live poll is visibly landing.
      status.replaceChildren();
      status.appendChild(makeLiveDot());
      status.appendChild(document.createTextNode(formatAsOf(env.as_of)));
      pulse(status);
      body.replaceChildren(BUILDERS[name](data));
    }

    function renderUnavailable(name, code, extra) {
      var panel = el('panel-' + name);
      var status = el('status-' + name);
      var body = el('body-' + name);
      panel.classList.remove('panel--ok', 'panel--stale', 'panel--dead');
      panel.classList.add('panel--unavailable');
      setTabState(name, { label: 'n/a', kind: 'muted' });
      // A fresh round found this panel unavailable -> a warn_error favicon
      // signal until a later fresh round clears it.
      panelBadgeKind[name] = null;
      panelUnavail[name] = true;
      status.textContent = '';
      var div = document.createElement('div');
      div.className = 'unavailable-msg';
      div.textContent = 'unavailable: ' + code + (extra ? ' (' + extra + ')' : '');
      body.replaceChildren(div);
    }

    function getPanel(agg, name) {
      return (agg && agg.panels) ? agg.panels[name] : undefined;
    }

    // The small round status indicator shared by the fresh-render and
    // transport-down status lines. Its motion / down-state color is CSS
    // (ambience banner); this only builds the neutral element.
    function makeLiveDot() {
      var dot = document.createElement('span');
      dot.className = 'live-dot';
      dot.setAttribute('aria-hidden', 'true');
      return dot;
    }

    // Brief opacity pulse to signal a fresh poll landed. Re-triggered each
    // round by clearing and re-adding the class (a reflow read restarts the
    // animation); prefers-reduced-motion nulls the animation in CSS.
    function pulse(node) {
      node.classList.remove('pulse');
      void node.offsetWidth;
      node.classList.add('pulse');
    }

    // as_of age as a humane relative phrase plus a compact absolute local
    // time. If as_of is in the future beyond a small tolerance, label clock
    // skew rather than showing a negative age.
    function formatAsOf(asOf) {
      if (!asOf) { return ''; }
      var then = new Date(asOf);
      if (isNaN(then.getTime())) { return 'as of ' + asOf; }
      var ageSec = Math.round((Date.now() - then.getTime()) / 1000);
      if (ageSec < -SKEW_TOLERANCE_SEC) {
        return 'clock skew: source clock ahead (' + then.toLocaleTimeString() + ')';
      }
      if (ageSec < 0) { ageSec = 0; }
      return relAge(ageSec) + ' - ' + then.toLocaleTimeString();
    }

    // ---- transport-failure presentation ---------------------------------

    // A failed refresh must NEVER leave last-good numbers rendered as
    // current. 503 marks every panel visibly stale (muted last-known values
    // plus a "last success" note); a network/timeout failure clears the
    // numbers to an explicit no-current-data state.
    function markTransport(kind) {
      var mode = (kind === 'overloaded') ? 'stale' : 'dead';
      PANELS.forEach(function (n) { markPanelTransport(n, mode); });
      if (kind === 'overloaded') {
        setBanner('warn', 'status overloaded: showing last known values, backing off');
      } else if (kind === 'timeout') {
        setBanner('error', 'status request timed out, backing off');
      } else {
        setBanner('error', 'daemon unreachable, backing off');
      }
    }

    function muteUsageOnly(kind) {
      markPanelTransport('usage', (kind === 'overloaded') ? 'stale' : 'dead');
    }

    function markPanelTransport(name, mode) {
      var panel = el('panel-' + name);
      var status = el('status-' + name);
      var body = el('body-' + name);
      panel.classList.remove('panel--ok', 'panel--unavailable', 'panel--stale', 'panel--dead');
      var note = lastSuccess
        ? 'last success at ' + lastSuccess.toLocaleTimeString()
        : 'no successful poll yet';
      if (mode === 'stale') {
        panel.classList.add('panel--stale');
        setTabState(name, { label: 'stale', kind: 'warn' });
        status.replaceChildren();
        status.appendChild(makeLiveDot());
        status.appendChild(document.createTextNode('stale: ' + note));
      } else {
        panel.classList.add('panel--dead');
        setTabState(name, { label: 'offline', kind: 'error' });
        status.replaceChildren();
        status.appendChild(makeLiveDot());
        status.appendChild(document.createTextNode('no current data: ' + note));
        var div = document.createElement('div');
        div.className = 'unavailable-msg';
        div.textContent = 'unavailable (transport failure)';
        body.replaceChildren(div);
      }
    }

    function enterTerminal() {
      terminal = true;
      clearTimeout(timer);
      clearInterval(countdownTimer);
      el('clock').textContent = 'polling stopped';
      setBanner('terminal',
        'This dashboard must be opened via the loopback or bound address ' +
        '(for example http://127.0.0.1:8787). Polling has stopped.');
      PANELS.forEach(function (n) { markPanelTransport(n, 'dead'); });
      updateSelectorUI();
      syncRefreshBtn();
      updateFavicon();
    }

    function setBanner(kind, text) {
      var b = el('banner');
      b.hidden = false;
      b.textContent = text;
      b.className = 'banner banner--' + kind;
    }

    function clearBanner() {
      var b = el('banner');
      b.hidden = true;
      b.textContent = '';
      b.className = 'banner';
    }

    // ---- tab state badges ------------------------------------------------

    // The content badge for a panel's tab, computed ONLY from a fresh
    // successful render (renderPanel's ok branch). Returns a { label, kind }
    // state or null (no badge). Counts a genuine problem per panel: usage
    // errors, health non-closed circuits, doctor warn+fail findings. Config
    // carries no error concept, so it never badges. A zero count returns null
    // so a clean panel shows nothing.
    function panelBadge(name, data) {
      if (name === 'usage') {
        var errs = num0((data.totals || {}).errors);
        return errs > 0 ? { label: humanCount(errs), kind: 'error' } : null;
      }
      if (name === 'health') {
        var open = (data.targets || []).filter(function (t) {
          return t.circuit && t.circuit !== 'closed';
        }).length;
        return open > 0 ? { label: String(open), kind: 'warn' } : null;
      }
      if (name === 'doctor') {
        var findings = (data.report || {}).findings || [];
        var warn = 0, fail = 0;
        findings.forEach(function (f) {
          if (f.status === 'Warn') { warn += 1; }
          else if (f.status === 'Fail') { fail += 1; }
        });
        var total = warn + fail;
        if (total === 0) { return null; }
        return { label: String(total), kind: fail > 0 ? 'error' : 'warn' };
      }
      return null;
    }

    // Surface a small badge on the tab when its panel is stale / offline /
    // unavailable, so a problem is visible without switching to that tab.
    function setTabState(name, state) {
      var badge = el('badge-' + name);
      if (!badge) { return; }
      if (!state) {
        badge.hidden = true;
        badge.textContent = '';
        badge.className = 'tab-badge';
        return;
      }
      badge.hidden = false;
      badge.textContent = state.label;
      badge.className = 'tab-badge tab-badge--' + state.kind;
    }

    // ---- expansion state -------------------------------------------------

    function getExpanded(tableKey, rowKey) {
      return !!(expanded[tableKey] && expanded[tableKey][rowKey]);
    }

    function setExpanded(tableKey, rowKey, open) {
      if (!expanded[tableKey]) { expanded[tableKey] = {}; }
      if (open) { expanded[tableKey][rowKey] = true; }
      else { delete expanded[tableKey][rowKey]; }
    }

    // ---- DOM table helpers (textContent only, never innerHTML) -----------

    // Column descriptors: C = text, N = numeric (right-aligned, mono,
    // tabular), R = row-header identifier column (<th scope="row">),
    // W = wrapping prose column.
    function C(label) { return { label: label }; }
    function N(label) { return { label: label, num: true }; }
    function R(label) { return { label: label, row: true }; }
    function W(label) { return { label: label, wrap: true }; }

    // Attach a header tooltip to a column descriptor, returning a NEW
    // descriptor (the base C/N/R/W factories stay single-purpose).
    function withTitle(col, title) {
      var next = {};
      Object.keys(col).forEach(function (k) { next[k] = col[k]; });
      next.title = title;
      return next;
    }

    // Build a table with a visually-hidden caption, `scope="col"` headers,
    // and per-column alignment metadata. `expandable` prepends a leading
    // control column whose cells carry a disclosure button.
    function mkTable(caption, cols, expandable) {
      var t = document.createElement('table');
      var cap = document.createElement('caption');
      cap.className = 'sr-only';
      cap.textContent = caption;
      t.appendChild(cap);
      var thead = document.createElement('thead');
      var hr = document.createElement('tr');
      if (expandable) {
        var eth = document.createElement('th');
        eth.scope = 'col';
        var sr = document.createElement('span');
        sr.className = 'sr-only';
        sr.textContent = 'Details';
        eth.appendChild(sr);
        hr.appendChild(eth);
      }
      cols.forEach(function (col) {
        var th = document.createElement('th');
        th.scope = 'col';
        th.textContent = col.label;
        if (col.title) { th.title = col.title; }
        if (col.num) { th.className = 'num'; }
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      t.appendChild(thead);
      var tb = document.createElement('tbody');
      t.appendChild(tb);
      return { t: t, tb: tb, cols: cols, key: caption, expandable: !!expandable };
    }

    function cellNode(col, cell) {
      var node = document.createElement(col.row ? 'th' : 'td');
      if (col.row) { node.scope = 'row'; }
      if (col.num) { node.className = 'num'; }
      if (col.wrap) { node.className = 'wrap'; }
      if (cell instanceof Node) {
        node.appendChild(cell);
      } else {
        node.textContent = (cell === null || cell === undefined) ? '-' : String(cell);
      }
      return node;
    }

    // Append one plain row. Cells are parallel to the table's columns; a cell
    // may be a raw value (rendered via textContent) or a Node (a pill).
    function trow(tbl, cells) {
      var tr = document.createElement('tr');
      tbl.cols.forEach(function (col, i) { tr.appendChild(cellNode(col, cells[i])); });
      tbl.tb.appendChild(tr);
    }

    // Append an expandable row: the primary cells plus a hidden detail row
    // (a definition grid of the secondary fields) toggled by a keyboard-
    // accessible disclosure button. The WHOLE primary row is clickable (the
    // button stays the visible affordance); a single toggle closure drives
    // both, with the button stopping propagation so a button click does not
    // also fire the row handler and double-toggle. Expansion persists across
    // poll rebuilds via the `expanded` map keyed by (table caption, rowKey).
    // An optional `rowClass` de-emphasizes the primary row (zero-traffic).
    function xrow(tbl, rowKey, cells, detailPairs, rowClass) {
      var tr = document.createElement('tr');
      tr.className = 'exp-row' + (rowClass ? ' ' + rowClass : '');

      var detailRow = document.createElement('tr');
      detailRow.className = 'detail-row';
      var did = 'detail-' + (uid++);
      detailRow.id = did;
      var dcell = document.createElement('td');
      dcell.colSpan = tbl.cols.length + 1;
      dcell.appendChild(buildDefList(detailPairs));
      detailRow.appendChild(dcell);
      var open = getExpanded(tbl.key, rowKey);
      detailRow.hidden = !open;

      var extd = document.createElement('td');
      extd.className = 'exp-cell';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'exp-btn';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-controls', did);
      btn.setAttribute('aria-label', 'Toggle row details');
      btn.textContent = open ? 'v' : '>';

      function toggle() {
        var nowOpen = !getExpanded(tbl.key, rowKey);
        setExpanded(tbl.key, rowKey, nowOpen);
        btn.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
        btn.textContent = nowOpen ? 'v' : '>';
        detailRow.hidden = !nowOpen;
      }

      btn.addEventListener('click', function (e) {
        // The row-level handler also toggles; stop here so a button click is
        // not counted twice.
        e.stopPropagation();
        toggle();
      });
      tr.addEventListener('click', toggle);
      extd.appendChild(btn);
      tr.appendChild(extd);

      tbl.cols.forEach(function (col, i) { tr.appendChild(cellNode(col, cells[i])); });
      tbl.tb.appendChild(tr);
      tbl.tb.appendChild(detailRow);
    }

    // A definition grid of label:value pairs. Values may be humanized
    // strings or Nodes (pills). textContent only.
    function buildDefList(pairs) {
      var dl = document.createElement('dl');
      dl.className = 'deflist';
      pairs.forEach(function (p) {
        var wrap = document.createElement('div');
        wrap.className = 'def';
        var dt = document.createElement('dt');
        dt.textContent = p[0];
        var dd = document.createElement('dd');
        if (p[1] instanceof Node) {
          dd.appendChild(p[1]);
        } else {
          dd.textContent = (p[1] === null || p[1] === undefined) ? '-' : String(p[1]);
        }
        wrap.appendChild(dt);
        wrap.appendChild(dd);
        dl.appendChild(wrap);
      });
      return dl;
    }

    // Value-domain token cell: raw wire string as textContent, styled by a
    // class keyed on the exact string. `prefix + '-' + raw` plus the `.tok`
    // fallback, so an unknown token stays readable and unstyled. Families that
    // carry a colorblind-safe leading dot get an explicit `.tok-dot` marker so
    // the dot is keyed on the family, never on a substring of the raw token.
    var DOT_FAMILIES = { circuit: 1, reach: 1, status: 1, qstatus: 1 };
    function tok(prefix, raw) {
      var span = document.createElement('span');
      span.className = 'tok ' + prefix + '-' + raw + (DOT_FAMILIES[prefix] ? ' tok-dot' : '');
      span.textContent = (raw === null || raw === undefined) ? '-' : String(raw);
      return span;
    }

    // A `.tok` pill whose COLOR class stays keyed on the raw wire token (so
    // styling is unaffected) but whose VISIBLE text is the humanized label
    // and whose title preserves the raw token / meaning. Unknown token ->
    // raw passthrough with no tooltip, exactly like `tok`.
    function tokLabeled(prefix, family, raw) {
      var span = tok(prefix, raw);
      var lab = labelFor(family, raw);
      span.textContent = lab.label;
      if (lab.title) { span.title = lab.title; }
      return span;
    }

    // A native default-collapsed disclosure: a summary line plus arbitrary
    // content. No JS state and no mutation affordance -- used for list-shaped
    // detail (e.g. the doctor reachability full list) that must stay
    // reachable (data floor) without dominating the panel.
    function buildExpander(summaryText, contentNode) {
      var det = document.createElement('details');
      var sum = document.createElement('summary');
      sum.textContent = summaryText;
      det.appendChild(sum);
      det.appendChild(contentNode);
      return det;
    }

    // Relative age from the SERVER clock: max(0, serverNowMs - ms). Serves a
    // circuit's "open for" duration (from open_since_ms) and a learned
    // negative's last-observation age (from last_seen_ms). A null / absent
    // input (closed / post-restart, or no last_seen) or an unusable server
    // clock renders "-" -- never a negative age, never invented pre-restart
    // history.
    function ageSince(ms) {
      if (ms === null || ms === undefined || !isFinite(serverNowMs)) {
        return '-';
      }
      return humanDuration(Math.max(0, serverNowMs - Number(ms)));
    }

    // Quota reset cell: a reset instant at or before the server's as_of has
    // already passed, so it renders "elapsed" (with the absolute time in the
    // title) rather than as a live countdown target. Compared to serverNowMs,
    // never Date.now(). Non-positive / absent -> "-".
    function quotaResetCell(resetMs) {
      if (resetMs === null || resetMs === undefined || Number(resetMs) <= 0) { return '-'; }
      if (isFinite(serverNowMs) && Number(resetMs) <= serverNowMs) {
        var span = document.createElement('span');
        span.textContent = 'elapsed';
        span.title = 'reset time already passed: ' + fmtTs(resetMs);
        return span;
      }
      return fmtTs(resetMs);
    }

    // Error breakdown as buildDefList pairs: one [humanized-class, count] pair
    // per resolved failure class (incl. the "unclassified" bucket). The counts
    // sum to the group's `errors` by construction, so an operator can eyeball
    // the reconciliation against the "errors" entry above them.
    function errorClassPairs(byClass) {
      var pairs = [];
      if (!byClass) { return pairs; }
      Object.keys(byClass).forEach(function (k) {
        pairs.push([labelFor('class', k).label, humanCount(byClass[k])]);
      });
      return pairs;
    }

    // A humanized numeric cell that carries the error color only when the
    // value is positive (errors / negative signals), else a plain figure.
    // Renders through magSpan so its K/M/B suffix stays muted like the rest.
    function negCell(n) {
      var span = magSpan(n);
      if (num0(n) > 0) { span.classList.add('neg'); }
      return span;
    }

    // ---- glanceability render helpers -------------------------------

    // Magnitude number with a smaller, muted K/M/B suffix in its own span.
    // Number formatting is IDENTICAL to humanCount (humanCount stays untouched
    // for deflists / footnotes); this only splits the suffix for typography and
    // de-emphasizes a zero / absent value. Returns a span (used in stat cards
    // and the main numeric table cells).
    function magSpan(n) {
      var span = document.createElement('span');
      if (n === null || n === undefined || !isFinite(Number(n))) {
        span.className = 'mag-zero';
        span.textContent = '-';
        return span;
      }
      var x = Number(n), neg = x < 0, a = Math.abs(x);
      if (x === 0) { span.className = 'mag-zero'; }
      if (a < 10000) {
        span.appendChild(document.createTextNode((neg ? '-' : '') + String(Math.trunc(a))));
        return span;
      }
      var v, s;
      if (a >= 1e9) { v = a / 1e9; s = 'B'; }
      else if (a >= 1e6) { v = a / 1e6; s = 'M'; }
      else { v = a / 1e3; s = 'K'; }
      var body = v.toFixed(1);
      if (body.slice(-2) === '.0') { body = body.slice(0, -2); }
      span.appendChild(document.createTextNode((neg ? '-' : '') + body));
      var unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = s;
      span.appendChild(unit);
      return span;
    }

    // SVG namespace for the sparklines. All sparkline SVG is built with
    // createElementNS + setAttribute ONLY -- every attribute value is numeric-
    // by-construction (viewBox, polyline points) or a static literal, so no
    // wire / user string is ever written into the DOM as markup. This keeps the
    // page's textContent-only posture (innerHTML is never used) and the
    // page.rs mutation-channel scan intact (this namespace literal opens with a
    // quote-then-letter, not a quote-then-slash, so it is not a path literal).
    var SVG_NS = 'http://www.w3.org/2000/svg';

    // A short trend sparkline from a metric's delta buffer. The polyline is
    // split into independent segments wherever the inter-sample time gap
    // exceeds GAP_MS, so a poll hole (transport failure, hidden tab, sleep,
    // window pause) renders as a break, never a line drawn across it. The
    // vertical scale is fit to the buffer's min/max with a div-by-zero guard
    // (a flat buffer draws a centered line).

    function sparkline(samples) {
      var W = 120, H = 24;
      var svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('class', 'spark');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      if (!samples || samples.length < 2) { return svg; }
      var min = samples[0].v, max = samples[0].v;
      samples.forEach(function (s) {
        if (s.v < min) { min = s.v; }
        if (s.v > max) { max = s.v; }
      });
      var vspan = max - min;
      var t0 = samples[0].t, t1 = samples[samples.length - 1].t, tspan = t1 - t0;
      function px(s) {
        var x = tspan > 0 ? (s.t - t0) / tspan * W : W;
        var y = vspan > 0 ? (H - 2) - ((s.v - min) / vspan) * (H - 4) : H / 2;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }
      var seg = [];
      function flush() {
        if (seg.length >= 2) {
          var pl = document.createElementNS(SVG_NS, 'polyline');
          pl.setAttribute('points', seg.join(' '));
          svg.appendChild(pl);
        }
        seg = [];
      }
      for (var i = 0; i < samples.length; i++) {
        if (i > 0 && (samples[i].t - samples[i - 1].t) > GAP_MS) { flush(); }
        seg.push(px(samples[i]));
      }
      flush();
      return svg;
    }

    // A conic-gradient ring gauge with a centered numeral (data floor: the
    // numeral is primary; the ring is a static gauge of the current value).
    // pct is clamped to 0..100; --pct drives the CSS conic-gradient.
    function ringGauge(pct, centerText, small) {
      var clamped = Math.max(0, Math.min(100, isFinite(pct) ? pct : 0));
      var ring = document.createElement('div');
      ring.className = 'ring' + (small ? ' ring--sm' : '');
      ring.style.setProperty('--pct', clamped);
      var center = document.createElement('span');
      center.className = 'ring-center';
      center.textContent = centerText;
      ring.appendChild(center);
      return ring;
    }

    // A numeric cell wrapped in a proportion bar sized by value/max. The
    // content node (a magSpan) rides on top; --pct is the fill fraction.
    function barCell(contentNode, value, max) {
      var span = document.createElement('span');
      span.className = 'barcell';
      var pct = max > 0 ? Math.max(0, Math.min(100, (num0(value) / max) * 100)) : 0;
      span.style.setProperty('--pct', pct);
      span.appendChild(contentNode);
      return span;
    }

    // Three fixed heat bands for a cache-hit ratio (higher is better): hi >=
    // 70%, mid 40-70%, lo < 40%. A degenerate denominator gets no band (the
    // ratio itself renders "-"). Thresholds are fixed and theme-checkable.
    function heatBand(num, den) {
      if (den <= 0) { return ''; }
      var pct = num / den * 100;
      if (pct >= 70) { return 'hit-hi'; }
      if (pct >= 40) { return 'hit-mid'; }
      return 'hit-lo';
    }

    // The hit% cell: the ratio string on a fixed heat band.
    function hitCell(num, den) {
      var span = document.createElement('span');
      span.className = 'hitcell';
      var band = heatBand(num, den);
      if (band) { span.classList.add(band); }
      span.textContent = hitPct(num, den);
      return span;
    }

    function subhead(container, text) {
      var h = document.createElement('h3');
      h.textContent = text;
      container.appendChild(h);
    }

    function none() {
      var d = document.createElement('div');
      d.className = 'none';
      d.textContent = '(none)';
      return d;
    }

    function statCard(label, value, opts) {
      var o = opts || {};
      var card = document.createElement('div');
      card.className = 'stat' + (o.flow ? ' stat--flow' : '');
      var v = document.createElement('div');
      v.className = 'stat-value' + (o.neg ? ' neg' : '');
      v.textContent = value;
      var l = document.createElement('div');
      l.className = 'stat-label';
      l.textContent = label;
      card.appendChild(v);
      card.appendChild(l);
      return card;
    }

    // A hero stat card carrying a magSpan numeral, a trend sparkline (today
    // window only -- non-today pauses display), and the count-up tween on a
    // today-window poll commit. renderedNum tracks the displayed cumulative so
    // the next commit tweens from it; only a today render updates that baseline,
    // so a non-today window (a different total) can never become a tween basis
    // and fabricate continuity on the round-trip back to today. cancelTween
    // keeps at most one rAF per key (cancel-on-replace, since the card DOM is
    // rebuilt each render).
    function heroCard(key, label, rawVal, flow) {
      var card = document.createElement('div');
      card.className = 'stat' + (flow ? ' stat--flow' : '');
      var v = document.createElement('div');
      v.className = 'stat-value';
      cancelTween(key);
      var tw = vizCtx.tween && vizCtx.tween[key];
      if (tw && vizCtx.motion) {
        v.appendChild(magSpan(Math.round(tw.from)));
        tweenValue(v, tw.from, tw.to, key);
      } else {
        v.appendChild(magSpan(rawVal));
      }
      if (vizCtx.today) { renderedNum[key] = num0(rawVal); }
      card.appendChild(v);
      if (selectedWindow === 'today') { card.appendChild(sparkline(sparkBuf[key])); }
      var l = document.createElement('div');
      l.className = 'stat-label';
      l.textContent = label;
      card.appendChild(l);
      return card;
    }

    // A hero stat card whose value is a ring gauge (CACHE HIT): the numeral is
    // centered in the ring, no sparkline (a ratio gauge, not a rate series).
    function statCardRing(label, pctNum, centerText) {
      var card = document.createElement('div');
      card.className = 'stat';
      var v = document.createElement('div');
      v.className = 'stat-value';
      v.appendChild(ringGauge(pctNum, centerText, false));
      card.appendChild(v);
      var l = document.createElement('div');
      l.className = 'stat-label';
      l.textContent = label;
      card.appendChild(l);
      return card;
    }

    // ---- four panel-specific builders ------------------------------------

    function buildUsage(d) {
      // Cancel every hero-key tween up front: a card that does not render this
      // round (e.g. Reasoning when its total is 0) is never rebuilt, so its
      // in-flight rAF would otherwise keep writing into a detached node.
      HERO_KEYS.forEach(cancelTween);
      var c = document.createElement('div');
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'window: ' + d.window + '   ' + fmtTs(d.from_ms) + ' -> ' + fmtTs(d.to_ms);
      c.appendChild(meta);

      var to = d.totals || {};
      // Immutable copy sorted by REQ descending; the busiest group leads.
      var groups = (d.groups || []).slice().sort(function (a, b) {
        return num0(b.requests) - num0(a.requests);
      });
      var cacheWrite = totalsCacheWrite(groups);
      var reasoning = num0(to.reasoning_tokens);

      // Cumulative cache-hit ratio for the ring gauge: sum numerator and
      // denominator across groups (the totals object lacks the cache_write
      // fields), then the shared hitPct ratio rule renders the centered text.
      var hitNum = 0, hitDen = 0;
      groups.forEach(function (g) { hitNum += num0(g.cache_read_billed); hitDen += groupDen(g); });
      var hitStr = hitPct(hitNum, hitDen);
      var hitPctNum = hitDen > 0 ? (hitNum / hitDen * 100) : 0;

      // Hero stat cards. The token-flow figures (Input / Output / Cache read /
      // Cache write) are clustered visually. Input is RAW input, kept SEPARATE
      // from the cache-write buckets rather than bundled. The six
      // flow/count metrics carry a delta sparkline + count-up tween; Cache hit
      // is a ratio ring; Errors keeps its jump affordance and is excluded from
      // the trend series.
      var stats = document.createElement('div');
      stats.className = 'stats';
      stats.appendChild(heroCard('requests', 'Requests', num0(to.requests), false));
      stats.appendChild(heroCard('input', 'Input (raw)', num0(to.input_tokens), true));
      stats.appendChild(heroCard('output', 'Output', num0(to.output_tokens), true));
      stats.appendChild(heroCard('cache_read', 'Cache read', num0(to.cache_read_billed), true));
      stats.appendChild(heroCard('cache_write', 'Cache write', cacheWrite, true));
      stats.appendChild(statCardRing('Cache hit', hitPctNum, hitStr));
      if (reasoning > 0) {
        stats.appendChild(heroCard('reasoning', 'Reasoning', reasoning, false));
      }
      // The Errors tile doubles as a jump-to-groups affordance (wired below,
      // only when there are groups to scroll to).
      var errorsCard = statCard('Errors', humanCount(to.errors), { neg: num0(to.errors) > 0 });
      stats.appendChild(errorsCard);
      c.appendChild(stats);

      subhead(c, 'Groups');
      var groupsTable = null;
      if (!groups.length) {
        c.appendChild(none());
      } else {
        // Alias is the row identifier (the panel groups per alias/provider/
        // model/upstream, so aliases are the disambiguating key); model is a
        // normal column. Secondary counters live in the expandable
        // detail.
        var gt = mkTable('Usage by alias group', [
          R('alias'), C('model'), C('provider'), N('req'), N('ok'), N('err'),
          N('input'), N('output'), N('cache read'), N('hit%')
        ], true);
        // Per-column maxima for the proportion bars (REQ / INPUT / CACHE READ),
        // computed per table build.
        var maxReq = 0, maxInput = 0, maxCacheRead = 0;
        groups.forEach(function (g) {
          maxReq = Math.max(maxReq, num0(g.requests));
          maxInput = Math.max(maxInput, num0(g.input_tokens));
          maxCacheRead = Math.max(maxCacheRead, num0(g.cache_read_billed));
        });
        // Change-flash baseline: only today-window poll commits update it, so a
        // window switch (different data) never flashes. Rebuilt each commit so
        // the store stays bounded to the current groups.
        var flashOn = vizCtx.today && vizCtx.motion && !vizCtx.gap;
        var nextFlash = {};
        groups.forEach(function (g) {
          var rowKey = g.alias + '|' + (g.provider || '') + '|' + (g.model || '');
          // A zero-traffic group dims but stays in the sorted table.
          var rowClass = num0(g.requests) === 0 ? 'row--muted' : null;
          var detail = [
            ['upstream', g.upstream],
            ['ok', humanCount(g.ok)],
            ['errors', humanCount(g.errors)]
          ];
          // The by-class breakdown sits directly under the errors entry and
          // sums to it (incl. the unclassified bucket).
          detail = detail.concat(errorClassPairs(g.errors_by_class));
          detail = detail.concat([
            ['reasoning tokens', humanCount(g.reasoning_tokens)],
            ['cache read (billed)', humanCount(g.cache_read_billed)],
            ['cache read peak', humanCount(g.cache_read_peak)],
            ['cache write 5m', humanCount(g.cache_write_5m)],
            ['cache write 1h', humanCount(g.cache_write_1h)],
            ['server tool calls', humanCount(g.server_tool_calls)],
            ['stream count', humanCount(g.stream_count)],
            ['client disconnects', humanCount(g.client_disconnect_total)],
            ['hit% denominator', humanCount(groupDen(g))]
          ]);
          // Flash a numeric cell whose display string moved since the last
          // commit; update the baseline regardless so it never goes stale.
          function flashCell(node, col, str) {
            var fk = rowKey + '|' + col;
            if (vizCtx.today) {
              if (flashOn && prevGroupCell[fk] !== undefined && prevGroupCell[fk] !== str) {
                node.classList.add('cell-flash');
              }
              nextFlash[fk] = str;
            }
            return node;
          }
          xrow(gt, rowKey, [
            g.alias, g.model, g.provider,
            flashCell(barCell(magSpan(g.requests), num0(g.requests), maxReq), 'req', humanCount(g.requests)),
            flashCell(magSpan(g.ok), 'ok', humanCount(g.ok)),
            flashCell(negCell(g.errors), 'err', humanCount(g.errors)),
            flashCell(barCell(magSpan(g.input_tokens), num0(g.input_tokens), maxInput), 'input', humanCount(g.input_tokens)),
            flashCell(magSpan(g.output_tokens), 'output', humanCount(g.output_tokens)),
            flashCell(barCell(magSpan(g.cache_read_billed), num0(g.cache_read_billed), maxCacheRead), 'cread', humanCount(g.cache_read_billed)),
            hitCell(num0(g.cache_read_billed), groupDen(g))
          ], detail, rowClass);
        });
        if (vizCtx.today) { prevGroupCell = nextFlash; }
        c.appendChild(gt.t);
        groupsTable = gt.t;
        // Totals reconciliation: REQ = OK + ERR + DISC (disconnects are
        // usually zero; a footnote rather than a new column).
        c.appendChild(reconcileFootnote(to));
      }

      // Errors tile jumps to the groups table (where errors are actionable).
      if (groupsTable) {
        errorsCard.classList.add('stat--link');
        errorsCard.setAttribute('role', 'button');
        errorsCard.setAttribute('tabindex', '0');
        errorsCard.title = 'jump to groups';
        errorsCard.addEventListener('click', function () {
          groupsTable.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        errorsCard.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            groupsTable.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      }

      if (d.quota && d.quota.length) {
        subhead(c, 'Quota');
        // One row per credential seat. The quota_* fields are vendor-shared, so
        // `provider` (provider_kind) is the discriminator for reading them --
        // utilization is a fraction of a PER-PROVIDER window, and a vendor that
        // reports no status / overage state renders those cells as "-".
        var qt = mkTable('Latest quota snapshot per seat', [
          R('seat'), C('provider'), C('snapshot'), C('claim'), C('status'),
          C('overage'), N('utilization'), N('overage util'), C('reset')
        ]);
        d.quota.forEach(function (q) {
          var utilNum = (q.utilization === null || q.utilization === undefined)
            ? NaN : Number(q.utilization) * 100;
          trow(qt, [
            q.seat, q.provider_kind, fmtTs(q.ts_start_ms),
            labelCell('claim', q.claim),
            tokLabeled('qstatus', 'qstatus', q.status),
            tokLabeled('qstatus', 'qstatus', q.overage_status),
            ringGauge(utilNum, pctFrac(q.utilization), true),
            pctFrac(q.overage_utilization), quotaResetCell(q.reset_ms)
          ]);
        });
        c.appendChild(qt.t);
      }

      subhead(c, 'Would-trim');
      c.appendChild(wouldTrimTable(d.would_trim || {}, d.window));

      return c;
    }

    // Totals reconciliation footnote: REQ = OK + ERR + DISC.
    function reconcileFootnote(to) {
      var d = document.createElement('div');
      d.className = 'footnote';
      d.textContent = 'REQ ' + humanCount(to.requests) + ' = OK ' + humanCount(to.ok) +
        ' + ERR ' + humanCount(to.errors) + ' + DISC ' + humanCount(to.client_disconnect_total);
      return d;
    }

    // Shared would-trim table (usage panel + doctor panel). `windowLabel`
    // states which window the figures cover ("today" on usage, "all time" on
    // doctor). The verdict headers carry tooltips (raw header stays visible).
    function wouldTrimTable(wt, windowLabel) {
      var wrap = document.createElement('div');
      if (windowLabel) {
        var cap = document.createElement('div');
        cap.className = 'meta';
        cap.textContent = 'window: ' + windowLabel;
        wrap.appendChild(cap);
      }
      var wtt = mkTable('Would-trim opportunity', [
        N('candidates'), N('trim tokens'),
        withTitle(N('met'), 'MET - candidates whose trim savings cleared the floor'),
        withTitle(N('unmet'), 'UNMET - candidates below the trim floor'),
        withTitle(N('cold'), 'COLD - no calibrated estimate yet'),
        withTitle(N('unpriced'), 'UNPRICED - no pricing data for the model')
      ]);
      trow(wtt, [
        humanCount(wt.candidate_requests), humanCount(wt.would_trim_tokens),
        humanCount(wt.verdict_met), humanCount(wt.verdict_unmet),
        humanCount(wt.verdict_cold), humanCount(wt.verdict_unpriced)
      ]);
      wrap.appendChild(wtt.t);
      return wrap;
    }

    function buildHealth(d) {
      var c = document.createElement('div');
      subhead(c, 'Targets');
      var targets = d.targets || [];
      if (!targets.length) {
        c.appendChild(none());
      } else {
        // Primary columns kept lean; upstream / seat / probe move to the
        // expandable detail so the table needs no inner x-scroll.
        var t = mkTable('Health targets', [
          R('state key'), C('nickname'), C('provider'), C('circuit'), N('rpm avail')
        ], true);
        targets.forEach(function (x) {
          var rowKey = x.state_key + '|' + (x.provider_name || '');
          xrow(t, rowKey, [
            x.state_key, x.nickname, x.provider_name,
            tokLabeled('circuit', 'circuit', x.circuit), humanCount(x.rpm_available)
          ], [
            ['open for', ageSince(x.open_since_ms)],
            ['last outcome', labelCell('outcome', x.last_outcome)],
            ['last outcome at', fmtTsPos(x.last_outcome_at_ms)],
            ['upstream', x.upstream],
            ['seat', x.seat_label],
            ['probe in flight', String(x.half_open_probe_in_flight)]
          ]);
        });
        c.appendChild(t.t);
      }

      subhead(c, 'Learned negatives');
      var ln = d.learned_negatives || [];
      if (!ln.length) {
        c.appendChild(none());
      } else {
        var lt = mkTable('Learned negatives', [
          R('state key'), C('capability'), C('signal tier'), N('observations')
        ]);
        ln.forEach(function (x) {
          trow(lt, [x.state_key, x.capability_key, tokLabeled('tier', 'tier', x.signal_tier),
            humanCount(x.observations)]);
        });
        c.appendChild(lt.t);
      }

      subhead(c, 'Capability matrix');
      if (!ln.length) {
        c.appendChild(none());
      } else {
        // Pivot the learned negatives into a lane x capability grid: rows are
        // the sorted distinct lanes (state keys) present, columns the sorted
        // distinct capabilities. Each populated cell is the verdict pill plus
        // the relative age of the last observation; an empty (lane, capability)
        // pairing renders "-".
        var lanes = [];
        var caps = [];
        var byLane = {};
        ln.forEach(function (x) {
          var lane = x.state_key || '';
          var cap = x.capability_key || '';
          if (lanes.indexOf(lane) === -1) { lanes.push(lane); }
          if (caps.indexOf(cap) === -1) { caps.push(cap); }
          if (!byLane[lane]) { byLane[lane] = {}; }
          byLane[lane][cap] = x;
        });
        lanes.sort();
        caps.sort();
        var cols = [R('lane')];
        caps.forEach(function (cap) { cols.push(C(cap)); });
        var mt = mkTable('Capability matrix', cols);
        lanes.forEach(function (lane) {
          var row = byLane[lane] || {};
          var cells = [lane];
          caps.forEach(function (cap) { cells.push(verdictAgeCell(row[cap])); });
          trow(mt, cells);
        });
        c.appendChild(mt.t);
      }
      return c;
    }

    // One capability-matrix cell: the learned verdict pill plus the relative
    // age of its last observation. An absent entry (no learned row for this
    // lane x capability) renders "-".
    function verdictAgeCell(entry) {
      if (!entry) { return '-'; }
      var span = document.createElement('span');
      span.appendChild(tokLabeled('learned', 'learned', entry.verdict));
      var age = ageSince(entry.last_seen_ms);
      if (age !== '-') {
        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = ' ' + age;
        span.appendChild(meta);
      }
      return span;
    }

    function buildConfig(d) {
      var c = document.createElement('div');
      subhead(c, 'Models');
      var models = d.models || [];
      if (!models.length) {
        c.appendChild(none());
      } else {
        // upstream / verified / wm / rm move to the expandable detail.
        var mt = mkTable('Configured models', [
          R('nickname'), C('provider'), C('kind'), C('source'), N('max ctx')
        ], true);
        models.forEach(function (m) {
          var e = m.economics || {};
          var rowKey = m.nickname + '|' + (m.provider || '');
          xrow(mt, rowKey, [
            m.nickname, m.provider, m.provider_kind,
            tokLabeled('src', 'src', m.source), humanCount(e.max_context_tokens)
          ], [
            ['upstream', m.upstream],
            ['verified', m.verified_at],
            ['wm', humanCount(e.wm)],
            ['rm', humanCount(e.rm)]
          ]);
        });
        c.appendChild(mt.t);
      }

      subhead(c, 'Classes');
      var classes = d.classes || [];
      if (!classes.length) {
        c.appendChild(none());
      } else {
        var ct = mkTable('Request classes', [
          R('class'), N('retry cap'), C('fallback'), C('source')
        ]);
        classes.forEach(function (x) {
          trow(ct, [x.class, humanCount(x.retry_cap), String(x.fallback), x.source]);
        });
        c.appendChild(ct.t);
      }

      subhead(c, 'Capabilities');
      var caps = d.capabilities || [];
      if (!caps.length) {
        c.appendChild(none());
      } else {
        var pt = mkTable('Capability verdicts', [
          R('target'), C('capability'), C('verdict'), C('provenance')
        ]);
        caps.forEach(function (x) {
          trow(pt, [x.target_spec, x.capability_key, tokLabeled('verdict', 'verdict', x.verdict),
            tokLabeled('prov', 'prov', x.provenance)]);
        });
        c.appendChild(pt.t);
      }

      subhead(c, 'Activation');
      var act = d.activation || [];
      if (!act.length) {
        c.appendChild(none());
      } else {
        var at = mkTable('Provider activation', [
          R('provider'), C('kind'), C('status'), W('reason'), C('referenced')
        ]);
        act.forEach(function (x) {
          trow(at, [x.provider_id, x.provider_kind, x.status,
            labelCell('activation', x.reason), String(x.referenced_by_aliases)]);
        });
        c.appendChild(at.t);
      }
      return c;
    }

    // Sort rank so Fail then Warn sort above Pass; unknown statuses last.
    function findingRank(status) {
      if (status === 'Fail') { return 0; }
      if (status === 'Warn') { return 1; }
      if (status === 'Pass') { return 2; }
      return 3;
    }

    function buildDoctor(d) {
      var c = document.createElement('div');
      var report = d.report || {};

      subhead(c, 'Findings');
      // Immutable copy: Fail/Warn sorted above Pass.
      var findings = (report.findings || []).slice().sort(function (a, b) {
        return findingRank(a.status) - findingRank(b.status);
      });
      if (!findings.length) {
        c.appendChild(none());
      } else {
        var counts = { Pass: 0, Warn: 0, Fail: 0 };
        findings.forEach(function (f) {
          if (counts[f.status] !== undefined) { counts[f.status] += 1; }
        });
        var strip = document.createElement('div');
        strip.className = 'doctor-summary';
        strip.textContent = counts.Pass + ' pass / ' + counts.Warn + ' warn / ' + counts.Fail + ' fail';
        c.appendChild(strip);

        var ft = mkTable('Doctor findings', [
          R('section'), C('name'), C('status'), W('detail'), W('remediation')
        ]);
        findings.forEach(function (f) {
          trow(ft, [f.section, f.name, tokLabeled('status', 'status', f.status),
            f.detail, f.remediation]);
        });
        c.appendChild(ft.t);
      }

      var wt = report.panels && report.panels.would_trim;
      if (wt) {
        subhead(c, 'Would-trim');
        c.appendChild(wouldTrimTable(wt, 'all time'));
      }

      subhead(c, 'Reachability');
      var reach = d.reachability || [];
      if (!reach.length) {
        c.appendChild(none());
      } else {
        var total = reach.length;
        var reachableCount = reach.filter(function (x) {
          return x.reachability === 'reachable';
        }).length;
        var summary = document.createElement('div');
        summary.className = 'meta';
        summary.textContent = reachableCount + ' / ' + total + ' reachable';
        c.appendChild(summary);

        // Exceptions (non-reachable) enumerated inline; they are the signal.
        var exceptions = reach.filter(function (x) { return x.reachability !== 'reachable'; });
        if (exceptions.length) {
          var et = mkTable('Reachability exceptions', [R('state key'), C('reachability')]);
          exceptions.forEach(function (x) {
            trow(et, [x.state_key, tokLabeled('reach', 'reach', x.reachability)]);
          });
          c.appendChild(et.t);
        }

        // Full list stays reachable behind a default-collapsed expander.
        var rt = mkTable('Target reachability', [R('state key'), C('reachability')]);
        reach.forEach(function (x) {
          trow(rt, [x.state_key, tokLabeled('reach', 'reach', x.reachability)]);
        });
        c.appendChild(buildExpander('Full reachability list (' + total + ')', rt.t));
      }
      return c;
    }

    var BUILDERS = {
      usage: buildUsage,
      health: buildHealth,
      config: buildConfig,
      doctor: buildDoctor
    };

    // ---- chrome: live countdown clock ------------------------------------

    function renderClock() {
      if (terminal) { el('clock').textContent = 'polling stopped'; return; }
      var txt = 'next update in ' + remainingSec + 's';
      if (backingOff) { txt += ' (backing off)'; }
      el('clock').textContent = txt;
    }

    // Start (or restart) the 1s countdown toward the next scheduled round so
    // the clock visibly decrements (5,4,3,2,1) instead of looking frozen.
    function startCountdown(sec) {
      remainingSec = sec;
      renderClock();
      clearInterval(countdownTimer);
      countdownTimer = setInterval(function () {
        remainingSec = Math.max(0, remainingSec - 1);
        renderClock();
      }, 1000);
    }

    // ---- chrome: favicon state machine -----------------------------------

    // Four author-static favicon SVGs, differing by fill COLOR only -- no data
    // is interpolated into the markup, so no wire/user value can reach the
    // icon (an XSS floor). The '#' of each hex color is percent-encoded (%23)
    // so it is not parsed as a URI fragment; explicit close tags avoid a
    // self-closing tag so no quote-then-slash literal exists here (the
    // page.rs mutation-channel scan treats such a literal as a fetch path).
    var FAVICON_OK = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%234caf50'></circle></svg>";
    var FAVICON_WARN = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23f0a020'></circle></svg>";
    var FAVICON_STALE = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%239aa5b5'></circle></svg>";
    var FAVICON_TERMINAL = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23d32f2f'></circle></svg>";
    var FAVICONS = {
      ok: FAVICON_OK,
      warn_error: FAVICON_WARN,
      stale_unknown: FAVICON_STALE,
      terminal: FAVICON_TERMINAL
    };

    // Stale-or-unknown: the loop is backing off, OR no round has ever
    // succeeded, OR the wall clock has passed the next round's due time by
    // more than a fetch budget plus slack. The wall-clock arm matters because
    // a hidden/background tab throttles the poll timer -- without it, a
    // long-hidden tab would keep a green icon while its data quietly aged, so
    // the visibility events re-check this on wake.
    function isStaleUnknown() {
      if (backingOff) { return true; }
      if (lastSuccess === null) { return true; }
      return Date.now() > nextDueAtMs + TIMEOUT_MS + FRESH_SLACK_MS;
    }

    // Warn-or-error, computed ONLY from the last fresh render of each panel
    // (never from transport-failure state): any panel a fresh round found
    // unavailable, or any content badge of kind warn/error. Recovers only when
    // a later fresh round overwrites the signal.
    function isWarnError() {
      for (var i = 0; i < PANELS.length; i++) {
        var n = PANELS[i];
        if (panelUnavail[n]) { return true; }
        if (panelBadgeKind[n] === 'warn' || panelBadgeKind[n] === 'error') { return true; }
      }
      return false;
    }

    // Precedence: terminal > stale_unknown > warn_error > ok.
    function faviconState() {
      if (terminal) { return 'terminal'; }
      if (isStaleUnknown()) { return 'stale_unknown'; }
      if (isWarnError()) { return 'warn_error'; }
      return 'ok';
    }

    function updateFavicon() {
      var link = el('favicon');
      if (!link) { return; }
      var next = FAVICONS[faviconState()];
      if (link.getAttribute('href') !== next) { link.setAttribute('href', next); }
    }

    // ---- chrome: manual refresh ------------------------------------------

    // The Refresh button is an edge trigger sharing the poll loop's single
    // gate: enabled only when the loop is live and idle (not terminal, not
    // mid-round, not backing off), so a click can neither queue a refresh nor
    // reset backoff. This mirrors "transport == live" in the decision.
    function syncRefreshBtn() {
      var btn = el('refresh');
      if (!btn) { return; }
      btn.disabled = terminal || running || backingOff;
    }

    function initRefresh() {
      var btn = el('refresh');
      if (btn) { btn.addEventListener('click', kickRefresh); }
      syncRefreshBtn();
    }

    // ---- chrome: hash routing (dumb view state) --------------------------

    // Grammar: `#panel[/window]`. `panel` is one of PANELS; the optional
    // `window` is one of WINDOWS. An unknown or absent panel canonicalizes to
    // `usage`, an unknown or absent window to `today`. The hash carries VIEW
    // STATE ONLY -- applyHash mutates activeTab / selectedWindow and nothing
    // about fetch state, and never cancels in-flight work. A future panel is
    // added by extending PANELS; the grammar itself does not change.
    // The separator is built from its char code so this script carries no
    // slash-leading string literal (see the mutation-channel scan in page.rs).
    var HASH_SEP = String.fromCharCode(47);

    function applyHash() {
      var h = location.hash;
      var raw = (h.charAt(0) === '#') ? h.slice(1) : h;
      var parts = raw.split(HASH_SEP);
      var panel = parts[0];
      var win = parts[1];
      activeTab = (PANELS.indexOf(panel) >= 0) ? panel : 'usage';
      selectedWindow = (WINDOWS.indexOf(win) >= 0) ? win : 'today';
    }

    // Write the canonical hash for the current view state, only when it
    // differs from the current one (loop-safe: replaceState never fires
    // hashchange, and the guard stops a location.hash-assignment fallback from
    // looping). The window segment is omitted for the `today` default.
    function writeHash() {
      var next = '#' + activeTab + (selectedWindow !== 'today' ? HASH_SEP + selectedWindow : '');
      if (location.hash === next) { return; }
      if (history.replaceState) {
        history.replaceState(null, '', next);
      } else {
        location.hash = next;
      }
    }

    // ---- chrome: window selector -----------------------------------------

    function updateSelectorUI() {
      var buttons = el('windowsel').querySelectorAll('button');
      Array.prototype.forEach.call(buttons, function (b) {
        var active = b.getAttribute('data-window') === selectedWindow;
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
        // The window applies to the Usage panel only, so the selector is
        // inert (and disabled) on every other tab, and after a terminal stop.
        b.disabled = terminal || activeTab !== 'usage';
      });
    }

    function initSelector() {
      var buttons = el('windowsel').querySelectorAll('button');
      Array.prototype.forEach.call(buttons, function (b) {
        b.addEventListener('click', function () { onWindowChange(b.getAttribute('data-window')); });
      });
      updateSelectorUI();
    }

    // ---- chrome: tabs (visibility only; every panel keeps polling) -------

    function selectTab(name) {
      activeTab = name;
      PANELS.forEach(function (n) {
        var tab = el('tab-' + n);
        var panel = el('panel-' + n);
        var sel = n === name;
        tab.setAttribute('aria-selected', sel ? 'true' : 'false');
        tab.tabIndex = sel ? 0 : -1;
        panel.hidden = !sel;
      });
      // The window selector is Usage-only, and the hash mirrors the active
      // tab; both follow every tab change.
      updateSelectorUI();
      writeHash();
    }

    function onTabKey(e, tabs, i) {
      var n = tabs.length;
      var next = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { next = (i + 1) % n; }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { next = (i - 1 + n) % n; }
      else if (e.key === 'Home') { next = 0; }
      else if (e.key === 'End') { next = n - 1; }
      if (next >= 0) {
        e.preventDefault();
        tabs[next].focus();
        selectTab(tabs[next].getAttribute('data-tab'));
      }
    }

    function initTabs() {
      var tabs = el('tabbar').querySelectorAll('[role="tab"]');
      Array.prototype.forEach.call(tabs, function (t, i) {
        t.addEventListener('click', function () { selectTab(t.getAttribute('data-tab')); });
        t.addEventListener('keydown', function (e) { onTabKey(e, tabs, i); });
      });
      selectTab(activeTab);
    }

    // ---- ambience: sliding tab indicator (droppable) ---------------------

    // The one JS entry point for the ambience banner. Creates the sliding
    // underline and keeps it under the selected tab by OBSERVING aria-selected
    // (set by selectTab) rather than hooking selectTab -- so the chrome layer
    // carries no reference back to this droppable layer. Deleting the ambience
    // CSS banner + this call fully removes the feature.
    function initAmbience() {
      var bar = el('tabbar');
      if (!bar) { return; }
      var underline = document.createElement('span');
      underline.className = 'tab-underline';
      underline.setAttribute('aria-hidden', 'true');
      bar.appendChild(underline);

      function position(animate) {
        var active = bar.querySelector('[role="tab"][aria-selected="true"]');
        if (!active) { underline.style.opacity = '0'; return; }
        var barRect = bar.getBoundingClientRect();
        var tabRect = active.getBoundingClientRect();
        var still = !animate || reducedMotion;
        if (still) { underline.style.transition = 'none'; }
        underline.style.opacity = '1';
        underline.style.transform =
          'translateX(' + (tabRect.left - barRect.left) + 'px) scaleX(' + tabRect.width + ')';
        if (still) {
          void underline.offsetWidth; // commit the jump, then restore transition
          underline.style.transition = '';
        }
      }

      position(false);
      if (window.MutationObserver) {
        new MutationObserver(function () { position(true); }).observe(bar, {
          subtree: true,
          attributes: true,
          attributeFilter: ['aria-selected']
        });
      }
      window.addEventListener('resize', function () { position(false); });
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Cache the reduced-motion preference ONCE: the JS-driven count-up tween
      // and change flash read this flag (CSS animations stay in the reduced-
      // motion block); no live listener, so the read never re-runs mid-session.
      reducedMotion = !!(window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      // Restore view state from the hash BEFORE the first tick so the initial
      // render lands on the requested tab/window.
      applyHash();
      initSelector();
      initTabs();
      initRefresh();
      initAmbience();
      updateFavicon();
      // Back/forward or a manual hash edit re-applies view state; the sync
      // path canonicalizes any bogus hash. This never touches fetch state.
      window.addEventListener('hashchange', function () {
        applyHash();
        selectTab(activeTab);
        updateSelectorUI();
      });
      // A hidden tab throttles the poll timer, so re-evaluate staleness (and
      // the icon) whenever the tab regains attention. A hidden tab also cancels
      // any in-flight count-up (no replay on resume -- the next poll commit
      // renders the settled value directly).
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { cancelAllTweens(); }
        updateFavicon();
      });
      window.addEventListener('focus', updateFavicon);
      window.addEventListener('pageshow', updateFavicon);
      tick();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<!--
  routectl status dashboard: the MARKUP source of a single self-contained,
  read-only document. page.rs inlines the `dash_*.css` style sources and the
  `dash_*.js` script sources into the two asset slots below at COMPILE time,
  so the served artifact is one offline HTML file with zero external network
  dependencies. This file is never served on its own; do not add a <link>
  or <script src> here.

  Co-versioning contract: this page ships in the SAME binary as the
  /status endpoints it polls, so the wire shapes it is built against
  cannot skew from what the server emits -- there is no client/server
  version negotiation, and the per-source schema_version check in
  dash_40_render.js is recovery containment for a cached page or a bad build,
  not negotiation. If this document is ever served SEPARATELY from those
  endpoints (a CDN, a split asset bundle), the co-versioning guarantee
  breaks and real version negotiation must be added before that split
  ships.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>routectl status</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%239aa5b5'></circle></svg>">
@@DASHBOARD_STYLE@@
</head>
<body>
  <!--
    The persistent verdict strip: a state dot, ONE plain-language sentence,
    when it is not current the time it was last current and why, a link to
    the view that shows its cause, the window's req/span figures, the window
    picker, and the poll indicator. It carries no cost figure by design -- cost is a
    Now/Traffic reading, and repeating it here would show the same fact
    twice.
  -->
  <div class="verdict" id="verdict">
    <div class="verdict-lead">
      <span class="verdict-dot" id="verdict-dot" aria-hidden="true"></span>
      <span class="verdict-text" id="verdict-text" role="status" aria-live="polite"></span>
      <span class="verdict-note" id="verdict-note" aria-live="polite" hidden></span>
      <span class="verdict-link" id="verdict-link"></span>
      <span class="verdict-stats" id="verdict-stats"></span>
    </div>
    <div class="verdict-side">
      <div class="windowsel" id="windowsel" role="group" aria-label="Aggregation window"
        aria-describedby="window-covers" data-windowless="false">
        <button type="button" data-window="today" aria-pressed="true">Today</button>
        <button type="button" data-window="last24h" aria-pressed="false">24h</button>
        <button type="button" data-window="week" aria-pressed="false">Week</button>
        <button type="button" data-window="last7d" aria-pressed="false">7d</button>
        <button type="button" data-window="month" aria-pressed="false">Month</button>
        <button type="button" data-window="all" aria-pressed="false">All</button>
      </div>
      <span class="card-hint" id="window-covers"></span>
      <button type="button" class="refresh" id="refresh" title="Refresh now">Refresh</button>
      <div class="poll" id="poll" aria-hidden="true">
        <span class="poll-dot"></span>
        <span class="poll-label" id="poll-label"></span>
      </div>
    </div>
  </div>

  <div class="tabbar" id="tabbar" role="tablist" aria-label="Status views">
    <button type="button" class="tab" id="tab-now" role="tab" data-tab="now"
      aria-controls="pane-now" aria-selected="true" tabindex="0">
      Now<span class="tab-badge" id="badge-now" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-accounts" role="tab" data-tab="accounts"
      aria-controls="pane-accounts" aria-selected="false" tabindex="-1">
      Accounts<span class="tab-badge" id="badge-accounts" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-traffic" role="tab" data-tab="traffic"
      aria-controls="pane-traffic" aria-selected="false" tabindex="-1">
      Traffic<span class="tab-badge" id="badge-traffic" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-models" role="tab" data-tab="models"
      aria-controls="pane-models" aria-selected="false" tabindex="-1">
      Models<span class="tab-badge" id="badge-models" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-config" role="tab" data-tab="config"
      aria-controls="pane-config" aria-selected="false" tabindex="-1">
      Config<span class="tab-badge" id="badge-config" hidden></span>
    </button>
    <button type="button" class="tab" id="tab-doctor" role="tab" data-tab="doctor"
      aria-controls="pane-doctor" aria-selected="false" tabindex="-1">
      Doctor<span class="tab-badge" id="badge-doctor" hidden></span>
    </button>
  </div>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <!--
    One pane per view, each a shell of a freshness line plus a body the
    view's `build` fills. The pane markup is IDENTICAL across views on
    purpose: a view's whole rendering is composed in dash_80_views.js from
    the dash_6x/dash_7x section sources.
  -->
  <main>
    <section class="pane" id="pane-now" role="tabpanel" aria-labelledby="tab-now" tabindex="0">
      <div class="section-status" id="status-now"></div>
      <div id="body-now"></div>
    </section>
    <section class="pane" id="pane-accounts" role="tabpanel" aria-labelledby="tab-accounts" tabindex="0" hidden>
      <div class="section-status" id="status-accounts"></div>
      <div id="body-accounts"></div>
    </section>
    <section class="pane" id="pane-traffic" role="tabpanel" aria-labelledby="tab-traffic" tabindex="0" hidden>
      <div class="section-status" id="status-traffic"></div>
      <div id="body-traffic"></div>
    </section>
    <section class="pane" id="pane-models" role="tabpanel" aria-labelledby="tab-models" tabindex="0" hidden>
      <div class="section-status" id="status-models"></div>
      <div id="body-models"></div>
    </section>
    <section class="pane" id="pane-config" role="tabpanel" aria-labelledby="tab-config" tabindex="0" hidden>
      <div class="section-status" id="status-config"></div>
      <div id="body-config"></div>
    </section>
    <section class="pane" id="pane-doctor" role="tabpanel" aria-labelledby="tab-doctor" tabindex="0" hidden>
      <div class="section-status" id="status-doctor"></div>
      <div id="body-doctor"></div>
    </section>
  </main>

  <!--
    Host for the one overlay this page has (the Now seat modal). It sits
    OUTSIDE <main> because every pane carries an entry animation, and an
    animated ancestor establishes a containing block for `position: fixed` --
    a modal rendered inside a pane would be centered on the pane, not the
    viewport.
  -->
  <div id="modal-host"></div>
@@DASHBOARD_SCRIPT@@
</body>
</html>

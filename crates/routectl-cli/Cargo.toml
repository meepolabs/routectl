[package]
name = "routectl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "routectl CLI binary."

[[bin]]
name = "routectl"
path = "src/main.rs"

[dependencies]
routectl-core.workspace = true
routectl-providers = { workspace = true, features = ["openai-compat", "anthropic-api"] }
routectl-router.workspace = true
routectl-auth.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
bytes.workspace = true
tokio-stream.workspace = true
futures.workspace = true
chrono.workspace = true
anyhow = "1"
dirs = "5"

[features]
# Enable live integration tests that hit real providers using API keys
# from the environment (OPENROUTER_API_KEY, OPENCODE_GO_API_KEY, NIM_API_KEY,
# ANTHROPIC_API_KEY). Tests skip cleanly when their key is absent.
#   cargo test -p routectl-cli --features live-integration --release \
#     --test live_matrix -- --nocapture --test-threads=1
live-integration = []

[dev-dependencies]
wiremock.workspace = true
reqwest = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

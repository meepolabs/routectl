[package]
name = "routectl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "routectl CLI binary."

[[bin]]
name = "routectl"
path = "src/main.rs"

[dependencies]
routectl-core.workspace = true
routectl-providers = { workspace = true, default-features = false, features = ["openai-compat", "anthropic-api", "bedrock", "openai-responses"] }
routectl-router.workspace = true
routectl-auth.workspace = true
routectl-usage = { path = "../routectl-usage" }
async-trait.workspace = true
# `io-util` adds `AsyncReadExt`/`AsyncWriteExt` and `copy_bidirectional`,
# needed by the MITM front-proxy's CONNECT listener (proxy::listener) to
# parse the CONNECT request line and blind-tunnel non-MITM-host traffic.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "sync", "io-util"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
bytes.workspace = true
tokio-stream.workspace = true
futures.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
dirs = "6"
subtle = "2"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
arc-swap = { workspace = true }
# MITM front-proxy: reqwest talks to the upstream (promoted from
# dev-only), the rest terminate/generate the local TLS listener.
reqwest.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http-body.workspace = true

# O_NOFOLLOW for the MITM CA/leaf secret-file creation path
# (proxy::ca) -- belt-and-suspenders on top of the std `create_new`
# O_EXCL semantics (which already refuse to follow a pre-existing
# symlink per POSIX) when staging secret material on disk. libc's
# platform-correct constant is preferred over hardcoding the raw flag
# value, which differs between Linux and macOS. Already resolved
# transitively across the dependency graph; promoted to a direct dep
# here since routectl's own code now names it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enable live integration tests that hit real providers using API keys
# from the environment (OPENROUTER_API_KEY, NIM_API_KEY, ANTHROPIC_API_KEY,
# AWS_BEARER_TOKEN_BEDROCK, etc.). Tests skip cleanly when their key is
# absent. Run with:
#   cargo test -p routectl-cli --features live-integration --release \
#     --test live_matrix -- --nocapture --test-threads=1
live-integration = []

[dev-dependencies]
# Enable the shared contract-test fixture builders (test_utils) from core.
# A dev-dependency with extra features unifies the `test-utils` feature in
# only for test/bench builds, never for the release binary.
routectl-core = { workspace = true, features = ["test-utils"] }
wiremock.workspace = true
futures = { workspace = true }
# `io-util` adds `AsyncReadExt`/`AsyncWriteExt` (`read_exact`/`write_all`),
# needed by the MITM proxy's TLS-handshake tests (`proxy::ca`).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util", "io-util"] }
insta.workspace = true
tempfile = "3"
serial_test = "3"
# Used by the `routectl usage` command tests to seed rows directly into a
# temp usage DB via raw SQL. Test-only; the release binary never links it.
rusqlite = { version = "0.37", features = ["bundled"] }
# Used by the `oauth://codex` live-matrix test to decode the
# `chatgpt_account_id` claim out of a real ChatGPT bearer JWT.
base64 = "0.22"
# Used by the file-watch / SIGHUP integration tests
# (`tests/hot_reload.rs`) to deliver SIGHUP into the running test
# process. Confined to `cfg(unix)` test paths.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal"] }

# cargo-deb metadata. Preserved so a future PR can re-enable .deb
# packaging in .github/workflows/release.yml without re-deriving these
# fields. The release pipeline currently ships bare binaries only;
# `cargo deb -p routectl-cli` still works locally.
[package.metadata.deb]
name = "routectl"
maintainer = "Meepo Labs <noreply@meepolabs.com>"
copyright = "2026, Meepo Labs"
license-file = ["../../LICENSE", "0"]
extended-description = """\
routectl is a translation pipe between OpenAI Chat Completions / \
Anthropic Messages clients and N upstream model providers. It speaks \
both ingress dialects on /v1/chat/completions and /v1/messages, fans \
out to OpenAI-compatible APIs, the Anthropic Messages API, and AWS \
Bedrock (InvokeModel + Converse), and supports alias chains, \
fallbacks, retry policy, listener auth, and per-provider runtime \
gates."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/routectl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/routectl/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/routectl/CHANGELOG.md", "644"],
    ["../../examples/config.toml", "usr/share/doc/routectl/examples/config.toml", "644"],
]

[lints]
workspace = true

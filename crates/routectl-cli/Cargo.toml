[package]
name = "routectl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "routectl CLI binary."

[[bin]]
name = "routectl"
path = "src/main.rs"

[dependencies]
routectl-core.workspace = true
routectl-providers = { workspace = true, default-features = false, features = ["openai-compat", "anthropic-api", "bedrock", "openai-responses"] }
routectl-router.workspace = true
routectl-auth.workspace = true
routectl-usage = { path = "../routectl-usage" }
async-trait.workspace = true
# `io-util` adds `AsyncReadExt`/`AsyncWriteExt` and `copy_bidirectional`,
# needed by the MITM front-proxy's CONNECT listener (proxy::listener) to
# parse the CONNECT request line and blind-tunnel non-MITM-host traffic.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "sync", "io-util"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
# `limit` + `load-shed` back the status-subtree-only middleware: a bounded
# global concurrency cap on `/status*` that sheds excess as an immediate 503
# rather than queueing (the ingress `/v1/*` lane carries none of this).
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http.workspace = true
http.workspace = true
bytes.workspace = true
tokio-stream.workspace = true
futures.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
dirs = "6"
subtle = "2"
# Hidden interactive API-key prompt for `provider add` (reads from the TTY
# without echoing). The one new dependency the secret-source breadth needs;
# stdin/env/file capture use std + routectl-auth's ManagedSecretStore.
rpassword = "7"
# `config migrate --dry-run` on a legacy (v1) file renders the candidate by
# running the IO-performing v1->v2 rung against a throwaway copy, so a dry-run
# provably cannot touch the real config or overlay. Already a runtime dep of
# routectl-router (config_write), promoted here for the same discipline.
tempfile = "3"
# Per-process MITM seam nonce generation (proxy::split stamper +
# ingress::MitmSeamNonce): OS CSPRNG bytes, base64url-encoded.
rand.workspace = true
base64 = "0.22"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
arc-swap = { workspace = true }
# Non-poisoning mutex for the `/status` panel-availability counters
# (handlers::status::PanelCounters): a poisoned std mutex would silently
# drop the last-available stamp. Already a dependency of routectl-router.
parking_lot = "0.12"
# The `/status/usage` panel classifies a SQLite busy/lock into the distinct
# `db_busy` shed code (vs `db_unavailable`) by reading the underlying
# `rusqlite` error code. Already in the graph via routectl-usage; a direct
# dep lets the status module own its shed-code vocabulary.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
# MITM front-proxy: reqwest talks to the upstream (promoted from
# dev-only), the rest terminate/generate the local TLS listener.
reqwest.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http-body.workspace = true

# Heap-allocation profiler for the perf benches ONLY, and ONLY when the
# `dhat` feature is enabled. It is never a default feature, so the shipped
# binary (built with default features) never links it. Cargo forbids an
# optional dev-dependency, so it is declared here as an optional regular
# dependency instead; nothing in the library or binary references it. The
# cfg gate in benches/hotpath.rs is the single removal point when a
# successor profiler replaces dhat.
dhat = { version = "0.3", optional = true }

# O_NOFOLLOW for the MITM CA/leaf secret-file creation path
# (proxy::ca) -- belt-and-suspenders on top of the std `create_new`
# O_EXCL semantics (which already refuse to follow a pre-existing
# symlink per POSIX) when staging secret material on disk. libc's
# platform-correct constant is preferred over hardcoding the raw flag
# value, which differs between Linux and macOS. Already resolved
# transitively across the dependency graph; promoted to a direct dep
# here since routectl's own code now names it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Default-on forward of routectl-router's `gemini` feature, so the shipped
# binary can add and route Gemini providers. `provider add` cfg-gates its
# Gemini support behind this feature, mirroring the router's own cfg gate on
# the `Gemini` variant -- a build with the feature off compiles cleanly and
# simply does not offer the kind.
default = ["gemini"]
gemini = ["routectl-router/gemini"]
# Enable live integration tests that hit real providers using API keys
# from the environment (OPENROUTER_API_KEY, NIM_API_KEY, ANTHROPIC_API_KEY,
# AWS_BEARER_TOKEN_BEDROCK, etc.). Tests skip cleanly when their key is
# absent. Run with:
#   cargo test -p routectl-cli --features live-integration --release \
#     --test live_matrix -- --nocapture --test-threads=1
live-integration = []
# Bench-only: swaps the perf bench global allocator to dhat's heap
# profiler (see benches/hotpath.rs). Never a default feature; enabled via
# `--features routectl-cli/dhat` by scripts/bench.sh --profile heap.
dhat = ["dep:dhat"]

[dev-dependencies]
# Enable the shared contract-test fixture builders (test_utils) from core.
# A dev-dependency with extra features unifies the `test-utils` feature in
# only for test/bench builds, never for the release binary.
routectl-core = { workspace = true, features = ["test-utils"] }
wiremock.workspace = true
futures = { workspace = true }
# `io-util` adds `AsyncReadExt`/`AsyncWriteExt` (`read_exact`/`write_all`),
# needed by the MITM proxy's TLS-handshake tests (`proxy::ca`).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util", "io-util"] }
insta.workspace = true
serial_test = "3"
routectl-testkit.workspace = true
criterion = { workspace = true }
# The config-migrate tests race config.toml through the SAME advisory
# write lock the config writer holds (config_write::edit_config_toml), so
# a test can gate run_at's config-phase re-read on an out-of-band write.
# Test-only; the release binary reaches the lock via routectl-router.
fd-lock = "4"
# Used by the file-watch / SIGHUP integration tests
# (`tests/hot_reload.rs`) to deliver SIGHUP into the running test
# process. Confined to `cfg(unix)` test paths.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal"] }

# Ingress hot-path micro-benches (parse, token estimate, response render).
# `harness = false`: the bench provides its own `main` so it can install the
# allocation-counting global allocator and expose the alloc-count mode.
[[bench]]
name = "hotpath"
harness = false

# cargo-deb metadata. Preserved so a future PR can re-enable .deb
# packaging in .github/workflows/release.yml without re-deriving these
# fields. The release pipeline currently ships bare binaries only;
# `cargo deb -p routectl-cli` still works locally.
[package.metadata.deb]
name = "routectl"
maintainer = "Meepo Labs <noreply@meepolabs.com>"
copyright = "2026, Meepo Labs"
license-file = ["../../LICENSE", "0"]
extended-description = """\
routectl is a translation pipe between OpenAI Chat Completions / \
Anthropic Messages clients and N upstream model providers. It speaks \
both ingress dialects on /v1/chat/completions and /v1/messages, fans \
out to OpenAI-compatible APIs, the Anthropic Messages API, and AWS \
Bedrock (InvokeModel + Converse), and supports alias chains, \
fallbacks, retry policy, listener auth, and per-provider runtime \
gates."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/routectl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/routectl/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/routectl/CHANGELOG.md", "644"],
    ["../../examples/config.toml", "usr/share/doc/routectl/examples/config.toml", "644"],
]

[lints]
workspace = true

[package]
name = "routectl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "routectl CLI binary."

[[bin]]
name = "routectl"
path = "src/main.rs"

[dependencies]
routectl-core.workspace = true
routectl-providers = { workspace = true, default-features = false, features = ["openai-compat", "anthropic-api", "bedrock"] }
routectl-router.workspace = true
routectl-auth.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
bytes.workspace = true
tokio-stream.workspace = true
futures.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
anyhow = "1"
dirs = "5"

[features]
# Enable live integration tests that hit real providers using API keys
# from the environment (OPENROUTER_API_KEY, NIM_API_KEY, ANTHROPIC_API_KEY,
# AWS_BEARER_TOKEN_BEDROCK, etc.). Tests skip cleanly when their key is
# absent. Run with:
#   cargo test -p routectl-cli --features live-integration --release \
#     --test live_matrix -- --nocapture --test-threads=1
live-integration = []

[dev-dependencies]
wiremock.workspace = true
reqwest = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

# cargo-deb metadata. Used by `.github/workflows/release.yml` to build
# .deb packages on tag pushes. Run locally with: `cargo deb -p routectl-cli`.
[package.metadata.deb]
name = "routectl"
maintainer = "Meepo Labs <noreply@meepolabs.com>"
copyright = "2026, Meepo Labs"
license-file = ["../../LICENSE", "0"]
extended-description = """\
routectl is a translation pipe between OpenAI Chat Completions / \
Anthropic Messages clients and N upstream model providers. It speaks \
both ingress dialects on /v1/chat/completions and /v1/messages, fans \
out to OpenAI-compatible APIs, the Anthropic Messages API, and AWS \
Bedrock (InvokeModel + Converse), and supports alias chains, \
fallbacks, retry policy, listener auth, and per-provider runtime \
gates."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/routectl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/routectl/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/routectl/CHANGELOG.md", "644"],
    ["../../examples/config.toml", "usr/share/doc/routectl/examples/config.toml", "644"],
]

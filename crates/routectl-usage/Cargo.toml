[package]
name = "routectl-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Usage-accounting persistence types for routectl."

[features]
# Exposes the cross-crate paid-probe test seams under
# `routectl_usage::paid_probe_test_support` plus the `_for_tests` counter
# mutators on `UsageCounters`. Enabled as a dev-dependency feature by
# routectl-cli so its integration tests can build fixtures this crate's own
# `cfg(test)` cannot reach, and NEVER compiled into a release build.
#
# The gate is a SECURITY boundary, not a tidiness one. One of those seams writes
# a raw paid-probe accounting value, which means it can lower a committed count --
# and a committed unit is never given back. Shipping it in a release library
# would put a cap-bypass path on the published surface of the crate that owns
# the spend ceiling.
"test-utils" = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Only the `sync` feature is needed at build time: the bounded mpsc
# channel between the async producer side and the dedicated blocking
# writer thread. No tokio runtime is started by this crate -- the
# consumer thread uses `blocking_recv` on its own OS thread, and the
# producer's `try_send` is runtime-agnostic.
tokio = { workspace = true, features = ["sync"] }
# `bundled` compiles SQLite from vendored source, so there is no
# system libsqlite dependency. This dep lives only in routectl-usage;
# the lean provider build does not pull it in. `hooks` is required for
# `Connection::progress_handler`, which enforces the read-query deadline
# from inside SQLite's VM loop (no watchdog thread).
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "hooks"] }

[dev-dependencies]
tempfile = "3"
# Tests drive `try_send` from an async context and need a runtime; the
# `macros` + `rt` features power `#[tokio::test]`.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true

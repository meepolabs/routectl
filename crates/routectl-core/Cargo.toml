[package]
name = "routectl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Core types and Provider trait for routectl. OpenRouter-shape schema."

[features]
# Exposes shared canonical-request / canonical-response builders under
# `routectl_core::test_utils` for the cross-crate contract tests. Enabled
# as a dev-dependency feature by the consumer crates (routectl-providers,
# routectl-cli) so the fixtures are available to integration tests but
# never compiled into a release build.
"test-utils" = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
routectl-testkit.workspace = true
# Real Rust parser for the refusal-reason census, which must follow the module
# tree and prune `cfg(test)` items the way the compiler does. DEV-only: the
# shipped library links nothing of it, and every package here is already in
# the lockfile, so this adds no new package.
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = "1"
tempfile = "3"

[lints]
workspace = true

[package]
name = "routectl-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared in-process tracing-capture test double for routectl's dev-dependency test suites."

[dependencies]
routectl-core.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `redirect_pin` drives two live mock servers, so wiremock is a regular
# (not dev-) dependency: this crate IS the dev-dependency of everything
# that consumes it, and its public API hands back `MockServer`s.
wiremock.workspace = true
uuid = { workspace = true, features = ["v4"] }

# `temp_reaper` probes whether a dir's owning pid is still live.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile = "3"

# The owner-only secret-dir test sets a permissive umask.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal", "fs"] }

[lints]
workspace = true

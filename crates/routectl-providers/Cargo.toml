[package]
name = "routectl-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Provider implementations for routectl."

[features]
default = ["openai-compat", "anthropic-api", "bedrock", "openai-responses", "gemini"]
"openai-compat" = ["dep:reqwest", "dep:eventsource-stream", "dep:chrono", "dep:uuid", "dep:bytes", "dep:async-stream", "dep:tokio", "dep:regex"]
"anthropic-api" = ["dep:reqwest", "dep:eventsource-stream", "dep:chrono", "dep:uuid", "dep:async-stream", "dep:tokio", "dep:lru", "dep:base64", "dep:xxhash-rust"]
"openai-responses" = ["dep:reqwest", "dep:eventsource-stream", "dep:chrono", "dep:async-stream", "dep:uuid", "dep:tokio", "dep:cookie_store", "dep:reqwest_cookie_store", "dep:tempfile"]
"gemini" = ["dep:reqwest", "dep:eventsource-stream", "dep:chrono", "dep:async-stream", "dep:uuid", "dep:tokio"]
# Exposes test-only helpers (e.g. AnthropicApiProvider::seed_thinking_for_test)
# that must not appear in production builds. Required when running integration
# tests that pre-populate the thinking cache.
"test-utils" = ["anthropic-api"]
# Native AWS Bedrock provider (SigV4 signing + eventstream streaming).
# Pulls in the AWS SDK credential / signing crates. ~1 MB binary growth.
# Implies `anthropic-api`: the working Invoke body shape today is the
# Anthropic Messages JSON shape, and bedrock/{invoke,eventstream}.rs
# reuse `crate::anthropic_api::{request, response, sse, types}` directly.
# To skip the AWS deps entirely when building this providers library:
#   cargo check -p routectl-providers --no-default-features \
#     --features openai-compat,anthropic-api
# (A --workspace build still pulls in AWS: routectl-cli always links
#  bedrock, and Cargo feature unification re-enables it graph-wide.)
"bedrock" = [
    "anthropic-api",
    "dep:reqwest",
    "dep:bytes",
    "dep:async-stream",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:aws-types",
    "dep:http",
    "dep:base64",
]

[dependencies]
routectl-core.workspace = true
async-trait.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Used by anthropic-api and openai-compat providers.
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-stream = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tokio-stream = { workspace = true, optional = true }
regex = { version = "1", optional = true }
lru = { workspace = true, optional = true }

# Persistent Cloudflare cookie jar for the openai-responses
# (chatgpt-oauth) path. `cookie_store` is the in-memory jar with
# JSON serde, `reqwest_cookie_store` adapts it to reqwest's
# `CookieStore` trait. Both pulled in only when the
# `openai-responses` feature is on.
cookie_store = { workspace = true, optional = true }
reqwest_cookie_store = { workspace = true, optional = true }

# Atomic, 0600 cookie-jar persistence for the openai-responses path.
# Provides the same-directory tempfile + atomic-rename primitive the
# OAuth credentials writer uses, so concurrent saves cannot promote a
# truncated jar over the live file. Pulled in only when the
# `openai-responses` feature is on.
tempfile = { version = "3", optional = true }

# AWS SDK / signing crates (used only by the `bedrock` feature). Pinned
# to specific minor versions so cargo update churn is bounded.
aws-config = { version = "1.8", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "credentials-process", "sso"] }
aws-credential-types = { version = "1.2", optional = true }
aws-sigv4 = { version = "1.2", optional = true, features = ["http1"] }
aws-smithy-eventstream = { version = "0.60", optional = true }
aws-smithy-runtime-api = { version = "1.7", optional = true, features = ["client"] }
aws-smithy-types = { version = "1.2", optional = true }
aws-types = { version = "1.3", optional = true }
http = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
xxhash-rust = { version = "0.8", optional = true, features = ["xxh64"] }

[dev-dependencies]
# Enable the shared contract-test fixture builders (test_utils) from core.
# A dev-dependency with extra features unifies the `test-utils` feature in
# only for test/bench builds, never for the release library.
routectl-core = { workspace = true, features = ["test-utils"] }
wiremock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
pretty_assertions = "1"
insta.workspace = true
tracing-test = "0.2"
routectl-testkit.workspace = true

[lints]
workspace = true

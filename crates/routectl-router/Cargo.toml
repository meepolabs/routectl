[package]
name = "routectl-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Fallback chains, retries, and alias resolution for routectl."

[features]
default = ["bedrock", "openai-responses", "gemini"]
# Forward the providers crate's `bedrock` feature so the router can
# build BedrockProvider instances when this is enabled.
bedrock = ["routectl-providers/bedrock"]
# Forward the providers crate's `openai-responses` feature so the router
# can build OpenAiResponsesProvider instances when this is enabled.
"openai-responses" = ["routectl-providers/openai-responses"]
# Forward the providers crate's `gemini` feature so the router can
# build GeminiProvider instances when this is enabled.
"gemini" = ["routectl-providers/gemini"]
# Compiles in the vendored catalog snapshots and the render pipeline that
# regenerates `catalog_baked.rs` from them (the `gen_catalog` bin and its
# drift-guard test). Off by default so the runtime binary does not carry
# the multi-megabyte snapshot text.
gen-catalog = []

[[bin]]
name = "gen_catalog"
required-features = ["gen-catalog"]

[dependencies]
routectl-core.workspace = true
routectl-providers = { workspace = true, default-features = false, features = ["openai-compat", "anthropic-api"] }
routectl-auth.workspace = true
async-trait.workspace = true
async-stream = "0.3"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
parking_lot = "0.12"
strsim = "0.11"
lru.workspace = true
url.workspace = true
tempfile = "3"
fd-lock = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serial_test = "3"
wiremock.workspace = true
routectl-testkit.workspace = true
criterion = { workspace = true }

# ChatRequest::clone() cost on the dispatch hot path. `harness = false`:
# the bench owns `main` to install the allocation-counting allocator.
[[bench]]
name = "dispatch_clone"
harness = false

[lints]
workspace = true

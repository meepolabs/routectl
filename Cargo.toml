[workspace]
resolver = "2"
members = [
    "crates/routectl-core",
    "crates/routectl-providers",
    "crates/routectl-router",
    "crates/routectl-auth",
    "crates/routectl-cli",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/meepolabs/routectl"
homepage = "https://github.com/meepolabs/routectl"
authors = ["Meepo Labs"]
# Internal crates of the routectl binary, not intended for crates.io
# publication (path-only `routectl-core.workspace = true` deps would
# need explicit version specifiers to be publishable). When publishing
# becomes a goal, flip this and add versions to the path deps.
publish = false

[workspace.dependencies]
# Local crates
routectl-core = { path = "crates/routectl-core" }
routectl-providers = { path = "crates/routectl-providers", default-features = false }
routectl-router = { path = "crates/routectl-router" }
routectl-auth = { path = "crates/routectl-auth" }

# Async + runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
async-trait = "0.1"
futures = "0.3"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
mime = "0.3"
bytes = "1"
url = "2"

# Streaming
eventsource-stream = "0.2"
tokio-stream = "0.1"

# ChatGPT-oauth Cloudflare cookie jar (openai-responses provider).
# `cookie_store` is the in-memory jar; `reqwest_cookie_store` adapts it
# to reqwest's `CookieStore` trait so it can plug into the per-provider
# `reqwest::Client` builder. JSON serialize/deserialize is the
# crate-recommended persistence format. Pinned to the
# reqwest-0.12-compatible majors -- reqwest_cookie_store >=0.9 jumped
# to reqwest 0.13, so 0.8.x is the right cut here. cookie_store 0.21
# is the matching version.
cookie_store = "0.21"
reqwest_cookie_store = "0.8"

# Time / ids (used in response shaping)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }

# Bounded LRU cache (used by anthropic-api context_management
# emulation). Pinned >=0.16 to avoid RUSTSEC-2026-0002 (Stacked
# Borrows soundness in IterMut on lru < 0.16.3).
lru = "0.18"

# Filesystem watch + atomic Router hot-swap. `notify` is the
# cross-platform fs-watch backend (inotify on Linux, FSEvents on
# macOS, ReadDirectoryChangesW on Windows). `notify-debouncer-full`
# coalesces a burst of events into one delivery. `arc-swap` is the
# lock-free Arc<T> hot-swap primitive used to publish a freshly-built
# Router to handlers without per-request locking.
notify = "8"
notify-debouncer-full = "0.6"
arc-swap = "1"

# OAuth-adjacent crypto + secret hygiene
sha2 = "0.11"
rand = "0.9"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# Test deps (used in dev-dependencies of individual crates)
wiremock = "0.6"
insta = { version = "1", features = ["yaml", "json"] }
tokio-test = "0.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# `opt-level = "z"` optimizes for binary size at the cost of runtime
# speed (roughly 10-30% smaller binary, ~5-15% slower hot paths
# depending on benchmark). routectl is a streaming-translation proxy
# where per-request latency directly affects user-visible streaming
# feel, so this trade is debatable. Kept at "z" because (a) the
# default deploy target is a single-binary CLI where size matters,
# (b) the dominant cost in practice is upstream provider latency
# (~tens-of-ms to seconds per request), not routectl's own
# translation overhead (~hundreds of us). Flip to "3" (max speed)
# if benchmarking shows routectl's overhead becomes the bottleneck
# or the deploy target stops caring about binary size.
opt-level = "z"
panic = "abort"

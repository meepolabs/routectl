# cargo-deny config: license + advisory + duplicate dependency checks.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Licenses encountered in the workspace dep tree (verified by `cargo
# deny check licenses`). Keep tight: every entry is explicit so a new
# transitive dep with a non-standard license fails CI loudly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots ships under the Community Data License Agreement
    # (Permissive 2.0). It vendors the Mozilla CA bundle, which is the
    # source of the CDLA terms; the actual code is permissively licensed
    # but the bundle metadata uses CDLA. Required by hyper-rustls /
    # aws-smithy-http-client transitively.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Disallow `version = "*"` style wildcards in registry deps, but ALLOW
# the workspace path-only inheritance pattern
# (`routectl-core = { path = "..." }` in workspace deps + `.workspace = true`
# in member crates). Without this, every internal crate-to-crate dep
# trips the wildcard rule, which is noise.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

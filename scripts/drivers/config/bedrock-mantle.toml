# Hermetic driver config for the `bedrock-mantle` lane: the bedrock-mantle
# endpoint's Anthropic Messages, OpenAI Responses, and OpenAI Chat
# Completions vocabularies.
#
# The candidates are the models the AWS docs list as served in-Region on
# bedrock-mantle in us-east-1, each on the vocabulary its doc page names:
# Claude on Messages, the GPT-5.x/6.x family on Responses, and the
# open-weight models on Chat Completions (one GPT-6 model also rides Chat
# Completions so that vocabulary is exercised on a reasoning model).
#
# COMMITTED ON PURPOSE. `scripts/capture_driver.sh` hashes THIS FILE and
# records the digest as `meta.config_sha` on every fixture the lane
# produces, so a rerun of a case under a drifted config reads as a config
# change rather than as client drift. Editing this file therefore
# invalidates every prior fixture's comparability -- that is the intent,
# not a hazard, but it means an edit is a deliberate act.
#
# Nothing here is environment-derived: no real path, no account, no
# credential. The only credential is a REFERENCE to the AWS profile
# `routectl-cell`, a fixed placeholder: the capture-cell wrapper
# (scripts/container/run_capture.sh) writes a one-profile AWS config under
# that name from the operator's own profile and points the daemon alone at
# it. With no such config the daemon cannot resolve the profile and never
# becomes healthy, rather than silently routing somewhere else.
#
# The daemon's state (usage database, catalog state) lands under
# `$XDG_CONFIG_HOME/routectl/`, which the runner points at a throwaway
# directory. That default resolution is what keeps a driven run off the
# operator's own state -- no path in this file names it.
#
# Model is a matrix dimension on this lane: every `[models.<nick>]` entry
# below is one candidate, and `scripts/wire_watch/models.tsv` lists the
# same nicknames with their tier and the doc each upstream id came from.
# The two are welded by `scripts/drivers/config/lane_configs.test.sh`, so a
# model is added or removed in BOTH files or neither. A candidate this
# account cannot use is expected: the upstream's access-denied answer is
# recorded as not-run, never as a wire finding.

version = 5

# Placeholder only. The runner ALWAYS overrides the bind port on the
# command line (`serve --port`), because it selects a free port at boot
# time. Overriding rather than rewriting this file keeps the hashed bytes
# identical across runs: a port-patched copy would hash differently every
# run and `meta.config_sha` would stop distinguishing config drift from
# noise.
[server]
host = "127.0.0.1"
port = 8787

# The mantle endpoint speaks three vocabularies, one provider kind each,
# all on the SAME region and the SAME AWS profile (`routectl-cell`, see the
# header), SigV4-signed. This lane names only us-east-1. `region` derives
# both the endpoint host and the signing scope, so no `base_url` appears.
[providers.mantle-anthropic]
kind = "anthropic-api"

[providers.mantle-anthropic.bedrock_mantle]
region = "us-east-1"
creds  = { kind = "profile", name = "routectl-cell" }

# `api_key_ref` is a required key on this kind and must be empty: the
# sub-table carries the credential.
[providers.mantle-responses]
kind        = "openai-responses"
api_key_ref = ""

[providers.mantle-responses.bedrock_mantle]
region = "us-east-1"
creds  = { kind = "profile", name = "routectl-cell" }

[providers.mantle-chat]
kind        = "openai-compat"
api_key_ref = ""

[providers.mantle-chat.bedrock_mantle]
region = "us-east-1"
creds  = { kind = "profile", name = "routectl-cell" }


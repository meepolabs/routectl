# Hermetic driver config for the `openai-compat` lane, Ollama Cloud
# variant: the OpenAI Chat Completions wire shape against ollama.com
# rather than api.openai.com.
#
# COMMITTED ON PURPOSE. `scripts/capture_driver.sh` hashes THIS FILE and
# records the digest as `meta.config_sha` on every fixture the lane
# produces, so a rerun of a case under a drifted config reads as a config
# change rather than as client drift. Editing this file therefore
# invalidates every prior fixture's comparability -- that is the intent,
# not a hazard, but it means an edit is a deliberate act.
#
# It is a deployment VARIANT of `openai-compat.toml`, not a twin: the
# upstream host, the credential, and the model all differ, so nothing
# pins the two files to each other.
#
# Nothing here is environment-derived: no real path, no account, no
# credential. The only credential is a REFERENCE to an env var the runner
# forwards from its caller (the `ROUTECTL_DRIVER_*` passthrough
# namespace); an unset one keeps the daemon from starting rather than
# silently routing somewhere else.
#
# The daemon's state (usage database, catalog state) lands under
# `$XDG_CONFIG_HOME/routectl/`, which the runner points at a throwaway
# directory. That default resolution is what keeps a driven run off the
# operator's own state -- no path in this file names it.

version = 5

# Placeholder only. The runner ALWAYS overrides the bind port on the
# command line (`serve --port`), because it selects a free port at boot
# time. Overriding rather than rewriting this file keeps the hashed bytes
# identical across runs: a port-patched copy would hash differently every
# run and `meta.config_sha` would stop distinguishing config drift from
# noise.
[server]
host = "127.0.0.1"
port = 8787

# Ollama Cloud's OpenAI-compatible base URL, per
# https://docs.ollama.com/api/openai-compatibility -- the key is sent as
# `Authorization: Bearer`. The env var is keyed on the provider name
# (`ollama`), not on the lane, per the `ROUTECTL_DRIVER_<PROVIDER>_API_KEY`
# convention.
[providers.ollama]
kind        = "openai-compat"
base_url    = "https://ollama.com/v1"
api_key_ref = "env://ROUTECTL_DRIVER_OLLAMA_API_KEY"

# The cloud model the Ollama Cloud docs name for direct API calls
# (https://docs.ollama.com/cloud).
[models.ollama-gemma4-31b]
provider = "ollama"
upstream = "gemma4:31b"

# `claude-*` catches the model ids an Anthropic-dialect client asks for by
# name; `default` catches whatever a Chat Completions client was configured
# with, so a driver does not have to know routectl's alias vocabulary.
[aliases]
"claude-*" = "ollama-gemma4-31b"
default    = "ollama-gemma4-31b"

# Every attempt is checked, not the 1-in-100 sample a production daemon
# uses: a driven run is a few dozen attempts per cell, so the default rate
# would leave most of them unchecked and a wire loss would surface only by
# luck. `first_n` stays at its default; past it, this rate governs.
[wire_check]
sample_one_in = 1

# A driver selects a candidate by passing its nickname as the model, so no
# glob below may prefix a nickname: a glob outranks a direct nickname and
# would silently route the cell to a different model. `default` is the
# lane's full-case-set model.
[aliases]
"claude-*" = "invoke-claude-sonnet-5-5"
default = "invoke-claude-sonnet-5-5"

# Every attempt is checked, not the 1-in-100 sample a production daemon
# uses: a driven run is a few dozen attempts per cell, so the default rate
# would leave most of them unchecked and a wire loss would surface only by
# luck. `first_n` stays at its default; past it, this rate governs.
[wire_check]
sample_one_in = 1

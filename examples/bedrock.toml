# [bedrock] global section -- copy this into your config.toml when you
# want to gate which `anthropic_beta` flags and top-level body fields
# routectl forwards to AWS Bedrock.
#
# Both lists below are OPTIONAL. routectl ships no built-in default;
# AWS schema drift on the gated set is operator-tracked, not release-
# bound. If you omit either list (or omit the entire [bedrock] section)
# the corresponding filter runs in PASS-THROUGH mode -- routectl
# forwards every flag/field as-is, with two exceptions that hold in
# every mode: the built-in Bedrock-rejected betas
# (advanced-tool-use-2025-11-20, advisor-tool-2026-03-01,
# prompt-caching-scope-2026-01-05) are withheld unless the operator
# floor (`[providers.X] anthropic_beta` or a `header_extras`-pinned
# beta) sends them, and `mcp_servers` is never forwarded. This is the
# discovery-mode default:
# bring up routectl, capture observed traffic via
#
#   ROUTECTL_LOG=routectl_providers::bedrock=trace ./routectl serve
#
# extract the field/flag names from the trace `body=...` lines, and
# populate the lists with what your account expects.
#
# When you DO populate `allowed_body_fields`, startup validation
# requires the routectl-mandatory keys (`messages`, `anthropic_version`,
# `max_tokens`); a partial list silently breaks every Bedrock request,
# so it surfaces as a clean Error::Config at startup.
#
# The lists below are the empirically verified baseline as of
# 2026-05-12, derived from direct boto3 traffic against
# `bedrock-runtime.us-west-2.amazonaws.com` (haiku-4-5 / sonnet-4-6 /
# opus-4-7 -- identical results across all three; Bedrock has one
# allowlist, not per-model). Fields absent from the lists below (e.g.
# mcp_servers, diagnostics, context_hint, speed) were either rejected
# with a 400 by the Bedrock runtime or are Anthropic-ingress-only
# forward-compat fields that AWS has not implemented.

[bedrock]

# AWS validates each anthropic_beta value independently and 400s the
# entire request on the first unsupported flag. claude-code's TS SDK
# ships up to ten betas via the `anthropic-beta` HTTP header; those
# that are not on this list drop at DEBUG before send. Empty list (or
# omitted field) = pass-through, except the built-in Bedrock-rejected
# betas (advanced-tool-use-2025-11-20, advisor-tool-2026-03-01,
# prompt-caching-scope-2026-01-05), which are withheld in either mode
# and even when listed here, unless the operator floor sends them.
#
# CARVE-OUT: "structured-outputs-2025-12-15" is force-added whenever a
# request's assembled body carries `output_config.format`, whether or not
# it appears below -- it is a server requirement implied by the in-use
# feature, not a client-opted beta. A model that refuses structured
# outputs (or a tool type such as web_search) is learned after its first
# rejection and skipped for later requests that carry it; to skip even
# that first miss, declare the feature in the provider's
# `unsupported_features`.
allowed_betas = [
  "context-1m-2025-08-07",
  "claude-code-20250219",
  "interleaved-thinking-2025-05-14",
  "context-management-2025-06-27",
  "effort-2025-11-24",
  "fine-grained-tool-streaming-2025-05-14",
  # Capability-expanding betas. AWS account gating still controls the
  # actual enablement; including these here only declares "if AWS
  # gates them on, allow them through routectl." Verify your account
  # has the corresponding capabilities enabled before relying on them.
  "computer-use-2025-01-24",
  "computer-use-2024-10-22",
  "mcp-client-2025-04-04",
  "search-results-2025-06-09",
  "tool-search-tool-2025-10-19",
  "web-search-2025-03-05",
  "structured-outputs-2025-12-15",
  "task-budgets-2026-03-13",
  "afk-mode-2026-01-31",
  "token-counting-2024-11-01",
]

# Bedrock-accepted top-level body fields (Invoke) /
# `additionalModelRequestFields` keys (Converse). Forward-compat sweep
# entries from the Anthropic ingress (e.g. `mcp_servers`, `diagnostics`,
# `context_hint`, `speed`) are NOT on this list and drop at DEBUG
# before send. When set, must include the routectl-mandatory keys
# (`anthropic_version`, `max_tokens`, `messages`) -- startup
# validation enforces this. Empty list (or omitted field) = pass-
# through (no allowlist filtering); good for initial bring-up to observe
# what fields get sent. `mcp_servers` is never forwarded in either mode,
# even if listed: Bedrock rejects it on both carriers.
allowed_body_fields = [
  "anthropic_version",
  "anthropic_beta",
  "max_tokens",
  "messages",
  "system",
  "temperature",
  "top_p",
  "top_k",
  "tools",
  "tool_choice",
  "stop_sequences",
  "thinking",
  "output_config",
  "cache_control",
  "metadata",
  "context_management",
]

# ---- Per-provider capability gate ----
# A Bedrock Invoke leg whose Claude model does NOT natively enforce
# structured outputs (output_config.format) or strict tool use will emit
# unconstrained, malformed tool_use JSON the client cannot parse. Declare
# the request-derived `structured_output` feature unsupported so those
# requests skip this provider and fall back to a leg that enforces it
# (e.g. api.anthropic.com). The router drops the leg BEFORE dispatch --
# no per-target 400, no breaker churn.
#
# [providers.bedrock-invoke]
# kind      = "bedrock"
# region    = "us-west-2"
# creds     = { kind = "default-chain" }
# api_shape = "invoke"
# unsupported_features = ["structured_output"]

# [bedrock] global section -- copy this into your config.toml when any
# provider has `kind = "bedrock"`. routectl ships no built-in default
# for either list below; AWS schema drift on the gated set is operator-
# tracked, not release-bound. Without the section, every Bedrock
# request 400s on the egress (forward-compat sweep entries from the
# Anthropic ingress carry fields AWS does not accept).
#
# Both lists below are the empirically verified baseline as of
# 2026-05-12, derived from direct boto3 traffic against
# `bedrock-runtime.us-west-2.amazonaws.com` (haiku-4-5 / sonnet-4-6 /
# opus-4-7 -- identical results across all three; Bedrock has one
# allowlist, not per-model). See `issues.md::INV-6` and `INV-7` for
# the full table and rationale per rejected entry.
#
# Update these lists as your account's gating evolves -- no routectl
# rebuild required. Startup validation rejects an empty list when any
# provider has `kind = "bedrock"`, and rejects an `allowed_body_fields`
# list missing the routectl-mandatory keys
# (`anthropic_version`, `max_tokens`, `messages`).

[bedrock]

# AWS validates each anthropic_beta value independently and 400s the
# entire request on the first unsupported flag. claude-code's TS SDK
# ships up to ten betas via the `anthropic-beta` HTTP header; those
# that are not on this list drop at DEBUG before send.
allowed_betas = [
  "context-1m-2025-08-07",
  "claude-code-20250219",
  "interleaved-thinking-2025-05-14",
  "context-management-2025-06-27",
  "effort-2025-11-24",
  "fine-grained-tool-streaming-2025-05-14",
  # Capability-expanding betas. AWS account gating still controls the
  # actual enablement; including these here only declares "if AWS
  # gates them on, allow them through routectl." Verify your account
  # has the corresponding capabilities enabled before relying on them.
  "computer-use-2025-01-24",
  "computer-use-2024-10-22",
  "mcp-client-2025-04-04",
  "search-results-2025-06-09",
  "tool-search-tool-2025-10-19",
  "web-search-2025-03-05",
  "structured-outputs-2025-12-15",
  "task-budgets-2026-03-13",
  "afk-mode-2026-01-31",
  "token-counting-2024-11-01",
]

# Bedrock-accepted top-level body fields (Invoke) /
# `additionalModelRequestFields` keys (Converse). Forward-compat sweep
# entries from the Anthropic ingress (e.g. `mcp_servers`, `diagnostics`,
# `context_hint`, `speed`) are NOT on this list and drop at DEBUG
# before send. Keep the routectl-mandatory keys
# (`anthropic_version`, `max_tokens`, `messages`) -- startup validation
# enforces this.
allowed_body_fields = [
  "anthropic_version",
  "anthropic_beta",
  "max_tokens",
  "messages",
  "system",
  "temperature",
  "top_p",
  "top_k",
  "tools",
  "tool_choice",
  "stop_sequences",
  "thinking",
  "output_config",
  "cache_control",
  "metadata",
  "context_management",
]

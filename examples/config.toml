# Example routectl config (v0.6+ schema). Copy to
# ~/.config/routectl/config.toml and edit. Validate with:
#   routectl config check

# Schema version this file targets. routectl refuses a config older than
# the schema the running binary writes; run `routectl config migrate` to
# bring an older file forward. See docs/CONFIGURATION.md.
version = 3

# routectl config has three first-class tables:
#
# [providers.X]   Transport + auth ONLY. How to reach an upstream.
#                 (kind, api_key_ref, base_url, region/creds for
#                 Bedrock, header_extras, runtime gates, ...)
#
# [models.X]      A model declaration. Points at one provider, names
#                 the upstream model id, owns its reasoning capability
#                 declaration (supports_adaptive_thinking, effort_levels,
#                 max_thinking_budget).
#
# [aliases]       Wire-string -> model nickname routing. One flat
#                 table, single value or list (chain) per key.
#                 `default = "..."` is a special key for the catch-all.
#                 Keys ending in `*` are suffix globs, e.g.
#                 `"claude-opus-*" = "opus-heavy"`.
#
# Caller intent flows through directly: the egress emits whatever the
# caller sent for reasoning.effort. Use effort_levels to declare which
# values this model accepts; use supports_adaptive_thinking to select
# the wire shape.

[server]
host = "127.0.0.1"
port = 8787
# strict_translation = true     # production CI: 400 on lossy seams.
# unsafe_public via CLI flag    # bind non-loopback only with --unsafe-public.

# Listener auth -- enable when binding non-loopback. Tokens are
# secret-refs (env://, file://, literal:) and resolve at startup.
# [server.auth]
# tokens = ["env://ROUTECTL_LISTENER_TOKEN"]

# ---- Providers (transport + auth) ----

# OpenAI-compatible host. Use this kind for OpenAI direct, OpenRouter,
# DeepSeek, Groq, NIM, vLLM, llama.cpp, and any host that speaks the
# OpenAI Chat Completions wire shape.
[providers.openrouter]
kind        = "openai-compat"
base_url    = "https://openrouter.ai/api/v1"
api_key_ref = "env://OPENROUTER_API_KEY"

[providers.deepseek]
kind        = "openai-compat"
base_url    = "https://api.deepseek.com/v1"
api_key_ref = "env://DEEPSEEK_API_KEY"

# Anthropic Messages API direct.
[providers.anthropic]
kind        = "anthropic-api"
api_key_ref = "env://ANTHROPIC_API_KEY"

# Anthropic via OAuth bearer (Claude Pro/Max subscription).
# api_key_ref resolves to a `sk-ant-oat01-...` access token.
[providers.anthropic-oauth]
kind        = "anthropic-api"
api_key_ref = "file://<local-path>"
auth_kind   = "oauth-bearer"
header_extras = { "anthropic-beta" = "claude-code-20250219,oauth-2025-04-20" }

# OpenAI Responses API via ChatGPT subscription bearer JWT (Codex).
[providers.codex]
kind           = "openai-responses"
auth_kind      = "chatgpt-oauth"
api_key_ref    = "file://<local-path>"
account_id_ref = "literal:00000000-0000-0000-0000-000000000000"

# AWS Bedrock with the default credential chain (env -> profile ->
# SSO -> IRSA -> IMDS). Region applies to every model on this provider.
[providers.bedrock]
kind   = "bedrock"
region = "us-west-2"
creds  = { kind = "default-chain" }
# api_shape = "invoke"            # default; use "converse" for vendor-neutral.
# anthropic_beta = ["context-1m-2025-08-07"]   # account-scoped beta floor.

# Gemini via the Cloud Code ("antigravity") surface. Uses the OAuth
# identity stored by `routectl login antigravity` -- no static key.
# [providers.gemini-cloudcode]
# kind        = "gemini"
# api_key_ref = "oauth://antigravity"
# auth_mode   = "cloud-code"

# ---- Models (provider + upstream + reasoning capability) ----
# Each model picks its provider, names the upstream wire model id,
# and declares its reasoning capabilities. Two models may share a
# provider; Bedrock builds a separate provider instance per model so
# each gets its own circuit breaker.

# Adaptive-thinking model on Anthropic direct (Opus 4.7+).
# supports_adaptive_thinking = true selects the adaptive wire shape:
#   { "thinking": { "type": "adaptive" }, "output_config": { "effort": "..." } }
# Declare all effort levels the model accepts so egresses can clamp
# caller intent to a valid value; empty list = pass-through.
[models.opus-direct]
provider                   = "anthropic-oauth"
upstream                   = "claude-opus-4-7-20260301"
# Adaptive thinking wire shape (Opus 4.7+ only).
supports_adaptive_thinking = true
# Full vocabulary unlocked: minimal through max.
effort_levels              = ["minimal", "low", "medium", "high", "xhigh", "max"]

# Bedrock-hosted Sonnet 4.5 (legacy fixed-budget thinking shape).
# supports_adaptive_thinking defaults to false: egress emits
#   { "thinking": { "type": "enabled", "budget_tokens": N } }
# max_thinking_budget caps the budget the egress may allocate.
[models.sonnet-bedrock]
provider                   = "bedrock"
upstream                   = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
# Legacy thinking shape; adaptive not supported on this model.
supports_adaptive_thinking = false
# Mid-range effort levels; xhigh/max not declared for this tier.
effort_levels              = ["low", "medium", "high"]
# Hard cap on thinking budget (tokens); 0 = no cap / use egress default.
max_thinking_budget        = 16000

# Bedrock-hosted Haiku 4.5 -- cost-optimized, no reasoning tier.
# effort_levels defaults to ["low","medium","high"]; override to empty
# to pass caller effort through verbatim (OpenRouter-style pass-through).
[models.haiku-bedrock-cheap]
provider      = "bedrock"
upstream      = "us.anthropic.claude-haiku-4-5-20251001-v1:0"

# Reasoning-tier model on DeepSeek.
[models.deepseek-r]
provider          = "deepseek"
upstream          = "deepseek-reasoner"
# deepseek v4+ requires reasoning echo-back on multi-turn history.
history_reasoning = "preserve"
# DeepSeek uses its own reasoning_content field, not standard effort.
reasoning_dialect = "deepseek"
# DeepSeek's reasoning endpoint understands high/xhigh effort.
effort_levels     = ["low", "medium", "high", "xhigh"]

# OpenRouter passthrough -- no effort clamping; OpenRouter decides
# its own effort translation. Empty effort_levels = pass-through.
[models.opus-or]
provider      = "openrouter"
upstream      = "anthropic/claude-opus-4-7-20260301"
# Empty list: OpenRouter translates effort itself; do not clamp.
effort_levels = []

# Heavy-tier on Codex (OpenAI Responses API, OpenAI-shape egress).
# effort_levels clamping applies on OpenAI-shape egresses: a caller
# that sends "xhigh" is clamped down to "high" for this model.
[models.codex-deep]
provider      = "codex"
upstream      = "gpt-5.4"
effort_levels = ["low", "medium", "high"]

# Cost-tier on Codex (same provider, narrower effort range).
[models.codex-fast]
provider      = "codex"
upstream      = "gpt-5.4"
effort_levels = ["low", "medium"]

# Per-model max_output_tokens override -- only consumed by the
# Anthropic-shape egresses (anthropic-api, bedrock-invoke) when the
# caller OMITS max_tokens. Default is None -> falls through to a 64000
# baseline. Set when an Anthropic-shape egress points at a model whose
# upstream max_tokens cap is below 64000, so callers that omit the
# field don't 400 on the upstream's per-model validation.
# [models.opus-legacy]
# provider          = "anthropic-oauth"
# upstream          = "claude-opus-4"
# max_output_tokens = 32000              # older Opus 4 caps at 32000

# ---- Aliases (wire-string -> model nickname) ----
# A single key with a string value resolves to one model. A list value
# is a fallback chain -- earlier entries try first.
#
# `default = "..."` is the catch-all when no other entry matches.
# Keys ending in `*` are suffix globs; longest matching prefix wins.

[aliases]
# Fallback chain: try Anthropic OAuth first, fall back to Bedrock if
# the subscription rate-limits or returns 5xx.
heavy = ["opus-direct", "sonnet-bedrock"]

# Glob: every claude-opus release routes to opus-direct.
"claude-opus-*" = "opus-direct"

# Glob: claude-sonnet releases prefer Bedrock.
"claude-sonnet-*" = "sonnet-bedrock"

# Glob: claude-haiku releases hit the cheap-tier model.
"claude-haiku-*" = "haiku-bedrock-cheap"

# Specific exact match -- wins over any glob that also matches.
"deepseek-reasoner" = "deepseek-r"

# Default: any wire model that doesn't match exact or glob lands here.
default = "codex-deep"

# ---- Retry policy (server-wide) ----

[retry]
max_attempts                  = 2
initial_backoff_ms            = 250
backoff_multiplier            = 2.0
jitter_ms                     = 50
# Fallback/retry is decided per failure CLASS, not per raw status code.
# Every 4xx/5xx falls back under the baked class defaults; to narrow or
# widen a specific class, set `[retry.classes.<class>]` (e.g.
# `[retry.classes.server-error] fallback = false`) or a per-provider
# `[providers.X.class_overrides]` remap. See docs/CONFIGURATION.md.
request_timeout_ms            = 300000        # 5 min per attempt
stream_first_byte_timeout_ms  = 90000         # 90s -- thinking models stall
# retry_on_429 = 1
# retry_on_network = 2

# ---- Learned-capability subsystem (server-wide) ----
# routectl learns, per target, which capabilities an upstream rejects
# and routes around them. This block is the kill switch plus tempo
# knobs; every field carries the shown default, so the whole block is
# optional. Set enabled = false to leave any learned entries inert.

[capability]
enabled               = true    # master switch for the subsystem
decay_hours           = 48      # how long a learned negative acts before a re-probe
inferred_window_hours = 1       # window for a second observation to confirm an inferred signal
staleness_hint_days   = 14      # age past which a verified capability reads as stale in diagnostics

# ---- Bedrock global filters (operator-owned allowlists) ----
# Empty list (or section omitted) = pass-through. See
# examples/bedrock.toml for the empirical baseline (16 betas + 16
# body fields). Populate via TRACE-log discovery against your AWS
# account, then tune.

# [bedrock]
# allowed_betas = []
# allowed_body_fields = []

# ---- claude-code gateway config (optional template) ----
# Drop-in snippet for fronting claude-code with routectl. See
# docs/CONFIGURATION.md "claude-code as a gateway client" for the
# full setup checklist (env vars on the claude-code side, the
# `routectl login anthropic` step, and what works / doesn't).
#
# Step 1: `routectl login anthropic` once -- writes the OAuth token
# into ~/.config/routectl/credentials.json. Then uncomment below.

# [providers.anthropic-managed]
# kind          = "anthropic-api"
# api_key_ref   = "oauth://anthropic"          # resolves at request time
# auth_kind     = "oauth-bearer"
# user_agent    = "claude-cli/2.1.143 (external, cli)"
# forward_client_headers = [
#     "x-claude-code-session-id",
#     "x-claude-code-agent-id",
#     "x-claude-code-parent-agent-id",
# ]
# header_extras = {
#     "anthropic-beta"                            = "claude-code-20250219,oauth-2025-04-20",
#     "x-app"                                     = "cli",
#     "anthropic-dangerous-direct-browser-access" = "true",
#     "x-stainless-arch"                          = "x64",
#     "x-stainless-lang"                          = "js",
#     "x-stainless-os"                            = "Linux",
#     "x-stainless-package-version"               = "0.94.0",
#     "x-stainless-runtime"                       = "node",
#     "x-stainless-runtime-version"               = "v24.3.0",
#     "x-stainless-timeout"                       = "600",
#     "x-stainless-retry-count"                   = "0",
# }

# [models.anthropic-haiku]
# provider = "anthropic-managed"
# upstream = "claude-haiku-4-5-20251001"

# [models.anthropic-sonnet]
# provider = "anthropic-managed"
# upstream = "claude-sonnet-4-6"

# [models.anthropic-opus]
# provider = "anthropic-managed"
# upstream = "claude-opus-4-7"

# [aliases]
# "claude-haiku-*"  = "anthropic-haiku"
# "claude-sonnet-*" = "anthropic-sonnet"
# "claude-opus-*"   = "anthropic-opus"

# ---- context_management emulation (DeepSeek /anthropic or similar) ----
# When an upstream speaks Anthropic Messages but does not implement
# context-management-2025-06-27 natively, set context_management = true
# so routectl caches thinking blocks and re-injects them on tool turns.
# Also requires history_reasoning = "preserve" on the MODEL so thinking
# blocks echo back to the upstream intact.

# [providers.deepseek-anthropic]
# kind               = "anthropic-api"
# base_url           = "https://api.deepseek.com/anthropic"
# api_key_ref        = "env://DEEPSEEK_API_KEY"
# context_management = true

# [models.deepseek-r1]
# provider          = "deepseek-anthropic"
# upstream          = "deepseek-reasoner"
# history_reasoning = "preserve"

# ---- MITM front-proxy (optional, default off) ----
# Presence of [mitm] gates the feature on -- a local TLS-terminating
# listener that fronts a first-party upstream (e.g. Claude Code
# talking to api.anthropic.com) so routectl can observe and translate
# decrypted traffic. Every field below carries the shown default;
# uncomment [mitm] alone to enable with defaults, or override any
# field. listen_port must differ from [server] port.

# [mitm]
# upstream_origin   = "https://api.anthropic.com"
# listen_port       = 8443
# cert_dir          = "/home/you/.config/routectl/mitm-certs"  # CA/leaf certs
# mitm_host         = "api.anthropic.com"
# tested_cc_version = "2.1.143"
# ^ last-verified CC version; triggers a once-per-version runtime mismatch
#   WARNING (advisory in that it never refuses)


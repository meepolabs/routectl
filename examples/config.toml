# Example routectl config (v0.6+ schema). Copy to
# ~/.config/routectl/config.toml and edit. Validate with:
#   routectl config check

# routectl config has three first-class tables:
#
# [providers.X]   Transport + auth ONLY. How to reach an upstream.
#                 (kind, api_key_ref, base_url, region/creds for
#                 Bedrock, header_extras, runtime gates, ...)
#
# [models.X]      A model declaration. Points at one provider, names
#                 the upstream model id, owns its reasoning defaults
#                 (thinking, enabled, adaptive_thinking, ...).
#
# [aliases]       Wire-string -> model nickname routing. One flat
#                 table, single value or list (chain) per key.
#                 `default = "..."` is a special key for the catch-all.
#                 Keys ending in `*` are suffix globs, e.g.
#                 `"claude-opus-*" = "opus-heavy"`.
#
# Caller request shape > model defaults > provider/internal defaults.
# An incoming `reasoning.effort = "minimal"` always wins over an
# operator-configured `[models.X] thinking = "high"`. Use models'
# defaults to set a floor when the caller is silent.

[server]
host = "127.0.0.1"
port = 8787
# strict_translation = true     # production CI: 400 on lossy seams.
# unsafe_public via CLI flag    # bind non-loopback only with --unsafe-public.

# Listener auth -- enable when binding non-loopback. Tokens are
# secret-refs (env://, file://, literal:) and resolve at startup.
# [server.auth]
# tokens = ["env://ROUTECTL_LISTENER_TOKEN"]

# ---- Providers (transport + auth) ----

# OpenAI-compatible host. Use this kind for OpenAI direct, OpenRouter,
# DeepSeek, Groq, NIM, vLLM, llama.cpp, and any host that speaks the
# OpenAI Chat Completions wire shape.
[providers.openrouter]
kind        = "openai-compat"
base_url    = "https://openrouter.ai/api/v1"
api_key_ref = "env://OPENROUTER_API_KEY"

[providers.deepseek]
kind              = "openai-compat"
base_url          = "https://api.deepseek.com/v1"
api_key_ref       = "env://DEEPSEEK_API_KEY"
reasoning_dialect = "deepseek"
history_reasoning = "preserve"     # deepseek v4+ requires reasoning echo-back.

# Anthropic Messages API direct.
[providers.anthropic]
kind        = "anthropic-api"
api_key_ref = "env://ANTHROPIC_API_KEY"

# Anthropic via OAuth bearer (Claude Pro/Max subscription).
# api_key_ref resolves to a `sk-ant-oat01-...` access token.
[providers.anthropic-oauth]
kind        = "anthropic-api"
api_key_ref = "file://<local-path>"
auth_kind   = "oauth-bearer"
header_extras = { "anthropic-beta" = "claude-code-20250219,oauth-2025-04-20" }

# OpenAI Responses API via ChatGPT subscription bearer JWT (Codex).
[providers.codex]
kind           = "openai-responses"
auth_kind      = "chatgpt-oauth"
api_key_ref    = "file://<local-path>"
account_id_ref = "literal:00000000-0000-0000-0000-000000000000"

# AWS Bedrock with the default credential chain (env -> profile ->
# SSO -> IRSA -> IMDS). Region applies to every model on this provider.
[providers.bedrock]
kind   = "bedrock"
region = "us-west-2"
creds  = { kind = "default-chain" }
# api_shape = "invoke"            # default; use "converse" for vendor-neutral.
# anthropic_beta = ["context-1m-2025-08-07"]   # account-scoped beta floor.

# ---- Models (provider + upstream + reasoning) ----
# Each model picks its provider, names the upstream wire model id,
# and owns its reasoning defaults. Two models may share a provider;
# Bedrock builds a separate provider instance per model so each gets
# its own circuit breaker.

# Heavy-tier reasoning on Codex.
[models.codex-deep]
provider = "codex"
upstream = "gpt-5.4"
thinking = "high"

# Cost-tier reasoning on Codex (same provider, different effort).
[models.codex-fast]
provider = "codex"
upstream = "gpt-5.4"
thinking = "low"

# Anthropic direct, Opus 4.7 with adaptive thinking + max effort.
[models.opus-direct]
provider          = "anthropic-oauth"
upstream          = "claude-opus-4-7-20260301"
thinking          = "xhigh"
adaptive_thinking = true

# Bedrock-hosted Sonnet 4.5 (legacy thinking shape, no adaptive).
[models.sonnet-bedrock]
provider = "bedrock"
upstream = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
thinking = "medium"

# Bedrock-hosted Haiku 4.5 with reasoning pinned off (cost ceiling).
[models.haiku-bedrock-cheap]
provider = "bedrock"
upstream = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"

# Reasoning-tier model on DeepSeek.
[models.deepseek-reasoner]
provider = "deepseek"
upstream = "deepseek-reasoner"
thinking = "high"

# OpenRouter passthrough -- specific Anthropic build, no reasoning floor.
[models.opus-or]
provider = "openrouter"
upstream = "anthropic/claude-opus-4-7-20260301"

# ---- Aliases (wire-string -> model nickname) ----
# A single key with a string value resolves to one model. A list value
# is a fallback chain -- earlier entries try first.
#
# `default = "..."` is the catch-all when no other entry matches.
# Keys ending in `*` are suffix globs; longest matching prefix wins.

[aliases]
# Fallback chain: try Anthropic OAuth first, fall back to Bedrock if
# the subscription rate-limits or returns 5xx.
heavy = ["opus-direct", "sonnet-bedrock"]

# Glob: every claude-opus release routes to opus-direct.
"claude-opus-*" = "opus-direct"

# Glob: claude-sonnet releases prefer Bedrock.
"claude-sonnet-*" = "sonnet-bedrock"

# Glob: claude-haiku releases hit the cheap-tier model.
"claude-haiku-*" = "haiku-bedrock-cheap"

# Specific exact match -- wins over any glob that also matches.
"deepseek-reasoner" = "deepseek-reasoner"

# Default: any wire model that doesn't match exact or glob lands here.
default = "codex-deep"

# ---- Retry policy (server-wide) ----

[retry]
max_attempts                  = 2
initial_backoff_ms            = 250
backoff_multiplier            = 2.0
jitter_ms                     = 50
retry_allowlist               = [408, 429, 500, 502, 503, 504]
request_timeout_ms            = 300000        # 5 min per attempt
stream_first_byte_timeout_ms  = 90000         # 90s -- thinking models stall
# retry_on_429 = 1
# retry_on_network = 2

# ---- Bedrock global filters (operator-owned allowlists) ----
# Empty list (or section omitted) = pass-through. See
# examples/bedrock.toml for the empirical baseline (16 betas + 16
# body fields). Populate via TRACE-log discovery against your AWS
# account, then tune.

# [bedrock]
# allowed_betas = []
# allowed_body_fields = []

